<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>삐릿빠릿 · 주소가 바뀌었어요</title>

<!-- 주소를 옮겼다고 검색 엔진에도 알려 준다 -->
<link rel="canonical" href="https://www.ppiritpparit.com/">
<!-- 자바스크립트가 막힌 곳에서도 넘어가도록 -->
<meta http-equiv="refresh" content="3;url=https://www.ppiritpparit.com/">

<style>
  :root {
    --ground:#FFFBF3; --card:#FFFFFF; --edge:#EFE3CE;
    --ink:#3B3128; --dim:#75664F; --faint:#A08E76;
    --lime:#C3E765; --limeink:#4F6E10;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ground:#1F1B16; --card:#2A241D; --edge:#3E362B;
            --ink:#F7F0E4; --dim:#C6B8A4; --faint:#95856F; --limeink:#C3E765; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--ground); color: var(--ink);
    font-family: 'Gothic A1', system-ui, -apple-system, sans-serif;
    display: grid; place-items: center; padding: 24px; line-height: 1.7;
  }
  .card {
    background: var(--card); border: 1px solid var(--edge); border-radius: 24px;
    padding: 44px 34px; max-width: 440px; width: 100%; text-align: center;
  }
  .kicker { font-size: 12px; font-weight: 800; letter-spacing: .08em; color: var(--limeink); }
  /* 한국어는 낱말 가운데서 끊으면 어색하다. 낱말 단위로만 넘긴다. */
  h1, p { word-break: keep-all; overflow-wrap: break-word; }
  h1 { font-size: clamp(21px, 6vw, 26px); font-weight: 800; margin: 12px 0 14px;
       letter-spacing: -.01em; text-wrap: balance; }
  p { font-size: 14.5px; color: var(--dim); margin: 0 0 26px; }
  a.go {
    display: block; text-decoration: none; background: var(--lime); color: #2E3D0A;
    font-weight: 800; font-size: 15px; padding: 16px; border-radius: 16px;
    font-family: ui-monospace, 'JetBrains Mono', monospace;
  }
  .note { font-size: 12px; color: var(--faint); margin: 20px 0 0; }
  .dots::after {
    content: '·'; animation: d 1.2s steps(4, end) infinite; }
  @keyframes d { 0%{content:'·'} 25%{content:'· ·'} 50%{content:'· · ·'} 75%{content:'· · · ·'} }
  @media (prefers-reduced-motion: reduce) { .dots::after { animation: none; content: '· · ·'; } }
</style>
</head>
<body>
  <div class="card">
    <div class="kicker">DOGYE HIGH SCHOOL</div>
    <h1>삐릿빠릿이 이사했어요</h1>
    <p>새 주소로 옮겨 드릴게요.<br>안 넘어가면 아래를 눌러주세요.</p>
    <a class="go" href="https://www.ppiritpparit.com/">www.ppiritpparit.com</a>
    <p class="note">이 주소는 더 이상 새 자료가 올라오지 않습니다.<br>
       새 주소를 즐겨찾기에 넣어주세요<span class="dots"></span></p>
  </div>
  <script>
    // 곧바로 튕기면 무슨 일인지 모르고 지나간다. 잠깐 보여 주고 넘긴다.
    setTimeout(function () {
      location.replace('https://www.ppiritpparit.com/');
    }, 2500);
  </script>
</body>
</html>
