    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytesResumable, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBBDLP4uI9Mom_UMxKvnYDq9f2V72Y1fB4",
            authDomain: "dogye-archive.firebaseapp.com",
            projectId: "dogye-archive",
            storageBucket: "dogye-archive.firebasestorage.app",
            messagingSenderId: "435225858562",
            appId: "1:435225858562:web:f32232e414dbfc7ba30d1b"
        };

        try {
            const app = initializeApp(firebaseConfig);
            const db = getFirestore(app);
            const auth = getAuth(app);
            const storage = getStorage(app); 

            window.db = db;
            window.auth = auth;
            window.storage = storage; 
            window.appId = "dogye-archive-app";
            window.firebaseMethods = {
                signInAnonymously,
                onAuthStateChanged,
                doc,
                getDoc,
                setDoc,
                updateDoc,
                deleteDoc,
                collection,
                addDoc,
                onSnapshot,
                ref,
                uploadBytesResumable,
                getDownloadURL,
                deleteObject
            };
            window.dispatchEvent(new Event('firebase-initialized'));
        } catch (err) {
            console.warn("Firebase initialization failed. Operating on Secure Offline mode.", err);
            window.firebaseInitError = err.message || String(err);
            window.firebaseMethods = null;
            window.dispatchEvent(new Event('firebase-initialized'));
        }
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const SCHOOL_DOMAIN = "dogye.hs.kr";

        // 🔥 새롭게 추가된 계층형 과목 데이터 구조 (모의고사 카테고리 추가)
        const CURRICULUM = {
            "1학년": {
                "수학": [],
                "국어": [],
                "영어": [],
                "한국사": [],
                "과학": [],
                "사회": [],

            },
            "2학년": {
                "수학": ["대수", "미적분 1", "기하"],
                "국어": ["문학", "독서와 작문"],
                "영어": [],
                "과학": ["물리학", "역학과 에너지", "화학", "화학 반응의 세계", "생명과학", "세포와 물질대사"],
                "사회": ["세계시민과 지리", "세계사", "사회와 문화", "한국지리 탐구", "동아시아 역사 기행", "정치", "윤리와 사상"],
                "모의고사": []
            },
            "3학년": {
                "수학": [],
                "국어": [],
                "영어": [],
                "모의고사": []
            }
        };

        const getRankFromPosition = (pos) => {
            if (pos === '최고 관리자') return 4;
            if (pos === '학습부') return 3;
            if (['회장', '부회장', '총무부', '행정부', '방송부', '홍보부', '체육부'].includes(pos)) return 2;
            return 1;
        };

        const calculateDday = (targetDateStr) => {
            if (!targetDateStr) return '';
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const target = new Date(targetDateStr);
            target.setHours(0, 0, 0, 0);
            const diff = Math.ceil((target - today) / (1000 * 60 * 60 * 24));
            if (diff === 0) return 'D-Day';
            return diff > 0 ? `D-${diff}` : `D+${Math.abs(diff)}`;
        };

        function App() {
            const [user, setUser] = useState(null); 
            const [isLoginView, setIsLoginView] = useState(true);
            const [isLocalMode, setIsLocalMode] = useState(true); 
            const [isFirebaseLoading, setIsFirebaseLoading] = useState(true);
            
            const [activeMainTab, setActiveMainTab] = useState("materials"); 

            const [signUpEmail, setSignUpEmail] = useState("");
            const [signUpPassword, setSignUpPassword] = useState("");
            const [signUpPasswordConfirm, setSignUpPasswordConfirm] = useState("");
            const [signUpName, setSignUpName] = useState("");
            const [signUpGrade, setSignUpGrade] = useState("1학년");
            
            const [loginEmail, setLoginEmail] = useState("");
            const [loginPassword, setLoginPassword] = useState("");
            
            const [materials, setMaterials] = useState([]);
            const [qnaList, setQnaList] = useState([]);
            
            const [selectedMaterial, setSelectedMaterial] = useState(null);
            const [selectedQna, setSelectedQna] = useState(null);
            const [searchQuery, setSearchQuery] = useState("");
            
            // 필터링 상태 확장
            const [activeGradeFilter, setActiveGradeFilter] = useState("전체");
            const [activeSubjectFilter, setActiveSubjectFilter] = useState("전체");
            const [activeSubSubjectFilter, setActiveSubSubjectFilter] = useState("전체");
            
            const [isUploadOpen, setIsUploadOpen] = useState(false);
            const [isQnaWriteOpen, setIsQnaWriteOpen] = useState(false);
            const [isPreviewMode, setIsPreviewMode] = useState(false);
            
            // 업로드 상태 확장
            const [newTitle, setNewTitle] = useState("");
            const [newGrade, setNewGrade] = useState("1학년");
            const [newSubject, setNewSubject] = useState("수학");
            const [newSubSubject, setNewSubSubject] = useState("");
            const [newFiles, setNewFiles] = useState([]); 
            const [newDescription, setNewDescription] = useState("");
            const [uploadProgress, setUploadProgress] = useState(0); 
            
            const [previewFileUrl, setPreviewFileUrl] = useState(null);

            // QnA 작성 상태 확장
            const [newQnaTitle, setNewQnaTitle] = useState("");
            const [newQnaContent, setNewQnaContent] = useState("");
            const [newQnaGrade, setNewQnaGrade] = useState("1학년");
            const [newQnaSubject, setNewQnaSubject] = useState("수학");
            const [newQnaSubSubject, setNewQnaSubSubject] = useState("");
            
            const [isAdminConsoleOpen, setIsAdminConsoleOpen] = useState(false);
            const [adminTab, setAdminTab] = useState("config"); 
            const [adminUserSubTab, setAdminUserSubTab] = useState("active"); 
            const [usersList, setUsersList] = useState([]);
            const [userSearchQuery, setUserSearchQuery] = useState("");

            const [noticeText, setNoticeText] = useState("도계고 실시간 자습실이 오픈되었습니다! 공부 기록을 남기고 명예의 전당에 도전하세요.");
            const [editNotice, setEditNotice] = useState(noticeText);
            const [ddaySettings, setDdaySettings] = useState({ csat: '2026-11-12', examName: '학교 행사', examDate: '2026-12-10' });
            const [editDday, setEditDday] = useState({ ...ddaySettings });

            const [commentInput, setCommentInput] = useState("");
            const [toast, setToast] = useState(null);
            const [customConfirm, setCustomConfirm] = useState(null);
            const [customAlert, setCustomAlert] = useState(null);

            const [liveStudyUsers, setLiveStudyUsers] = useState([]);
            const [studyRecords, setStudyRecords] = useState([]); 
            
            const [isStudying, setIsStudying] = useState(false);
            const [studyStartTime, setStudyStartTime] = useState(null);
            const [elapsedMins, setElapsedMins] = useState(0);
            
            const [isStudyProofModalOpen, setIsStudyProofModalOpen] = useState(false);
            const [recordedMins, setRecordedMins] = useState(0);
            const [studyProofFile, setStudyProofFile] = useState(null);
            const [studyProofProgress, setStudyProofProgress] = useState(0);

            const showToast = (message, type = "success") => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 3000);
            };

            const triggerAlert = (message, title = "도계 아카이브 시스템 안내") => setCustomAlert({ message, title });
            const triggerConfirm = (message, onConfirm, title = "권한 실행 요청") => setCustomConfirm({ message, title, onConfirm });

            const sanitizeEmailForDocId = (email) => (email ? email.replace(/\./g, "_") : "");
            const isValidSchoolEmail = (email) => email ? email.endsWith(`@${SCHOOL_DOMAIN}`) : false;

            useEffect(() => {
                const restoreAndSetupLocal = () => {
                    const savedUser = localStorage.getItem("dogye_current_user");
                    if (savedUser) {
                        try { 
                            const parsed = JSON.parse(savedUser);
                            if(parsed.role === 'admin' && !parsed.rank) { parsed.rank = 4; parsed.position = '최고 관리자'; }
                            if(!parsed.rank) { parsed.rank = 1; parsed.position = '일반 학생'; }
                            if(parsed.totalStudyMins === undefined) parsed.totalStudyMins = 0;
                            setUser(parsed); 
                        } catch (e) {}
                    }
                    
                    const localUsers = JSON.parse(localStorage.getItem("dogye_archive_users") || "[]");
                    const filteredUsers = localUsers.filter(u => u && u.email !== "admin@dogye.hs.kr");
                    if (!filteredUsers.some(u => u && u.email === "secret@dogye.hs.kr")) {
                        filteredUsers.push({
                            name: "secret", email: "secret@dogye.hs.kr", password: "dogyehs2027", grade: "시스템",
                            role: "admin", rank: 4, position: "최고 관리자", status: "active", totalStudyMins: 0, schoolUserId: "admin_master_system"
                        });
                        localStorage.setItem("dogye_archive_users", JSON.stringify(filteredUsers));
                    }
                    
                    const currentUserCheck = savedUser ? JSON.parse(savedUser) : null;
                    const currentUserRank = currentUserCheck?.rank || (currentUserCheck?.role === 'admin' ? 4 : 1);
                    
                    if (currentUserRank >= 2) {
                        const others = filteredUsers.filter(u => u && u.email !== "secret@dogye.hs.kr");
                        setUsersList(others);
                    }
                };

                restoreAndSetupLocal();

                const tryFirebaseSync = () => {
                    if (window.firebaseMethods) {
                        const { onAuthStateChanged, signInAnonymously } = window.firebaseMethods;
                        const auth = window.auth;

                        signInAnonymously(auth).then(() => {
                            onAuthStateChanged(auth, (fUser) => {
                                if (fUser) {
                                    setIsLocalMode(false);
                                    listenToCloudMaterials();
                                    listenToCloudQna();
                                    listenToCloudSettings();
                                    listenToLiveStudyUsers();
                                    listenToStudyRecords();
                                    listenToCloudUsers();
                                }
                                setIsFirebaseLoading(false);
                            });
                        }).catch(() => { setIsLocalMode(true); setIsFirebaseLoading(false); });
                    } else { setIsLocalMode(true); setIsFirebaseLoading(false); }
                };

                const handleFirebaseInitEvent = () => tryFirebaseSync();
                window.addEventListener('firebase-initialized', handleFirebaseInitEvent);
                if (window.firebaseMethods) tryFirebaseSync();

                return () => window.removeEventListener('firebase-initialized', handleFirebaseInitEvent);
            }, []);

            useEffect(() => {
                let interval;
                if (isStudying && studyStartTime) {
                    interval = setInterval(() => {
                        setElapsedMins(Math.floor((Date.now() - studyStartTime) / 60000));
                    }, 60000);
                }
                return () => clearInterval(interval);
            }, [isStudying, studyStartTime]);

            useEffect(() => {
                if (user && liveStudyUsers.length > 0) {
                    const myLiveStatus = liveStudyUsers.find(u => u && u.email === user.email);
                    if (myLiveStatus && !isStudying) {
                        setIsStudying(true);
                        setStudyStartTime(myLiveStatus.startTime);
                        setElapsedMins(Math.floor((Date.now() - myLiveStatus.startTime) / 60000));
                    }
                }
            }, [user, liveStudyUsers]);

            useEffect(() => {
                if (user && user.email && usersList.length > 0) {
                    const myLatest = usersList.find(u => u && u.email === user.email);
                    if (myLatest) {
                        if (myLatest.totalStudyMins !== user.totalStudyMins || myLatest.rank !== user.rank || myLatest.position !== user.position) {
                            setUser(prev => ({
                                ...prev, 
                                totalStudyMins: myLatest.totalStudyMins,
                                rank: myLatest.rank,
                                position: myLatest.position
                            }));
                            const currentSaved = localStorage.getItem("dogye_current_user");
                            if (currentSaved) {
                                try {
                                    const parsed = JSON.parse(currentSaved);
                                    parsed.totalStudyMins = myLatest.totalStudyMins;
                                    parsed.rank = myLatest.rank;
                                    parsed.position = myLatest.position;
                                    localStorage.setItem("dogye_current_user", JSON.stringify(parsed));
                                } catch (e) {}
                            }
                        }
                    }
                }
            }, [usersList, user?.email]);

            const listenToCloudMaterials = () => {
                const { collection, onSnapshot } = window.firebaseMethods;
                onSnapshot(collection(window.db, 'artifacts', window.appId, 'public', 'data', 'materials'), (snapshot) => {
                    const cloudList = [];
                    snapshot.forEach((d) => { if(d.data()) cloudList.push({ ...d.data(), id: d.id }); });
                    cloudList.sort((a, b) => (b.date || "").localeCompare(a.date || ""));
                    setMaterials(cloudList);
                }, () => setIsLocalMode(true));
            };

            const listenToCloudQna = () => {
                const { collection, onSnapshot } = window.firebaseMethods;
                onSnapshot(collection(window.db, 'artifacts', window.appId, 'public', 'data', 'qna'), (snapshot) => {
                    const qList = [];
                    snapshot.forEach((d) => { if(d.data()) qList.push({ ...d.data(), id: d.id }); });
                    qList.sort((a, b) => (b.date || "").localeCompare(a.date || ""));
                    setQnaList(qList);
                });
            };

            const listenToCloudSettings = () => {
                const { doc, onSnapshot } = window.firebaseMethods;
                onSnapshot(doc(window.db, 'artifacts', window.appId, 'public', 'data', 'settings', 'config'), (docSnap) => {
                    if (docSnap.exists() && docSnap.data()) {
                        const data = docSnap.data();
                        if (data.dday) { setDdaySettings(data.dday); setEditDday(data.dday); }
                        if (data.notice !== undefined) { setNoticeText(data.notice); setEditNotice(data.notice); }
                    }
                });
            };

            const listenToCloudUsers = () => {
                const { collection, onSnapshot } = window.firebaseMethods;
                onSnapshot(collection(window.db, 'artifacts', window.appId, 'public', 'data', 'users'), (snapshot) => {
                    const uList = [];
                    snapshot.forEach((d) => {
                        const userData = d.data();
                        if (userData && userData.email !== "secret@dogye.hs.kr" && userData.email !== "admin@dogye.hs.kr") {
                            if (!userData.rank) userData.rank = 1;
                            if (!userData.position) userData.position = '일반 학생';
                            if (!userData.status) userData.status = 'active';
                            if (userData.totalStudyMins === undefined) userData.totalStudyMins = 0;
                            uList.push({ ...userData, id: d.id });
                        }
                    });
                    setUsersList(uList);
                }, (error) => console.warn("유저 목록 로드 실패"));
            };

            const listenToLiveStudyUsers = () => {
                const { collection, onSnapshot } = window.firebaseMethods;
                onSnapshot(collection(window.db, 'artifacts', window.appId, 'public', 'data', 'live_study'), (snapshot) => {
                    const liveList = [];
                    snapshot.forEach((d) => { if(d.data()) liveList.push({ ...d.data(), id: d.id }); });
                    setLiveStudyUsers(liveList);
                });
            };

            const listenToStudyRecords = () => {
                const { collection, onSnapshot } = window.firebaseMethods;
                onSnapshot(collection(window.db, 'artifacts', window.appId, 'public', 'data', 'study_records'), (snapshot) => {
                    const rList = [];
                    snapshot.forEach((d) => { if(d.data()) rList.push({ ...d.data(), id: d.id }); });
                    rList.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                    setStudyRecords(rList);
                });
            };

            const handleLogin = (e) => {
                e.preventDefault();
                if (!loginEmail || !loginPassword) return triggerAlert("이메일 주소와 패스워드를 올바르게 입력해 주세요.");
                if (loginEmail === "admin@dogye.hs.kr") return triggerAlert("이 계정은 보안상 영구 폐기되었습니다. 새로운 마스터(secret) 계정을 사용해 주세요.");

                if (loginEmail === "secret@dogye.hs.kr" && loginPassword === "dogyehs2027") {
                    const adminSession = { name: "secret", email: "secret@dogye.hs.kr", grade: "시스템", role: "admin", rank: 4, position: "최고 관리자", status: "active", totalStudyMins: 0, schoolUserId: "admin_master_system" };
                    setUser(adminSession);
                    localStorage.setItem("dogye_current_user", JSON.stringify(adminSession));
                    showToast("최상위 [secret] 권한으로 시스템에 접속했습니다.");
                    return;
                }

                if (!isValidSchoolEmail(loginEmail)) return triggerAlert("인가되지 않은 사용자입니다. 도계고 이메일 규격 외 접속은 허용되지 않습니다.");

                const localUsers = JSON.parse(localStorage.getItem("dogye_archive_users") || "[]");
                const found = localUsers.find(u => u && u.email === loginEmail);

                if (found && found.password === loginPassword) {
                    if (found.status === 'suspended') return triggerAlert("관리자에 의해 사이트 이용이 정지된 계정입니다. 부서에 문의하세요.");
                    if (!found.rank) { found.rank = 1; found.position = "일반 학생"; } 
                    if (found.totalStudyMins === undefined) found.totalStudyMins = 0;
                    setUser(found);
                    localStorage.setItem("dogye_current_user", JSON.stringify(found));
                    showToast(`반가워요, ${found.name}님!`);
                } else {
                    triggerAlert("정보가 일치하지 않거나 가입되지 않은 이메일입니다.");
                }
            };

            const handleSignUp = (e) => {
                e.preventDefault();
                if (!signUpName || !signUpEmail || !signUpPassword) return triggerAlert("모든 양식을 채워주세요.");
                if (signUpPassword !== signUpPasswordConfirm) return triggerAlert("비밀번호 확인이 다릅니다.");
                if (!isValidSchoolEmail(signUpEmail)) return triggerAlert("도계고 학생만 가입 가능합니다 (@dogye.hs.kr).");

                const localUsers = JSON.parse(localStorage.getItem("dogye_archive_users") || "[]");
                if (localUsers.some(u => u && u.email === signUpEmail)) return triggerAlert("이미 가입된 이메일입니다.");

                const newUser = { 
                    name: signUpName, email: signUpEmail, password: signUpPassword, grade: signUpGrade, 
                    role: "student", rank: 1, position: "일반 학생", status: "active", totalStudyMins: 0,
                    schoolUserId: "student_" + Date.now() 
                };
                localUsers.push(newUser);
                localStorage.setItem("dogye_archive_users", JSON.stringify(localUsers));

                if (!isLocalMode && window.firebaseMethods) {
                    const { doc, setDoc } = window.firebaseMethods;
                    setDoc(doc(window.db, 'artifacts', window.appId, 'public', 'data', 'users', sanitizeEmailForDocId(signUpEmail)), newUser).catch(() => {});
                }

                setUser(newUser);
                localStorage.setItem("dogye_current_user", JSON.stringify(newUser));
                showToast("도계 아카이브 회원 자격이 승인되었습니다!");
            };

            const handleLogout = () => {
                setUser(null);
                localStorage.removeItem("dogye_current_user");
                showToast("로그아웃 되었습니다.");
            };

            const startLiveStudy = async () => {
                if (isLocalMode) return triggerAlert("자습실 기능은 클라우드 모드에서만 작동합니다.");
                
                const sTime = Date.now();
                setIsStudying(true);
                setStudyStartTime(sTime);
                setElapsedMins(0);
                
                const { doc, setDoc } = window.firebaseMethods;
                const docId = sanitizeEmailForDocId(user.email);
                await setDoc(doc(window.db, 'artifacts', window.appId, 'public', 'data', 'live_study', docId), {
                    name: user.name,
                    email: user.email,
                    grade: user.grade,
                    startTime: sTime
                }).catch(()=>{});
                showToast("🔥 자습 타이머가 시작되었습니다! 전교생 자습실에 입장했습니다.");
            };

            const stopLiveStudy = async () => {
                const now = Date.now();
                let durationMs = now - (studyStartTime || now);
                let calculatedMins = Math.floor(durationMs / 60000);
                
                if (calculatedMins <= 0) {

            const handleUpload = async (e) => {
                e.preventDefault();
                if (!user) return;
                if (!newTitle || newFiles.length === 0 || !newDescription) return triggerAlert("자료 정보를 모두 채워주세요.");
                if (isLocalMode) return triggerAlert("클라우드 동기화가 꺼져 있습니다.");

                const newId = String(Date.now());
                setUploadProgress(5); 

                try {
                    const { ref, uploadBytesResumable, getDownloadURL, doc, setDoc } = window.firebaseMethods;
                    
                    let uploadedAttachments = [];
                    let totalBytes = newFiles.reduce((acc, f) => acc + f.size, 0);
                    let transferredBytes = 0;

                    // 여러 개의 파일을 순차적으로 업로드 처리
                    for (let i = 0; i < newFiles.length; i++) {
                        const file = newFiles[i];
                        const fileRef = ref(window.storage, `materials/${newId}_${file.name}`);
                        
                        await new Promise((resolve, reject) => {
                            const uploadTask = uploadBytesResumable(fileRef, file);
                            uploadTask.on('state_changed', 
                                (snapshot) => { 
                                    const currentProgress = Math.round(((transferredBytes + snapshot.bytesTransferred) / totalBytes) * 100);
                                    setUploadProgress(Math.max(5, currentProgress)); 
                                }, 
                                (error) => reject(error), 
                                async () => {
                                    const url = await getDownloadURL(uploadTask.snapshot.ref);
                                    uploadedAttachments.push({
                                        fileName: file.name,
                                        fileUrl: url,
                                        fileType: file.name.split('.').pop().toLowerCase()
                                    });
                                    transferredBytes += file.size;
                                    resolve();
                                }
                            );
                        });
                    }

                    setUploadProgress(100);

                    // 다중 파일 정보를 포함하여 DB에 문서 저장
                    const formatDoc = {
                        id: newId, title: newTitle, grade: newGrade, subject: newSubject, subSubject: newSubSubject, type: "요약 노트",

                        description: newDescription, comments: [], date: new Date().toISOString().split('T')[0]

                                                <h4 className="text-xs font-bold text-slate-400 uppercase mb-2">첨부 파일</h4>
                                                {(selectedMaterial.attachments || [{ fileName: selectedMaterial.fileName, fileUrl: selectedMaterial.fileUrl, fileType: selectedMaterial.fileType }]).map((att, idx) => (
                                                    <div key={idx} className="bg-emerald-50/70 p-4 rounded-xl flex items-center justify-between gap-4">
                                                        <div className="flex items-center space-x-3 w-full overflow-hidden">
                                                            <div className="bg-emerald-600 text-white p-3 rounded-xl shrink-0"><i className="fa-solid fa-file-lines text-xl"></i></div>
                                                            <div className="truncate"><p className="text-sm font-bold text-slate-700 truncate">{att.fileName}</p></div>
                                                        </div>
                                                        <div className="flex gap-2 w-full sm:w-auto">
                                                            {isPdfOrImage(att.fileName) && <button onClick={() => { setPreviewFileUrl(att.fileUrl); setIsPreviewMode(true); }} className="flex-1 bg-teal-700 text-white font-bold px-4 py-2.5 rounded-xl text-xs">미리보기</button>}
                                                            <button onClick={() => handleDownload(selectedMaterial, att)} className="flex-1 bg-emerald-600 text-white font-bold px-4 py-2.5 rounded-xl text-xs">다운로드</button>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </>
                                    )}
                                    {!isPreviewMode && (
                                        <div className="space-y-4">
                                            <div className="flex justify-between text-xs text-slate-400 border-b border-slate-100 pb-2"><span>작성자: {selectedMaterial.uploader}</span>{currentUserRank >= 2 && <button onClick={() => deleteMaterial(selectedMaterial.id)} className="text-red-500 font-bold"><i className="fa-solid fa-trash mr-1"></i>삭제</button>}</div>
                                            <h4 className="text-xs font-bold text-slate-500">댓글</h4>
                                            <div className="space-y-3 max-h-40 overflow-y-auto">{(selectedMaterial.comments || []).map(c => <div key={c.id} className="bg-slate-50 p-3 rounded-lg text-xs"><span className="font-bold mr-2">{c.author}</span><span className="text-slate-600">{c.text}</span></div>)}</div>
                                            <form onSubmit={(e) => handleCommentSubmit(e, selectedMaterial.id, false)} className="flex gap-2"><input type="text" placeholder="댓글 달기..." value={commentInput} onChange={(e)=>setCommentInput(e.target.value)} className="flex-1 px-3 py-2 bg-slate-50 border rounded-lg text-xs" /><button type="submit" className="bg-slate-800 text-white px-3 rounded-lg text-xs font-bold">등록</button></form>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {selectedQna && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-3xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-hidden border border-slate-200 flex flex-col">
                                <div className="p-6 border-b border-slate-100 flex items-start justify-between bg-slate-50">
                                    <div>
                                        <span className="bg-emerald-100 text-emerald-800 text-[10px] font-bold px-2 py-0.5 rounded mb-2 inline-block">
                                            {selectedQna.grade ? `${selectedQna.grade} | ` : ''}{selectedQna.subject}{selectedQna.subSubject ? ` > ${selectedQna.subSubject}` : ''}
                                        </span>
                                        <h2 className="text-lg font-extrabold text-slate-800 leading-snug">{selectedQna.title}</h2>
                                        <p className="text-xs text-slate-400 mt-1">작성자: {selectedQna.author} | {selectedQna.date}</p>
                                    </div>
                                    <button onClick={() => setSelectedQna(null)} className="text-slate-400 hover:text-slate-600"><i className="fa-solid fa-xmark text-xl"></i></button>
                                </div>
                                <div className="p-6 overflow-y-auto space-y-6 flex-1">
                                    <div className="bg-slate-50 p-5 rounded-2xl border border-slate-100 text-sm text-slate-700 whitespace-pre-wrap leading-relaxed min-h-[100px]">
                                        {selectedQna.content}
                                    </div>
                                    <div className="space-y-4 pt-4 border-t border-slate-100">
                                        <div className="flex justify-between items-center">
                                            <h4 className="text-xs font-bold text-slate-500">답변 및 댓글 ({selectedQna.answers || 0})</h4>
                                            {currentUserRank >= 2 && <button onClick={() => deleteQna(selectedQna.id)} className="text-red-500 text-xs font-bold"><i className="fa-solid fa-trash mr-1"></i>게시글 삭제</button>}
                                        </div>
                                        <div className="space-y-3 max-h-60 overflow-y-auto">
                                            {(selectedQna.comments || []).map(c => (
                                                <div key={c.id} className="bg-emerald-50 p-3 rounded-lg text-xs border border-emerald-100">
                                                    <div className="font-bold text-emerald-800 mb-1">{c.author} <span className="text-slate-400 font-normal text-[10px] ml-2">{c.date}</span></div>
                                                    <div className="text-slate-700">{c.text}</div>
                                                </div>
                                            ))}
                                        </div>
                                        <form onSubmit={(e) => handleCommentSubmit(e, selectedQna.id, true)} className="flex gap-2">
                                            <input type="text" placeholder="답변을 남겨주세요." value={commentInput} onChange={(e)=>setCommentInput(e.target.value)} className="flex-1 px-3 py-2 bg-white border border-slate-300 rounded-xl text-xs" />
                                            <button type="submit" className="bg-emerald-600 text-white px-4 rounded-xl text-xs font-bold">등록</button>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {isAdminConsoleOpen && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-3xl shadow-2xl max-w-2xl w-full overflow-hidden border border-slate-200">
                                <div className="p-5 border-b border-slate-100 bg-slate-800 text-white">
                                    <div className="flex items-center justify-between mb-3">
                                        <h2 className="text-base font-bold"><i className="fa-solid fa-gear text-slate-300 mr-2"></i>관리자 권한 시스템</h2>
                                        <button onClick={() => setIsAdminConsoleOpen(false)} className="text-slate-400 hover:text-white"><i className="fa-solid fa-xmark text-lg"></i></button>
                                    </div>
                                    
                                    <div className="flex bg-slate-700/60 p-0.5 rounded-lg text-xs font-semibold overflow-x-auto">
                                        <button onClick={() => setAdminTab("config")} className={`px-3 py-1.5 rounded-md transition-all whitespace-nowrap ${adminTab === 'config' ? 'bg-slate-900 text-white' : 'text-slate-300 hover:text-white'}`}>📢 공지 & 일정</button>
                                        <button onClick={() => setAdminTab("users")} className={`px-3 py-1.5 rounded-md transition-all whitespace-nowrap ${adminTab === 'users' ? 'bg-slate-900 text-white' : 'text-slate-300 hover:text-white'}`}>👥 계정 관리</button>
                                        {currentUserRank >= 3 && (
                                            <button onClick={() => setAdminTab("study")} className={`px-3 py-1.5 rounded-md transition-all whitespace-nowrap ${adminTab === 'study' ? 'bg-emerald-600 text-white' : 'text-emerald-300 hover:text-white flex-1'}`}>
                                                <i className="fa-solid fa-check-double mr-1"></i>학습 인증 승인 ({(studyRecords || []).filter(r => r && r.status === 'pending').length})
                                            </button>
                                        )}
                                    </div>
                                </div>

                                {adminTab === "config" && (
                                    <form onSubmit={handleAdminSettingsSave} className="p-6 space-y-4 max-h-[70vh] overflow-y-auto">
                                        <div><label className="block text-xs font-bold text-slate-500 mb-1.5">상단 공지 수정</label><textarea value={editNotice || ''} onChange={(e) => setEditNotice(e.target.value)} rows="2" className="w-full px-3 py-2 border rounded-xl text-xs resize-none" required></textarea></div>
                                        <div className="border-t border-slate-100 pt-3"><label className="block text-xs font-bold text-slate-500 mb-1.5">수능 날짜</label><input type="date" value={editDday?.csat || ''} onChange={(e)=>setEditDday({...editDday, csat: e.target.value})} className="w-full px-3 py-2 border rounded-xl text-xs" required /></div>
                                        <div className="border-t border-slate-100 pt-3"><label className="block text-xs font-bold text-slate-500 mb-1.5">행사 이름</label><input type="text" value={editDday?.examName || ''} onChange={(e)=>setEditDday({...editDday, examName: e.target.value})} className="w-full px-3 py-2 border rounded-xl text-xs mb-3" required /><label className="block text-xs font-bold text-slate-500 mb-1.5">행사 날짜</label><input type="date" value={editDday?.examDate || ''} onChange={(e)=>setEditDday({...editDday, examDate: e.target.value})} className="w-full px-3 py-2 border rounded-xl text-xs" required /></div>
                                        <button type="submit" className="w-full bg-slate-800 text-white font-bold py-3 rounded-xl shadow text-sm">설정 즉시 저장</button>
                                    </form>
                                )}

                                {adminTab === "users" && (
                                    <div className="p-5 space-y-4">
                                        <div className="flex gap-2 border-b border-slate-200 pb-3 overflow-x-auto">
                                            <button onClick={() => setAdminUserSubTab("active")} className={`text-xs font-bold px-3 py-1.5 rounded-lg whitespace-nowrap ${adminUserSubTab === 'active' ? 'bg-emerald-100 text-emerald-800' : 'text-slate-500 hover:bg-slate-100'}`}>정상 계정 ({activeUsersList.length})</button>
                                            <button onClick={() => setAdminUserSubTab("suspended")} className={`text-xs font-bold px-3 py-1.5 rounded-lg whitespace-nowrap ${adminUserSubTab === 'suspended' ? 'bg-red-100 text-red-800' : 'text-slate-500 hover:bg-slate-100'}`}>정지 보관함 ({suspendedUsersList.length})</button>
                                            {currentUserRank === 4 && <button onClick={() => setAdminUserSubTab("security")} className={`text-xs font-bold px-3 py-1.5 rounded-lg whitespace-nowrap ${adminUserSubTab === 'security' ? 'bg-purple-100 text-purple-800' : 'text-slate-500 hover:bg-slate-100'}`}><i className="fa-solid fa-lock mr-1"></i>보안 열람</button>}
                                        </div>
                                        
                                        <div className="relative">
                                            <span className="absolute inset-y-0 left-0 flex items-center pl-2 text-slate-400"><i className="fa-solid fa-magnifying-glass text-xs"></i></span>
                                            <input type="text" placeholder="이름, 직책, 이메일로 검색" value={userSearchQuery || ''} onChange={(e) => setUserSearchQuery(e.target.value)} className="w-full pl-8 pr-3 py-2 bg-slate-50 border border-slate-300 rounded-xl text-xs" />
                                        </div>

                                        <div className="max-h-[50vh] overflow-y-auto border border-slate-100 rounded-xl divide-y divide-slate-100 bg-slate-50">
                                            {adminUserSubTab !== "security" ? filteredDisplayUsers.map(u => (
                                                <div key={u.id || u.email} className="p-3 flex justify-between text-xs hover:bg-slate-100 items-center gap-2">
                                                    <div><span className="font-bold">{u.name}</span> <span className="bg-slate-200 text-[9px] px-1.5 py-0.5 rounded-full">{u.grade}</span><div className="text-[10px] text-slate-400">{u.email}</div></div>
                                                    <div className="flex gap-2 items-center">
                                                        {adminUserSubTab === "active" && currentUserRank === 4 && (
                                                            <select value={u.position || '일반 학생'} onChange={(e) => handleUpdateUserPosition(u.email, e.target.value)} className="text-[10px] border rounded p-1">
                                                                <option value="일반 학생">일반 학생</option><option value="학습부">학습부</option><option value="회장">회장</option><option value="부회장">부회장</option><option value="총무부">총무부</option><option value="행정부">행정부</option><option value="방송부">방송부</option><option value="홍보부">홍보부</option><option value="체육부">체육부</option>
                                                            </select>
                                                        )}
                                                        {adminUserSubTab === "active" ? <button onClick={() => suspendUser(u.email, u.rank)} className="text-red-500 border border-red-200 px-2 py-1 rounded">정지</button> : <button onClick={() => restoreUser(u.email)} className="text-blue-500 border border-blue-200 px-2 py-1 rounded">복구</button>}
                                                    </div>
                                                </div>
                                            )) : filteredDisplayUsers.map(u => (
                                                <div key={u.id || u.email} className="p-3 text-xs hover:bg-slate-100"><div className="font-bold">{u.name} ({u.position})</div><div className="grid grid-cols-2 gap-2 mt-2 bg-white p-2 rounded border"><p className="font-mono truncate">{u.email}</p><p className="font-mono text-rose-500 font-bold truncate">{u.password}</p></div></div>
                                            ))}
                                            {filteredDisplayUsers.length === 0 && <div className="py-8 text-center text-slate-400 text-xs">검색 결과가 없습니다.</div>}
                                        </div>
                                    </div>
                                )}

                                {adminTab === "study" && (
                                    <div className="p-5">
                                        <h3 className="font-bold text-slate-800 text-sm mb-3">접수된 학습 증빙 기록</h3>
                                        <div className="max-h-[60vh] overflow-y-auto space-y-4">
                                            {(studyRecords || []).filter(r => r && r.status === 'pending').map(record => (
                                                <div key={record.id} className="bg-white border border-slate-200 rounded-xl p-4 shadow-sm">
                                                    <div className="flex justify-between items-center mb-3 border-b border-slate-100 pb-2">
                                                        <div><span className="font-bold text-slate-800 mr-2">{record.userName}</span><span className="text-[10px] bg-slate-100 text-slate-500 px-2 py-0.5 rounded-full">{record.grade}</span></div>
                                                        <div className="font-mono font-extrabold text-emerald-600 bg-emerald-50 px-2 py-1 rounded border border-emerald-100">요청 시간: {record.durationMins}분</div>
                                                    </div>
                                                    <div className="flex gap-4">
                                                        <div className="w-1/2 h-32 bg-slate-100 rounded-lg overflow-hidden border border-slate-200 flex items-center justify-center">
                                                            {record.proofUrl ? <a href={record.proofUrl} target="_blank"><img src={record.proofUrl} alt="공부 인증" className="object-cover w-full h-full hover:scale-105 transition-transform" /></a> : <span className="text-xs text-slate-400">사진 없음</span>}
                                                        </div>
                                                        <div className="w-1/2 flex flex-col gap-2 justify-center">
                                                            <button onClick={() => handleStudyProofAction(record.id, record.userEmail, record.durationMins, 'approved')} className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl text-xs transition-all shadow-sm"><i className="fa-solid fa-check mr-1"></i>승인</button>
                                                            <button onClick={() => handleStudyProofAction(record.id, record.userEmail, 0, 'rejected')} className="bg-white border border-rose-200 text-rose-500 hover:bg-rose-50 font-bold py-2 rounded-xl text-xs transition-all"><i className="fa-solid fa-xmark mr-1"></i>반려</button>
                                                        </div>
                                                    </div>
                                                </div>
                                            ))}
                                            {(studyRecords || []).filter(r => r && r.status === 'pending').length === 0 && (
                                                <div className="py-12 text-center bg-slate-50 rounded-xl border border-slate-100">
                                                    <i className="fa-solid fa-face-smile text-3xl text-emerald-300 mb-2"></i>
                                                    <p className="text-xs font-bold text-slate-500">결재 대기 중인 사진이 없습니다.</p>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {isQnaWriteOpen && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-3xl shadow-2xl max-w-md w-full overflow-hidden border border-slate-200">
                                <div className="p-5 border-b border-slate-100 flex justify-between bg-slate-50">
                                    <h2 className="text-base font-bold"><i className="fa-solid fa-pen text-emerald-600 mr-2"></i>질문/요청 작성</h2>
                                    <button onClick={()=>setIsQnaWriteOpen(false)} className="text-slate-400 hover:text-slate-600"><i className="fa-solid fa-xmark"></i></button>
                                </div>
                                <form onSubmit={handleQnaSubmit} className="p-6 space-y-4">
                                    <input type="text" placeholder="제목" value={newQnaTitle} onChange={(e)=>setNewQnaTitle(e.target.value)} className="w-full px-3 py-2 border rounded-xl text-sm" required />
                                    
                                    {/* QnA용 계층형 드롭다운 */}
                                    <div className="flex gap-2">
                                        <select value={newQnaGrade} onChange={(e) => {
                                            const g = e.target.value; setNewQnaGrade(g);
                                            const firstSubj = Object.keys(CURRICULUM[g])[0] || ""; setNewQnaSubject(firstSubj);
                                            setNewQnaSubSubject(CURRICULUM[g][firstSubj]?.[0] || "");
                                        }} className="flex-1 px-3 py-2 border rounded-xl text-xs">
                                            {Object.keys(CURRICULUM).map(g => <option key={g} value={g}>{g}</option>)}
                                        </select>
                                        <select value={newQnaSubject} onChange={(e) => {
                                            const s = e.target.value; setNewQnaSubject(s);
                                            setNewQnaSubSubject(CURRICULUM[newQnaGrade][s]?.[0] || "");
                                        }} className="flex-1 px-3 py-2 border rounded-xl text-xs">
                                            {Object.keys(CURRICULUM[newQnaGrade]).map(s => <option key={s} value={s}>{s}</option>)}
                                        </select>
                                    </div>
                                    {CURRICULUM[newQnaGrade][newQnaSubject]?.length > 0 && (
                                        <select value={newQnaSubSubject} onChange={(e) => setNewQnaSubSubject(e.target.value)} className="w-full px-3 py-2 border rounded-xl text-xs">
                                            {CURRICULUM[newQnaGrade][newQnaSubject].map(ss => <option key={ss} value={ss}>{ss}</option>)}
                                        </select>
                                    )}

                                    <textarea placeholder="내용" value={newQnaContent} onChange={(e)=>setNewQnaContent(e.target.value)} rows="5" className="w-full px-3 py-2 border rounded-xl text-sm" required></textarea>
                                    <button type="submit" className="w-full bg-emerald-600 text-white font-bold py-3 rounded-xl shadow text-sm">등록</button>
                                </form>
                            </div>
                        </div>
                    )}
                    
                    {isUploadOpen && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-3xl shadow-2xl max-w-md w-full overflow-hidden border border-slate-200">
                                <div className="p-5 border-b border-slate-100 flex justify-between bg-slate-50">
                                    <h2 className="text-base font-bold">자료 제공하기</h2>
                                    <button onClick={()=>setIsUploadOpen(false)} className="text-slate-400 hover:text-slate-600"><i className="fa-solid fa-xmark"></i></button>
                                </div>
                                <form onSubmit={handleUpload} className="p-6 space-y-4">
                                    <input type="text" placeholder="제목" value={newTitle} onChange={(e)=>setNewTitle(e.target.value)} className="w-full px-3 py-2 border rounded-xl text-xs" disabled={uploadProgress>0} required />
                                    
                                    {/* 업로드용 계층형 드롭다운 */}
                                    <div className="flex gap-2">
                                        <select value={newGrade} onChange={(e) => {
                                            const g = e.target.value; setNewGrade(g);
                                            const firstSubj = Object.keys(CURRICULUM[g])[0] || ""; setNewSubject(firstSubj);
                                            setNewSubSubject(CURRICULUM[g][firstSubj]?.[0] || "");
                                        }} className="flex-1 px-3 py-2 border rounded-xl text-xs">
                                            {Object.keys(CURRICULUM).map(g => <option key={g} value={g}>{g}</option>)}
                                        </select>
                                        <select value={newSubject} onChange={(e) => {
                                            const s = e.target.value; setNewSubject(s);
                                            setNewSubSubject(CURRICULUM[newGrade][s]?.[0] || "");
                                        }} className="flex-1 px-3 py-2 border rounded-xl text-xs">
                                            {Object.keys(CURRICULUM[newGrade]).map(s => <option key={s} value={s}>{s}</option>)}
                                        </select>
                                    </div>
                                    {CURRICULUM[newGrade][newSubject]?.length > 0 && (
                                        <select value={newSubSubject} onChange={(e) => setNewSubSubject(e.target.value)} className="w-full px-3 py-2 border rounded-xl text-xs">
                                            {CURRICULUM[newGrade][newSubject].map(ss => <option key={ss} value={ss}>{ss}</option>)}
                                        </select>
                                    )}

                                    <div>
                                        <input type="file" multiple onChange={(e)=>setNewFiles(Array.from(e.target.files))} className="w-full text-xs" required disabled={uploadProgress>0} />
                                        {newFiles.length > 0 && (
                                            <div className="mt-2 text-[10px] text-slate-500 flex flex-col gap-1 max-h-20 overflow-y-auto bg-slate-50 p-2 rounded border border-slate-200">
                                                {newFiles.map((f, i) => <span key={i}><i className="fa-solid fa-file-lines mr-1 text-emerald-600"></i>{f.name}</span>)}
                                            </div>
                                        )}
                                    </div>
                                    <textarea placeholder="설명" value={newDescription} onChange={(e)=>setNewDescription(e.target.value)} rows="3" className="w-full px-3 py-2 border rounded-xl text-xs" required></textarea>
                                    <button type="submit" disabled={uploadProgress>0} className="w-full bg-emerald-600 text-white font-bold py-3 rounded-xl text-sm">{uploadProgress>0?'업로드 중...':'등록'}</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {toast && <div className="fixed bottom-4 right-4 z-[99] bg-slate-900 text-white py-3 px-5 rounded-xl text-xs shadow-xl">{toast.message}</div>}
                    {customAlert && <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-[100] p-4"><div className="bg-white p-6 rounded-2xl max-w-sm w-full text-center shadow-2xl"><h3 className="font-bold text-slate-800 mb-2">{customAlert.title}</h3><p className="text-xs text-slate-500 mb-4 whitespace-pre-wrap">{customAlert.message}</p><button onClick={()=>setCustomAlert(null)} className="w-full bg-slate-800 text-white text-xs font-bold py-2 rounded-xl">확인</button></div></div>}
                    {customConfirm && <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-[100] p-4"><div className="bg-white p-6 rounded-2xl max-w-sm w-full text-center shadow-2xl"><h3 className="font-bold text-slate-800 mb-2">{customConfirm.title}</h3><p className="text-xs text-slate-500 mb-4">{customConfirm.message}</p><div className="flex gap-2"><button onClick={()=>setCustomConfirm(null)} className="flex-1 bg-slate-100 text-slate-600 text-xs font-bold py-2 rounded-xl">취소</button><button onClick={()=>{customConfirm.onConfirm(); setCustomConfirm(null);}} className="flex-1 bg-red-600 text-white text-xs font-bold py-2 rounded-xl">실행</button></div></div></div>}
                </div>
            );
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
