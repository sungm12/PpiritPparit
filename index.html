                            const next  = PET_STAGES[stage + 1];
                            const floor = PET_STAGES[stage].min;
                            const pct   = next ? Math.min(100, Math.round(((myStudyMins - floor) / (next.min - floor)) * 100)) : 100;
                            return (
                                <div className="grid grid-cols-1 lg:grid-cols-[1.1fr_.9fr] gap-6">
                                    {/* 큰 무대 */}
                                    <div className="glass topline rounded-[28px] p-8 flex flex-col items-center text-center reveal d1"
                                         style={{ background: 'linear-gradient(170deg, color-mix(in srgb, var(--lime) 10%, transparent), transparent 60%)' }}>
                                        <div className="eyebrow text-[9px] mb-6">My Buddy</div>

                                        <div style={{ width: 'min(300px, 68vw)' }}>
                                            <Pet uid={user.uid} petId={user.petId} mins={myStudyMins} size="100%" live={isStudying} />
                                        </div>

                                        <h2 className="text-2xl font-extrabold tracking-tight mt-5">
                                            {user.petName || '아직 이름이 없어요'}
                                        </h2>
                                        <div className="tag tag-brand mt-3">{PET_STAGES[stage].name}</div>
                                        <p className="text-sm mt-4 leading-relaxed" style={{ color: 'var(--txt-dim)' }}>
                                            {isStudying ? '지금 같이 공부하고 있어요 🔥' : PET_STAGES[stage].line}
                                        </p>

                                        <form onSubmit={handlePetNameSave} className="w-full mt-7 flex gap-2">
                                            <input type="text" value={editPetName} onChange={(e) => setEditPetName(e.target.value)}
                                                   placeholder={user.petName ? '이름 바꾸기' : '이름을 지어주세요'} maxLength="12"
                                                   className="fld flex-1" disabled={petBusy} />
                                            <button type="submit" disabled={petBusy} className="btn btn-primary px-6 rounded-2xl text-sm font-bold shrink-0">
                                                {petBusy ? '...' : '저장'}
                                            </button>
                                        </form>
                                    </div>

                                    {/* 성장 현황 */}
                                    <div className="space-y-6">
                                        <div className="glass rounded-[28px] p-7 reveal d2">
                                            <SectionTitle eyebrow="Progress" title="다음 단계까지"
                                                right={<span className="tag tag-brand font-mono">{pct}%</span>} />
                                            <div className="pet-track" style={{ height: 12 }}>
                                                <div className="pet-fill" style={{ width: `${pct}%` }}></div>
                                            </div>
                                            <div className="flex justify-between mt-3.5 text-[11px]" style={{ color: 'var(--txt-faint)' }}>
                                                <span className="font-mono">{fmtHM(myStudyMins)} 누적</span>
                                                <span>{next ? `«${next.name}»까지 ${fmtHM(next.min - myStudyMins)}` : '최고 단계'}</span>
                                            </div>
                                            <p className="text-[11px] mt-5 leading-relaxed" style={{ color: 'var(--txt-faint)' }}>
                                                학습부가 승인한 자습 시간만 쌓입니다. 타이머를 켜고 인증 사진을 올리면 반영돼요.
                                            </p>
                                        </div>

                                        <div className="glass rounded-[28px] p-7 reveal d3">
                                            <SectionTitle eyebrow="Journey" title="성장 여정" />
                                            <div className="road">
                                                {PET_STAGES.map((s, i) => (
                                                    <div key={s.name} className={`road-step ${i < stage ? 'done' : i === stage ? 'now' : 'lock'}`}>
                                                        <Pet uid={user.uid} petId={user.petId} mins={s.min} size={44} ground={false} animate={false} />
                                                        <div className="road-name" style={{ color: i <= stage ? 'var(--txt)' : 'var(--txt-faint)' }}>{s.name}</div>
                                                        <div className="road-min">{s.min === 0 ? '시작' : `${Math.floor(s.min / 60)}h`}</div>
                                                    </div>
                                                ))}
                                            </div>
                                            <p className="text-[11px] mt-5 leading-relaxed" style={{ color: 'var(--txt-faint)' }}>
                                                흐릿한 단계는 아직 오지 않은 모습입니다. 어떤 친구가 나올지는 계정마다 정해져 있어요.
                                            </p>
                                        </div>
                                    </div>
                                </div>
                            );
                        })()}

                        {/* ── 핀볼 추첨 ──────────────────── */}
                        {activeMainTab === 'pinball' && (() => {
                            const base = pinballSettings.baseHours || 30;
                            const step = pinballSettings.stepHours || 10;
                            const nextAt = myPinballTickets === 0
                                ? base * 60 - myPinballMins
                                : (base * 60 + myPinballTickets * step * 60) - myPinballMins;
                            const running = pinballSettings.startDate && pinballSettings.endDate;
                            return (
                                <div className="grid grid-cols-1 lg:grid-cols-[1fr_.85fr] gap-6">
                                    <div className="glass topline rounded-[28px] p-7 reveal d1">
                                        <SectionTitle eyebrow="Live" title="핀볼 판"
                                            right={<span className="tag tag-brand font-mono">응모권 {pinballTotalTickets}장</span>} />
                                        {pinballTotalTickets > 0 ? (
                                            <PinballBoard tickets={pinballBalls} draw={pinballDraw}
                                                          winnerName={pinballDraw && pinballDraw.winnerName} />
                                        ) : (
                                            <EmptyState icon="fa-trophy" title="아직 응모한 학생이 없어요"
                                                        desc={`${base}시간을 채우면 첫 응모권이 들어갑니다.`} />
                                        )}
                                        {pinballDraw && pinballDraw.drawnAt && (
                                            <p className="text-[11px] mt-4 text-center font-mono" style={{ color: 'var(--txt-faint)' }}>
                                                {new Date(pinballDraw.drawnAt).toLocaleString('ko-KR')} 추첨 · 응모권 {pinballDraw.totalTickets}장
                                            </p>
                                        )}
                                    </div>

                                    <div className="space-y-6">
                                        <div className="glass rounded-[28px] p-7 reveal d2">
                                            <SectionTitle eyebrow="My Tickets" title="내 응모권" />
                                            <div className="flex items-end gap-3 mb-4">
                                                <span className="font-mono text-4xl font-extrabold" style={{ color: 'var(--lime-ink)' }}>{myPinballTickets}</span>
                                                <span className="text-sm mb-1.5" style={{ color: 'var(--txt-dim)' }}>장</span>
                                            </div>
                                            <div className="pet-track" style={{ height: 10 }}>
                                                <div className="pet-fill" style={{ width: `${Math.min(100, Math.round((myPinballMins / (base*60)) * 100))}%` }}></div>
                                            </div>
                                            <p className="text-[11px] mt-3 leading-relaxed" style={{ color: 'var(--txt-faint)' }}>
                                                기간 내 <span className="font-mono" style={{ color: 'var(--txt-dim)' }}>{fmtHM(myPinballMins)}</span> 인정됐어요.
                                                {nextAt > 0 && <> <span className="font-mono" style={{ color: 'var(--lime-ink)' }}>{fmtHM(nextAt)}</span> 더 하면 한 장 더 들어갑니다.</>}
                                            </p>
                                            <div className="divider my-5"></div>
                                            <p className="text-[11px] leading-relaxed" style={{ color: 'var(--txt-faint)' }}>
                                                <b style={{ color: 'var(--txt-dim)' }}>{base}시간</b>을 채우면 이름이 한 번 들어가고,
                                                그 뒤로 <b style={{ color: 'var(--txt-dim)' }}>{step}시간</b>마다 한 번씩 더 들어갑니다.
                                                {running && <><br />기간 <span className="font-mono">{pinballSettings.startDate} ~ {pinballSettings.endDate}</span></>}
                                                {pinballSettings.prize && <><br />상품 · <b style={{ color: 'var(--gold)' }}>{pinballSettings.prize}</b></>}
                                            </p>
                                        </div>

                                        <div className="glass rounded-[28px] p-7 reveal d3">
                                            <SectionTitle eyebrow="Entrants" title="응모 현황"
                                                right={<span className="tag tag-neutral font-mono">{pinballEntrants.length}명</span>} />
                                            <div className="space-y-2 max-h-72 overflow-y-auto pr-1">
                                                {pinballEntrants.map((e, i) => (
                                                    <div key={e.uid} className="flex items-center gap-2.5 text-xs">
                                                        <span className="font-mono text-[10px] w-5 shrink-0" style={{ color: 'var(--txt-faint)' }}>{i+1}</span>
                                                        <span className="shrink-0" style={{ lineHeight: 0 }}>
                                                            <Pet uid={e.uid} petId={e.petId} mins={0} size={26} ground={false} animate={false} />
                                                        </span>
                                                        <span className="font-bold truncate flex-1">{e.name}</span>
                                                        <span className="tag tag-brand font-mono shrink-0">{e.tickets}장</span>
                                                    </div>
                                                ))}
                                                {pinballEntrants.length === 0 && (
                                                    <p className="text-[11px] py-4 text-center" style={{ color: 'var(--txt-faint)' }}>첫 번째 응모자가 되어보세요.</p>
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            );
                        })()}

                        {/* ── 온라인 자습실 ──────────────── */}
                        {activeMainTab === 'studyRoom' && (
                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                {/* 내 책상 */}
                                <div className="glass topline rounded-[28px] p-8 flex flex-col items-center text-center lg:col-span-1 h-fit reveal d1">
                                    <div className="eyebrow text-[9px] mb-7">My Desk</div>

                                    <div className="relative w-60 h-60 mb-8">
                                        <svg viewBox="0 0 200 200" className="w-full h-full -rotate-90">
                                            <defs>
                                                <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
                                                    <stop offset="0%" stopColor="#C7F03E" />
                                                    <stop offset="55%" stopColor="#38E8FF" />
                                                    <stop offset="100%" stopColor="#FF4D8D" />
                                                </linearGradient>
                                            </defs>
                                            <circle cx="100" cy="100" r={ringR} fill="none" stroke="var(--lime)" strokeWidth="5" opacity=".16" />
                                            <circle cx="100" cy="100" r={ringR} fill="none" stroke="url(#ringGrad)" strokeWidth="5" strokeLinecap="round"
                                                    strokeDasharray={ringC} strokeDashoffset={ringC * (1 - ringProgress)}
                                                    style={{ transition: 'stroke-dashoffset .9s linear', filter: isStudying ? 'drop-shadow(0 0 10px rgba(199,240,62,.85))' : 'none', opacity: isStudying ? 1 : .55 }} />
                                        </svg>
                                        <div className={`absolute inset-6 rounded-full grid place-items-center ${isStudying ? 'live-dot' : ''}`}
                                             style={{ background: isStudying ? 'radial-gradient(circle at 50% 30%, color-mix(in srgb, var(--lime) 20%, transparent), transparent)' : 'var(--surface)', border: '1px solid var(--line)' }}>
                                            <div>
                                                <div className="timer-digits text-[2.7rem] leading-none">
                                                    {String(hh).padStart(2,'0')}<span style={{ color: 'var(--txt-faint)' }}>:</span>{String(mm).padStart(2,'0')}<span className="text-lg" style={{ color: 'var(--txt-faint)' }}>:{String(ss).padStart(2,'0')}</span>
                                                </div>
                                                <div className="text-[11px] font-extrabold mt-3" style={{ color: isStudying ? 'var(--brand-lt)' : 'var(--txt-faint)' }}>
                                                    {isStudying ? '열공 중입니다 🔥' : '타이머 대기 중'}
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    {!isStudying ? (
                                        <button onClick={startLiveStudy} className="btn btn-primary w-full font-extrabold py-4 rounded-2xl text-base">
                                            <i className="fa-solid fa-play mr-2 text-sm"></i>공부 시작하기
                                        </button>
                                    ) : (
                                        <button onClick={stopLiveStudy} className="btn btn-dark w-full font-extrabold py-4 rounded-2xl text-base">
                                            <i className="fa-solid fa-stop mr-2 text-sm"></i>종료 및 사진 인증
                                        </button>
                                    )}
                                    <p className="text-[10px] mt-5 leading-relaxed" style={{ color: 'var(--txt-faint)' }}>
                                        1분 미만은 기록되지 않으며, 부정 방지를 위해<br />8시간이 넘어가면 자동으로 컷팅됩니다.
                                    </p>
                                </div>

                                <div className="lg:col-span-2 space-y-6">
                                    {/* 명예의 전당 */}
                                    <div className="relative glass topline rounded-[28px] p-7 overflow-hidden reveal d2"
                                         style={{ background: 'linear-gradient(150deg, color-mix(in srgb, var(--pink) 12%, transparent), color-mix(in srgb, var(--cyan) 9%, transparent) 60%, transparent)' }}>
                                        <div className="flex items-center justify-between mb-6">
                                            <div>
                                                <div className="eyebrow text-[9px] mb-2">Hall of Fame</div>
                                                <h3 className="font-extrabold text-lg tracking-tight flex items-center gap-2">
                                                    <i className="fa-solid fa-trophy text-sm" style={{ color: 'var(--gold)' }}></i>명예의 전당
                                                </h3>
                                            </div>
                                            <span className="tag tag-gold">누적 학습시간</span>
                                        </div>

                                        {leaderboardTop5.length > 0 ? (
                                            <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3">
                                                {leaderboardTop5.map((student, idx) => {
                                                    const medal = idx === 0 ? 'var(--lime)' : idx === 1 ? 'var(--cyan)' : idx === 2 ? 'var(--pink)' : 'var(--surface-2)';
                                                    return (
                                                        <div key={student.email} className={`glass rounded-2xl p-4 flex flex-col items-center lift shine reveal d${idx + 3}`}
                                                             style={idx === 0 ? { borderColor: 'var(--lime)' } : {}}>
                                                            <Pet uid={student.id || student.uid} petId={student.petId} mins={student.totalStudyMins || 0} size={54} ground={false} />
                                                            <div className="w-9 h-9 rounded-xl grid place-items-center font-mono font-extrabold text-xs mb-3 -mt-1"
                                                                 style={{ color: idx < 3 ? 'var(--on-accent)' : 'var(--txt-dim)', background: medal, boxShadow: idx === 0 ? '0 8px 22px -8px rgba(199,240,62,.95)' : 'none' }}>
                                                                {idx + 1}
                                                            </div>
                                                            <div className="font-bold text-xs truncate w-full text-center">{student.name}</div>
                                                            <div className="text-[9px] mt-0.5" style={{ color: 'var(--txt-faint)' }}>{student.grade}</div>
                                                            <div className="mt-3 font-mono font-extrabold text-sm" style={{ color: idx === 0 ? 'var(--lime-ink)' : 'var(--txt)' }}>
                                                                {Math.floor((student.totalStudyMins || 0)/60)}<span className="text-[10px]">h</span> {(student.totalStudyMins || 0)%60}<span className="text-[10px]">m</span>
                                                            </div>
                                                            <div className="w-full mt-2.5 rounded-full overflow-hidden" style={{ background: 'var(--surface)' }}>
                                                                <div className="rank-bar" style={{ width: `${Math.max(8, ((student.totalStudyMins || 0) / topMins) * 100)}%`, background: medal, animationDelay: `${.2 + idx * .1}s` }}></div>
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        ) : (
                                            <EmptyState icon="fa-medal" title="아직 누적 기록이 없습니다" desc="첫 번째 랭커에 도전해보세요!" />
                                        )}
                                    </div>

                                    {/* 실시간 자습 중 */}
                                    <div className="glass rounded-[28px] p-7 reveal d4">
                                        <SectionTitle
                                            eyebrow="Live Now"
                                            title={<span className="flex items-center gap-2.5">
                                                <span className="w-2 h-2 rounded-full live-dot" style={{ background: 'var(--brand)' }}></span>
                                                지금 공부 중인 친구들
                                            </span>}
                                            right={<span className="tag tag-brand font-mono">{liveStudyUsers.length}명</span>}
                                        />
                                        {liveStudyUsers.length > 0 ? (
                                            <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
                                                {liveStudyUsers.map((u, i) => (
                                                    <div key={u.id} className="glass rounded-2xl p-3 flex items-center gap-3 lift reveal" style={{ animationDelay: `${.05 * i}s` }}>
                                                        <span className="shrink-0" style={{ lineHeight: 0 }}>
                                                            <Pet uid={u.uid || u.id}
                                                                 petId={(usersList.find(x => x && x.id === (u.uid || u.id)) || {}).petId}
                                                                 mins={(usersList.find(x => x && x.id === (u.uid || u.id)) || {}).totalStudyMins || 0}
                                                                 size={34} ground={false} animate={false} />
                                                        </span>
                                                        <div className="min-w-0">
                                                            <div className="font-bold text-xs truncate">{u.name}</div>
                                                            <div className="text-[9px]" style={{ color: 'var(--txt-faint)' }}>{u.grade}</div>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        ) : (
                                            <EmptyState icon="fa-mug-hot" title="현재 자습 중인 친구가 없습니다" desc="먼저 타이머를 켜볼까요?" />
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* ── 학습 자료실 ────────────────── */}
                        {activeMainTab === 'materials' && (
                            <div className="space-y-5">
                                <div className="glass rounded-3xl p-4 flex flex-col sm:flex-row gap-3 items-center reveal d1">
                                    <div className="w-full relative">
                                        <span className="absolute inset-y-0 left-0 flex items-center pl-4" style={{ color: 'var(--txt-faint)' }}><i className="fa-solid fa-magnifying-glass text-xs"></i></span>
                                        <input type="text" placeholder="과목, 제목, 작성자 이름으로 자료 검색" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="fld pl-11" />
                                    </div>
                                    <button onClick={() => {
                                        setIsUploadOpen(true);
                                        setNewGrade("1학년"); setNewSubject(Object.keys(CURRICULUM["1학년"])[0]); setNewSubSubject(CURRICULUM["1학년"][Object.keys(CURRICULUM["1학년"])[0]][0] || "");
                                        setNewFiles([]);
                                    }} className="btn btn-primary w-full sm:w-auto shrink-0 font-bold px-6 py-3 rounded-2xl text-sm flex items-center justify-center gap-2">
                                        <i className="fa-solid fa-cloud-arrow-up"></i>자료 제공하기
                                    </button>
                                </div>

                                {renderFilterBar()}

                                <div className="flex items-center justify-between px-1 pt-1">
                                    <div className="eyebrow text-[9px]">Archive · {filteredMaterials.length} items</div>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                                    {filteredMaterials.map((mat, i) => (
                                        <div key={mat.id}
                                             className="glass topline shine lift rounded-[24px] flex flex-col justify-between cursor-pointer reveal"
                                             style={{ animationDelay: `${Math.min(i, 9) * .06}s` }}
                                             onClick={() => { setSelectedMaterial(mat); setIsPreviewMode(false); }}>
                                            <div className="p-6">
                                                <div className="flex justify-between items-start mb-4 gap-3">
                                                    <div className="flex gap-1.5 flex-wrap">
                                                        <span className="tag tag-brand">{mat.grade}</span>
                                                        <span className="tag tag-neutral">{mat.subject}{mat.subSubject ? ` · ${mat.subSubject}` : ''}</span>
                                                    </div>
                                                    <div className="w-9 h-9 rounded-xl grid place-items-center shrink-0" style={{ background: 'color-mix(in srgb, var(--lime) 12%, transparent)' }}>
                                                        <i className={`fa-solid ${fileGlyph(mat.fileName)} text-sm`} style={{ color: 'var(--brand-lt)' }}></i>
                                                    </div>
                                                </div>
                                                <h3 className="text-[15px] font-extrabold line-clamp-2 mb-2 leading-snug tracking-tight">{mat.title}</h3>
                                                <p className="text-xs line-clamp-2 leading-relaxed" style={{ color: 'var(--txt-faint)' }}>{mat.description}</p>
                                            </div>
                                            <div className="px-6 py-4 flex justify-between items-center text-[11px] font-semibold border-t" style={{ borderColor: 'var(--line)', color: 'var(--txt-faint)' }}>
                                                <span className="flex items-center gap-1.5"><i className="fa-regular fa-user text-[10px]"></i>{mat.uploader}</span>
                                                <div className="flex gap-3.5 font-mono">
                                                    <span style={{ color: 'var(--rose)' }}><i className="fa-solid fa-heart mr-1 text-[10px]"></i>{mat.likes || 0}</span>
                                                    <span style={{ color: 'var(--brand-lt)' }}><i className="fa-solid fa-download mr-1 text-[10px]"></i>{mat.downloads || 0}</span>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                    {filteredMaterials.length === 0 && (
                                        <div className="col-span-full glass rounded-3xl">
                                            <EmptyState icon="fa-folder-open" title="조건에 맞는 자료가 없습니다" desc="필터를 바꾸거나 첫 자료를 올려보세요." />
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* ── 질문 / 자료요청 ────────────── */}
                        {activeMainTab === 'qna' && (
                            <div className="space-y-5">
                                <div className="glass rounded-3xl p-4 flex flex-col sm:flex-row gap-3 items-center reveal d1">
                                    <div className="w-full relative">
                                        <span className="absolute inset-y-0 left-0 flex items-center pl-4" style={{ color: 'var(--txt-faint)' }}><i className="fa-solid fa-magnifying-glass text-xs"></i></span>
                                        <input type="text" placeholder="질문이나 요청 내용 검색" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="fld pl-11" />
                                    </div>
                                    <button onClick={() => {
                                        setIsQnaWriteOpen(true);
                                        setNewQnaGrade("1학년"); setNewQnaSubject(Object.keys(CURRICULUM["1학년"])[0]); setNewQnaSubSubject(CURRICULUM["1학년"][Object.keys(CURRICULUM["1학년"])[0]][0] || "");
                                    }} className="btn btn-primary w-full sm:w-auto shrink-0 font-bold px-6 py-3 rounded-2xl text-sm flex items-center justify-center gap-2">
                                        <i className="fa-solid fa-feather"></i>질문 작성하기
                                    </button>
                                </div>

                                {renderFilterBar()}

                                <div className="glass rounded-[24px] overflow-hidden reveal d4">
                                    {filteredQna.length > 0 ? (
                                        <ul className="divide-y" style={{ borderColor: 'var(--line)' }}>
                                            {filteredQna.map((qna, i) => (
                                                <li key={qna.id}
                                                    className="row p-5 sm:px-7 cursor-pointer flex flex-col sm:flex-row sm:items-center justify-between gap-4 reveal"
                                                    style={{ animationDelay: `${Math.min(i, 9) * .05}s`, borderColor: 'var(--line)' }}
                                                    onClick={() => setSelectedQna(qna)}>
                                                    <div className="flex-1 min-w-0">
                                                        <div className="flex gap-1.5 mb-2 flex-wrap">
                                                            <span className="tag tag-brand">
                                                                {qna.grade ? `${qna.grade} · ` : ''}{qna.subject}{qna.subSubject ? ` · ${qna.subSubject}` : ''}
                                                            </span>
                                                            {qna.answers > 0 && <span className="tag tag-gold"><i className="fa-solid fa-check text-[8px]"></i>답변완료</span>}
                                                        </div>
                                                        <h3 className="text-sm font-extrabold tracking-tight">{qna.title}</h3>
                                                        <p className="text-xs mt-1.5 line-clamp-1" style={{ color: 'var(--txt-faint)' }}>{qna.content}</p>
                                                    </div>
                                                    <div className="text-[11px] shrink-0 flex sm:flex-col gap-3 sm:gap-1 sm:text-right" style={{ color: 'var(--txt-faint)' }}>
                                                        <span className="font-semibold">{qna.author}</span>
                                                        <span className="font-mono"><i className="fa-regular fa-comment mr-1"></i>{qna.answers || 0}</span>
                                                        <span className="text-[10px] font-mono">{qna.date}</span>
                                                    </div>
                                                </li>
                                            ))}
                                        </ul>
                                    ) : (
                                        <EmptyState icon="fa-circle-question" title="조건에 맞는 게시글이 없습니다" desc="궁금한 걸 먼저 물어보세요." />
                                    )}
                                </div>
                            </div>
                        )}
                    </main>

                    {/* ── 푸터 ───────────────────────────── */}
                    <footer className="border-t mt-6" style={{ borderColor: 'var(--line)' }}>
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex flex-col sm:flex-row items-center justify-between gap-5">
                            <div className="flex items-center gap-3">
                                <Mark size={28} />
                                <div>
                                    <div className="text-xs font-extrabold tracking-tight">{BRAND}</div>
                                    <div className="eyebrow text-[8px] mt-0.5">Dogye High School</div>
                                </div>
                            </div>
                            <p className="text-[10px] text-center sm:text-right" style={{ color: 'var(--txt-faint)' }}>
                                © {new Date().getFullYear()} {BRAND}. 도계고등학교 학생을 위한 학습 아카이브.
                            </p>
                        </div>
                    </footer>

                    {/* ── 학습 인증 모달 ─────────────────── */}
                    {isStudyProofModalOpen && (
                        <div className="modal-bd fixed inset-0 bg-black/75 backdrop-blur-md flex items-center justify-center z-50 p-4">
                            <div className="modal-card glass-solid rounded-[28px] max-w-sm w-full overflow-hidden">
                                <div className="p-6 text-center relative" style={{ background: 'linear-gradient(150deg, color-mix(in srgb, var(--lime) 20%, transparent), color-mix(in srgb, var(--cyan) 12%, transparent))' }}>
                                    <div className="eyebrow text-[9px] mb-2">Session Complete</div>
                                    <h2 className="text-lg font-extrabold">수고하셨습니다 🎉</h2>
                                    <p className="text-[11px] mt-1.5" style={{ color: 'var(--txt-dim)' }}>오늘의 공부 {recordedMins}분을 증명해주세요.</p>
                                    {studyProofProgress === 0 && <button onClick={() => setIsStudyProofModalOpen(false)} className="icon-btn absolute top-3 right-3"><i className="fa-solid fa-xmark"></i></button>}
                                </div>
                                <form onSubmit={submitStudyProof} className="p-6 space-y-5">
                                    <div className="glass rounded-2xl p-5 text-center">
                                        <p className="eyebrow text-[9px] mb-2">Recorded</p>
                                        <p className="font-mono text-4xl font-extrabold tracking-tight">
                                            {recordedMins}<span className="text-sm font-sans ml-1.5" style={{ color: 'var(--txt-faint)' }}>분</span>
                                        </p>
                                    </div>

                                    <div>
                                        <label className="eyebrow text-[9px] block mb-2.5"><i className="fa-solid fa-camera mr-1.5"></i>공부 흔적 사진 (필수)</label>
                                        <input type="file" accept="image/*" onChange={(e)=>setStudyProofFile(e.target.files[0])} className="fld text-xs" disabled={studyProofProgress > 0} required />
                                    </div>

                                    {studyProofProgress > 0 && (
                                        <div className="w-full rounded-full h-1.5 overflow-hidden" style={{ background: 'var(--surface-2)' }}>
                                            <div className="h-full rounded-full transition-all duration-300" style={{ width: `${studyProofProgress}%`, background: 'var(--lime)' }}></div>
                                        </div>
                                    )}

                                    <button type="submit" disabled={studyProofProgress > 0} className="btn btn-primary w-full font-bold py-3.5 rounded-2xl text-sm">
                                        {studyProofProgress > 0 ? '업로드 중...' : '학습부로 결재 올리기'}
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* ── 자료 상세 모달 ─────────────────── */}
                    {selectedMaterial && (
                        <div className="modal-bd fixed inset-0 bg-black/75 backdrop-blur-md flex items-center justify-center z-50 p-4">
                            <div className="modal-card glass-solid rounded-[28px] max-w-3xl w-full max-h-[90vh] overflow-hidden flex flex-col">
                                <div className="p-6 border-b flex items-start justify-between gap-4" style={{ borderColor: 'var(--line)' }}>
                                    <div className="min-w-0">
                                        <div className="flex gap-1.5 mb-2.5 flex-wrap">
                                            <span className="tag tag-brand">{selectedMaterial.grade}</span>
                                            <span className="tag tag-neutral">{selectedMaterial.subject}{selectedMaterial.subSubject ? ` · ${selectedMaterial.subSubject}` : ''}</span>
                                        </div>
                                        <h2 className="text-lg font-extrabold tracking-tight leading-snug">{selectedMaterial.title}</h2>
                                    </div>
                                    <button onClick={() => { setSelectedMaterial(null); setIsPreviewMode(false); setPreviewFileUrl(null); }} className="icon-btn shrink-0"><i className="fa-solid fa-xmark"></i></button>
                                </div>
                                <div className="p-6 overflow-y-auto space-y-7 flex-1">
                                    {isPreviewMode && previewFileUrl ? (
                                        <div className="rounded-2xl overflow-hidden h-[60vh] relative reveal" style={{ background: 'var(--bg-2)', border: '1px solid var(--line)' }}>
                                            <div className="absolute top-3 right-3 flex gap-2 z-10">
                                                <span className="tag tag-neutral backdrop-blur">미리보기</span>
                                                <button onClick={() => { setIsPreviewMode(false); setPreviewFileUrl(null); }} className="tag tag-rose"><i className="fa-solid fa-xmark"></i>닫기</button>
                                            </div>
                                            <iframe src={previewFileUrl} className="w-full h-full border-0 bg-white"></iframe>
                                        </div>
                                    ) : (
                                        <>
                                            <div className="reveal">
                                                <div className="eyebrow text-[9px] mb-3">Description</div>
                                                <p className="text-sm leading-relaxed glass rounded-2xl p-5 whitespace-pre-wrap" style={{ color: 'var(--txt-dim)' }}>{selectedMaterial.description}</p>
                                            </div>

                                            <div className="space-y-2.5 reveal d2">
                                                <div className="eyebrow text-[9px] mb-3">Attachments</div>
                                                {(selectedMaterial.attachments || [{ fileName: selectedMaterial.fileName, fileUrl: selectedMaterial.fileUrl, fileType: selectedMaterial.fileType }]).map((att, idx) => (
                                                    <div key={idx} className="glass lift rounded-2xl p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                                                        <div className="flex items-center gap-3.5 min-w-0">
                                                            <div className="w-11 h-11 rounded-xl grid place-items-center shrink-0" style={{ background: 'color-mix(in srgb, var(--lime) 13%, transparent)' }}>
                                                                <i className={`fa-solid ${fileGlyph(att.fileName)} text-base`} style={{ color: 'var(--brand-lt)' }}></i>
                                                            </div>
                                                            <p className="text-sm font-bold truncate">{att.fileName}</p>
                                                        </div>
                                                        <div className="flex gap-2 shrink-0">
                                                            {isPdfOrImage(att.fileName) && <button onClick={() => { setPreviewFileUrl(att.fileUrl); setIsPreviewMode(true); }} className="btn btn-ghost flex-1 font-bold px-4 py-2.5 rounded-xl text-xs">미리보기</button>}
                                                            <button onClick={() => handleDownload(selectedMaterial, att)} className="btn btn-primary flex-1 font-bold px-5 py-2.5 rounded-xl text-xs">
                                                                <i className="fa-solid fa-download mr-1.5"></i>다운로드
                                                            </button>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </>
                                    )}
                                    {!isPreviewMode && (
                                        <div className="space-y-4 reveal d3">
                                            <div className="flex justify-between items-center text-[11px] pb-3 border-b" style={{ borderColor: 'var(--line)', color: 'var(--txt-faint)' }}>
                                                <span><i className="fa-regular fa-user mr-1.5"></i>{selectedMaterial.uploader} · {selectedMaterial.date}</span>
                                                {currentUserRank >= 2 && <button onClick={() => deleteMaterial(selectedMaterial.id)} className="font-bold" style={{ color: 'var(--rose)' }}><i className="fa-solid fa-trash mr-1"></i>삭제</button>}
                                            </div>
                                            <div className="eyebrow text-[9px]">Comments</div>
                                            <div className="space-y-2.5 max-h-44 overflow-y-auto pr-1">
                                                {(selectedMaterial.comments || []).map(c => (
                                                    <div key={c.id} className="glass rounded-xl p-3.5 text-xs">
                                                        <span className="font-bold mr-2" style={{ color: 'var(--brand-lt)' }}>{c.author}</span>
                                                        <span style={{ color: 'var(--txt-dim)' }}>{c.text}</span>
                                                    </div>
                                                ))}
                                                {(selectedMaterial.comments || []).length === 0 && <p className="text-[11px] py-3" style={{ color: 'var(--txt-faint)' }}>아직 댓글이 없습니다.</p>}
                                            </div>
                                            <form onSubmit={(e) => handleCommentSubmit(e, selectedMaterial.id, false)} className="flex gap-2">
                                                <input type="text" placeholder="댓글 달기..." value={commentInput} onChange={(e)=>setCommentInput(e.target.value)} className="fld fld-sm flex-1" />
                                                <button type="submit" className="btn btn-dark px-5 rounded-xl text-xs font-bold shrink-0">등록</button>
                                            </form>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ── QnA 상세 모달 ──────────────────── */}
                    {selectedQna && (
                        <div className="modal-bd fixed inset-0 bg-black/75 backdrop-blur-md flex items-center justify-center z-50 p-4">
                            <div className="modal-card glass-solid rounded-[28px] max-w-2xl w-full max-h-[90vh] overflow-hidden flex flex-col">
                                <div className="p-6 border-b flex items-start justify-between gap-4" style={{ borderColor: 'var(--line)' }}>
                                    <div className="min-w-0">
                                        <span className="tag tag-brand mb-2.5 inline-flex">
                                            {selectedQna.grade ? `${selectedQna.grade} · ` : ''}{selectedQna.subject}{selectedQna.subSubject ? ` · ${selectedQna.subSubject}` : ''}
                                        </span>
                                        <h2 className="text-lg font-extrabold leading-snug tracking-tight">{selectedQna.title}</h2>
                                        <p className="text-[11px] mt-1.5" style={{ color: 'var(--txt-faint)' }}>{selectedQna.author} · {selectedQna.date}</p>
                                    </div>
                                    <button onClick={() => setSelectedQna(null)} className="icon-btn shrink-0"><i className="fa-solid fa-xmark"></i></button>
                                </div>
                                <div className="p-6 overflow-y-auto space-y-6 flex-1">
                                    <div className="glass rounded-2xl p-5 text-sm whitespace-pre-wrap leading-relaxed min-h-[100px] reveal" style={{ color: 'var(--txt-dim)' }}>
                                        {selectedQna.content}
                                    </div>
                                    <div className="space-y-4 pt-2 reveal d2">
                                        <div className="flex justify-between items-center">
                                            <div className="eyebrow text-[9px]">Answers · {selectedQna.answers || 0}</div>
                                            {currentUserRank >= 2 && <button onClick={() => deleteQna(selectedQna.id)} className="text-[11px] font-bold" style={{ color: 'var(--rose)' }}><i className="fa-solid fa-trash mr-1"></i>게시글 삭제</button>}
                                        </div>
                                        <div className="space-y-2.5 max-h-60 overflow-y-auto pr-1">
                                            {(selectedQna.comments || []).map(c => (
                                                <div key={c.id} className="glass rounded-xl p-4 text-xs" style={{ borderColor: 'color-mix(in srgb, var(--lime) 18%, transparent)' }}>
                                                    <div className="font-bold mb-1.5" style={{ color: 'var(--brand-lt)' }}>
                                                        {c.author} <span className="font-normal text-[10px] ml-1.5 font-mono" style={{ color: 'var(--txt-faint)' }}>{c.date}</span>
                                                    </div>
                                                    <div style={{ color: 'var(--txt-dim)' }}>{c.text}</div>
                                                </div>
                                            ))}
                                            {(selectedQna.comments || []).length === 0 && <p className="text-[11px] py-3" style={{ color: 'var(--txt-faint)' }}>첫 번째 답변을 남겨보세요.</p>}
                                        </div>
                                        <form onSubmit={(e) => handleCommentSubmit(e, selectedQna.id, true)} className="flex gap-2">
                                            <input type="text" placeholder="답변을 남겨주세요." value={commentInput} onChange={(e)=>setCommentInput(e.target.value)} className="fld fld-sm flex-1" />
                                            <button type="submit" className="btn btn-primary px-5 rounded-xl text-xs font-bold shrink-0">등록</button>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ── 단계 상승 축하 ─────────────────── */}
                    {levelUp !== null && (
                        <>
                            {confetti.length > 0 && (
                                <div className="party" aria-hidden="true">
                                    <span className="party-burst"></span>
                                    {confetti.map(b => (
                                        <b key={b.id} style={{
                                            left: `${b.left}%`, width: b.w, height: b.h, background: b.color,
                                            animationDelay: `${b.delay}s`, ['--dx']: b.dx, ['--rot']: b.rot
                                        }}></b>
                                    ))}
                                </div>
                            )}
                            <div className="modal-bd fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center z-[95] p-4"
                                 role="dialog" aria-label="단계 상승">
                                <div className="party-card glass-solid rounded-[32px] max-w-sm w-full p-9 text-center">
                                    <div className="eyebrow text-[9px] mb-6">Level Up</div>
                                    <div className="party-pet mx-auto" style={{ width: 'min(220px, 55vw)' }}>
                                        <Pet uid={user.uid} petId={user.petId} mins={myStudyMins} size="100%" />
                                    </div>
                                    <h2 className="text-2xl font-extrabold tracking-tight mt-6">
                                        {levelUp === 1 ? '알이 깨졌어요!' : `«${PET_STAGES[levelUp].name}» 단계!`}
                                    </h2>
                                    <p className="text-sm mt-3 leading-relaxed" style={{ color: 'var(--txt-dim)' }}>
                                        {user.petName
                                            ? <><span className="font-extrabold" style={{ color: 'var(--lime-ink)' }}>{user.petName}</span>{PET_STAGES[levelUp].line.replace(/^./, m => m)}</>
                                            : PET_STAGES[levelUp].line}
                                    </p>
                                    <p className="text-[11px] mt-2 font-mono" style={{ color: 'var(--txt-faint)' }}>
                                        누적 {fmtHM(myStudyMins)}
                                    </p>
                                    <button onClick={() => { setLevelUp(null); setConfetti([]); }}
                                            className="btn btn-primary w-full font-extrabold py-4 rounded-2xl text-sm mt-8">
                                        고마워!
                                    </button>
                                    {!user.petName && (
                                        <button onClick={() => { setLevelUp(null); setConfetti([]); setActiveMainTab('pet'); }}
                                                className="w-full text-[11px] font-bold pt-4" style={{ color: 'var(--txt-faint)' }}>
                                            이름 지어주러 가기
                                        </button>
                                    )}
                                </div>
                            </div>
                        </>
                    )}

                    {/* ── 떠다니는 캐릭터 ────────────────── */}
                    {activeMainTab !== 'pet' && (
                    <button className="pet-float" onClick={openPet}
                            aria-label={user.petName ? `${user.petName} 보기` : '캐릭터 이름 지어주기'}>
                        <Pet uid={user.uid} petId={user.petId} mins={myStudyMins} size={64} live={isStudying} />
                        {!user.petName && <span className="pet-ping" aria-hidden="true">!</span>}
                        <span className="pet-tip">
                            {user.petName ? `${user.petName} · ${PET_STAGES[petStageOf(myStudyMins)].name}` : '이름을 지어주세요'}
                        </span>
                    </button>
                    )}

                    {/* ── 캐릭터 창 ──────────────────────── */}
                    {isPetOpen && (() => {
                        const stage = petStageOf(myStudyMins);
                        const next = PET_STAGES[stage + 1];
                        const floor = PET_STAGES[stage].min;
                        const pct = next ? Math.min(100, Math.round(((myStudyMins - floor) / (next.min - floor)) * 100)) : 100;
                        return (
                            <div className="modal-bd fixed inset-0 bg-black/75 backdrop-blur-md flex items-center justify-center z-50 p-4">
                                <div className="modal-card glass-solid rounded-[28px] max-w-sm w-full overflow-hidden">
                                    <div className="p-5 border-b flex justify-between items-center" style={{ borderColor: 'var(--line)' }}>
                                        <div>
                                            <div className="eyebrow text-[8px] mb-1">My Buddy</div>
                                            <h2 className="text-sm font-extrabold">
                                                {user.petName || '이름 없는 친구'}
                                            </h2>
                                        </div>
                                        <button onClick={() => setIsPetOpen(false)} className="icon-btn"><i className="fa-solid fa-xmark"></i></button>
                                    </div>

                                    <div className="p-6 space-y-5">
                                        <div className="flex flex-col items-center">
                                            <Pet uid={user.uid} petId={user.petId} mins={myStudyMins} size={150} live={isStudying} />
                                            <div className="tag tag-brand mt-3">{PET_STAGES[stage].name}</div>
                                            <p className="text-xs mt-3 text-center" style={{ color: 'var(--txt-dim)' }}>
                                                {PET_STAGES[stage].line}
                                            </p>
                                        </div>

                                        <div className="glass rounded-2xl p-4">
                                            <div className="flex justify-between items-baseline mb-2.5">
                                                <span className="eyebrow text-[9px]">누적</span>
                                                <span className="font-mono text-xs font-extrabold">{fmtHM(myStudyMins)}</span>
                                            </div>
                                            <div className="pet-track"><div className="pet-fill" style={{ width: `${pct}%` }}></div></div>
                                            <p className="text-[11px] mt-2.5" style={{ color: 'var(--txt-faint)' }}>
                                                {next
                                                    ? <>«{next.name}»까지 <span className="font-mono font-bold" style={{ color: 'var(--lime-ink)' }}>{fmtHM(next.min - myStudyMins)}</span> 남았어요</>
                                                    : '최고 단계까지 키웠습니다.'}
                                            </p>
                                        </div>

                                        <form onSubmit={handlePetNameSave} className="space-y-2.5">
                                            <label className="eyebrow text-[9px] block">이름 지어주기</label>
                                            <div className="flex gap-2">
                                                <input type="text" value={editPetName} onChange={(e) => setEditPetName(e.target.value)}
                                                       placeholder="예: 뭉치" maxLength="12" className="fld flex-1" disabled={petBusy} />
                                                <button type="submit" disabled={petBusy} className="btn btn-primary px-5 rounded-2xl text-xs font-bold shrink-0">
                                                    {petBusy ? '...' : '저장'}
                                                </button>
                                            </div>
                                            <p className="text-[10px] leading-relaxed" style={{ color: 'var(--txt-faint)' }}>
                                                이름은 언제든 바꿀 수 있어요. 어떤 친구가 나올지는 계정마다 정해져 있어서 바꿀 수 없습니다.
                                            </p>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        );
                    })()}

                    {/* ── 프로필 수정 ────────────────────── */}
                    {isProfileOpen && (
                        <div className="modal-bd fixed inset-0 bg-black/75 backdrop-blur-md flex items-center justify-center z-50 p-4">
                            <div className="modal-card glass-solid rounded-[28px] max-w-sm w-full overflow-hidden">
                                <div className="p-5 border-b flex justify-between items-center" style={{ borderColor: 'var(--line)' }}>
                                    <div className="flex items-center gap-3">
                                        <div className="w-9 h-9 rounded-xl grid place-items-center" style={{ background: 'color-mix(in srgb, var(--lime) 13%, transparent)' }}>
                                            <i className="fa-solid fa-id-card text-sm" style={{ color: 'var(--brand-lt)' }}></i>
                                        </div>
                                        <div>
                                            <div className="eyebrow text-[8px] mb-1">Profile</div>
                                            <h2 className="text-sm font-extrabold">프로필 수정</h2>
                                        </div>
                                    </div>
                                    <button onClick={() => setIsProfileOpen(false)} className="icon-btn"><i className="fa-solid fa-xmark"></i></button>
                                </div>
                                <form onSubmit={handleProfileSave} className="p-6 space-y-4">
                                    <div>
                                        <label className="eyebrow text-[9px] block mb-2">이름</label>
                                        <input type="text" value={editName} onChange={(e) => setEditName(e.target.value)}
                                               className="fld" maxLength="20" disabled={profileBusy} required />
                                    </div>
                                    <div>
                                        <label className="eyebrow text-[9px] block mb-2">학년</label>
                                        <select value={editGrade} onChange={(e) => setEditGrade(e.target.value)} className="fld" disabled={profileBusy}>
                                            <option value="1학년">1학년</option>
                                            <option value="2학년">2학년</option>
                                            <option value="3학년">3학년</option>
                                        </select>
                                    </div>

                                    <div className="glass rounded-xl p-3.5 space-y-1.5">
                                        <div className="flex justify-between text-[11px]">
                                            <span style={{ color: 'var(--txt-faint)' }}>이메일</span>
                                            <span className="font-mono truncate ml-3" style={{ color: 'var(--txt-dim)' }}>{user.email}</span>
                                        </div>
                                        <div className="flex justify-between text-[11px]">
                                            <span style={{ color: 'var(--txt-faint)' }}>직책</span>
                                            <span className="font-bold" style={{ color: 'var(--txt-dim)' }}>{user.position}</span>
                                        </div>
                                        <div className="flex justify-between text-[11px]">
                                            <span style={{ color: 'var(--txt-faint)' }}>누적 학습시간</span>
                                            <span className="font-mono font-bold" style={{ color: 'var(--brand-lt)' }}>{fmtHM(myStudyMins)}</span>
                                        </div>
                                    </div>
                                    <p className="text-[10px] leading-relaxed" style={{ color: 'var(--txt-faint)' }}>
                                        이메일·직책·누적 학습시간은 본인이 변경할 수 없습니다.
                                        이미 올린 자료와 댓글에 남은 이름은 소급 변경되지 않습니다.
                                    </p>

                                    <button type="submit" disabled={profileBusy} className="btn btn-primary w-full font-bold py-3.5 rounded-2xl text-sm">
                                        {profileBusy ? '저장 중...' : '저장'}
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* ── 관리자 콘솔 ────────────────────── */}
                    {isAdminConsoleOpen && (
                        <div className="modal-bd fixed inset-0 bg-black/75 backdrop-blur-md flex items-center justify-center z-50 p-4">
                            <div className="modal-card glass-solid rounded-[28px] max-w-2xl w-full overflow-hidden">
                                <div className="p-5 border-b" style={{ borderColor: 'var(--line)', background: 'var(--surface)' }}>
                                    <div className="flex items-center justify-between mb-4">
                                        <div className="flex items-center gap-3">
                                            <div className="w-9 h-9 rounded-xl grid place-items-center" style={{ background: 'color-mix(in srgb, var(--pink) 14%, transparent)' }}>
                                                <i className="fa-solid fa-sliders text-sm" style={{ color: 'var(--pink-ink)' }}></i>
                                            </div>
                                            <div>
                                                <div className="eyebrow text-[8px] mb-1">Console</div>
                                                <h2 className="text-sm font-extrabold">관리자 권한 시스템</h2>
                                            </div>
                                        </div>
                                        <button onClick={() => setIsAdminConsoleOpen(false)} className="icon-btn"><i className="fa-solid fa-xmark"></i></button>
                                    </div>

                                    <div className="flex gap-1.5 text-[11px] font-bold overflow-x-auto pb-0.5">
                                        <button onClick={() => setAdminTab("config")} className={`chip ${adminTab === 'config' ? 'on' : ''} whitespace-nowrap`}>📢 공지 & 일정</button>
                                        <button onClick={() => setAdminTab("hours")}  className={`chip ${adminTab === 'hours'  ? 'on' : ''} whitespace-nowrap`}>⏱ 공부 시간 데이터</button>
                                        {currentUserRank >= 3 && (
                                            <button onClick={() => { setAdminTab("users"); setAdminUserSubTab(currentUserRank === 4 ? "active" : "pending"); }}
                                                    className={`chip ${adminTab === 'users' ? 'on' : ''} whitespace-nowrap`}>👥 계정 관리</button>
                                        )}
                                        {currentUserRank === 4 && <>
                                            <button onClick={() => setAdminTab("resetHours")} className={`chip ${adminTab === 'resetHours' ? 'on-alt' : ''} whitespace-nowrap`}>
                                                🧹 시간 초기화
                                            </button>
                                            <button onClick={() => setAdminTab("resetMats")} className={`chip ${adminTab === 'resetMats' ? 'on-alt' : ''} whitespace-nowrap`}>
                                                🗂 자료 초기화
                                            </button>
                                        </>}
                                        {currentUserRank >= 3 && (
                                            <button onClick={() => setAdminTab("pinball")} className={`chip ${adminTab === 'pinball' ? 'on-alt' : ''} whitespace-nowrap`}>
                                                🎱 핀볼
                                            </button>
                                        )}
                                        {currentUserRank >= 3 && (
                                            <button onClick={() => setAdminTab("study")} className={`chip ${adminTab === 'study' ? 'on' : ''} whitespace-nowrap`}>
                                                <i className="fa-solid fa-check-double mr-1"></i>학습 인증 승인 ({(studyRecords || []).filter(r => r && r.status === 'pending').length})
                                            </button>
                                        )}
                                    </div>
                                </div>

                                {adminTab === "config" && (
                                    <form onSubmit={handleAdminSettingsSave} className="p-6 space-y-5 max-h-[70vh] overflow-y-auto reveal">
                                        <div>
                                            <label className="eyebrow text-[9px] block mb-2.5">상단 공지 수정</label>
                                            <textarea value={editNotice || ''} onChange={(e) => setEditNotice(e.target.value)} rows="2" className="fld text-xs" required></textarea>
                                        </div>
                                        <div className="divider"></div>
                                        <div>
                                            <label className="eyebrow text-[9px] block mb-2.5">수능 날짜</label>
                                            <input type="date" value={editDday?.csat || ''} onChange={(e)=>setEditDday({...editDday, csat: e.target.value})} className="fld text-xs" required />
                                        </div>
                                        <div className="divider"></div>
                                        <div className="grid sm:grid-cols-2 gap-3">
                                            <div>
                                                <label className="eyebrow text-[9px] block mb-2.5">행사 이름</label>
                                                <input type="text" value={editDday?.examName || ''} onChange={(e)=>setEditDday({...editDday, examName: e.target.value})} className="fld text-xs" required />
                                            </div>
                                            <div>
                                                <label className="eyebrow text-[9px] block mb-2.5">행사 날짜</label>
                                                <input type="date" value={editDday?.examDate || ''} onChange={(e)=>setEditDday({...editDday, examDate: e.target.value})} className="fld text-xs" required />
                                            </div>
                                        </div>
                                        <button type="submit" className="btn btn-primary w-full font-bold py-3.5 rounded-2xl text-sm">설정 즉시 저장</button>
                                    </form>
                                )}

                                {/* ── 공부 시간 데이터 (rank 2 이상) ── */}
                                {adminTab === "hours" && (() => {
                                    const pb = pinballSettings || {};
                                    const sMs = pb.startDate ? new Date(pb.startDate + 'T00:00:00').getTime() : null;
                                    const eMs = pb.endDate   ? new Date(pb.endDate   + 'T23:59:59').getTime() : null;
                                    const q = (userSearchQuery || '').trim();
                                    const rows = (usersList || [])
                                        .filter(u => u && (!q || (u.name||'').includes(q) || (u.grade||'').includes(q)))
                                        .map(u => ({ u, total: u.totalStudyMins || 0, span: approvedMinsIn(u.id, sMs, eMs) }))
                                        .sort((a, b) => b.span - a.span || b.total - a.total);
                                    const sumTotal = rows.reduce((a, r) => a + r.total, 0);
                                    const sumSpan  = rows.reduce((a, r) => a + r.span, 0);
                                    const active   = rows.filter(r => r.span > 0).length;
                                    return (
                                        <div className="p-5 space-y-4 reveal">
                                            <div className="grid grid-cols-3 gap-2.5">
                                                {[['참여 학생', `${active}명`, 'var(--lime-ink)'],
                                                  ['기간 내 합계', fmtHM(sumSpan), 'var(--cyan-ink)'],
                                                  ['전체 누적', fmtHM(sumTotal), 'var(--txt)']].map(([k, v, c]) => (
                                                    <div key={k} className="glass rounded-2xl p-3.5 text-center">
                                                        <div className="eyebrow text-[8px] mb-1.5">{k}</div>
                                                        <div className="font-mono text-sm font-extrabold" style={{ color: c }}>{v}</div>
                                                    </div>
                                                ))}
                                            </div>

                                            <p className="text-[11px] leading-relaxed" style={{ color: 'var(--txt-faint)' }}>
                                                {pb.startDate && pb.endDate
                                                    ? <>기간 <span className="font-mono">{pb.startDate} ~ {pb.endDate}</span> 안에 학습부가 승인한 시간만 «기간 내»로 셉니다.</>
                                                    : '이벤트 기간이 설정되지 않아 «기간 내»는 전체 승인 기록으로 계산됩니다.'}
                                            </p>

                                            <div className="relative">
                                                <span className="absolute inset-y-0 left-0 flex items-center pl-3" style={{ color: 'var(--txt-faint)' }}><i className="fa-solid fa-magnifying-glass text-[10px]"></i></span>
                                                <input type="text" placeholder="이름 또는 학년으로 검색" value={userSearchQuery || ''} onChange={(e) => setUserSearchQuery(e.target.value)} className="fld fld-sm pl-9" />
                                            </div>

                                            <div className="max-h-[46vh] overflow-y-auto rounded-2xl divide-y" style={{ border: '1px solid var(--line)', borderColor: 'var(--line)' }}>
                                                {rows.map(({ u, total, span }, i) => (
                                                    <div key={u.id} className="row p-3 flex items-center justify-between gap-3 text-xs" style={{ borderColor: 'var(--line)' }}>
                                                        <div className="flex items-center gap-2.5 min-w-0">
                                                            <span className="font-mono text-[10px] w-5 shrink-0" style={{ color: 'var(--txt-faint)' }}>{i + 1}</span>
                                                            <span className="font-bold truncate">{u.name}</span>
                                                            <span className="tag tag-neutral shrink-0">{u.grade}</span>
                                                        </div>
                                                        <div className="flex items-center gap-3 shrink-0 font-mono text-[11px]">
                                                            <span style={{ color: 'var(--lime-ink)' }} title="기간 내 승인 시간">{fmtHM(span)}</span>
                                                            <span style={{ color: 'var(--txt-faint)' }} title="전체 누적">{fmtHM(total)}</span>
                                                        </div>
                                                    </div>
                                                ))}
                                                {rows.length === 0 && <EmptyState icon="fa-chart-simple" title="표시할 학생이 없습니다" />}
                                            </div>
                                            <p className="text-[10px]" style={{ color: 'var(--txt-faint)' }}>
                                                왼쪽 초록 숫자가 기간 내 시간, 오른쪽 회색이 전체 누적입니다.
                                            </p>
                                        </div>
                                    );
                                })()}

                                {adminTab === "users" && currentUserRank >= 3 && (
                                    <div className="p-5 space-y-4 reveal">
                                        <div className="flex gap-1.5 overflow-x-auto pb-1">
                                            <button onClick={() => setAdminUserSubTab("pending")} className={`chip ${adminUserSubTab === 'pending' ? 'on-alt' : ''} whitespace-nowrap`}>
                                                승인 대기 ({pendingUsersList.length})
                                            </button>
                                            <button onClick={() => setAdminUserSubTab("suspended")} className={`chip ${adminUserSubTab === 'suspended' ? 'on' : ''} whitespace-nowrap`}>정지 보관함 ({suspendedUsersList.length})</button>
                                            {currentUserRank === 4 && <>
                                                <button onClick={() => setAdminUserSubTab("active")} className={`chip ${adminUserSubTab === 'active' ? 'on' : ''} whitespace-nowrap`}>정상 계정 ({activeUsersList.length})</button>
                                                <button onClick={() => setAdminUserSubTab("pets")} className={`chip ${adminUserSubTab === 'pets' ? 'on-alt' : ''} whitespace-nowrap`}>
                                                    <i className="fa-solid fa-paw mr-1"></i>캐릭터
                                                </button>
                                            </>}
                                        </div>

                                        <div className="relative">
                                            <span className="absolute inset-y-0 left-0 flex items-center pl-3" style={{ color: 'var(--txt-faint)' }}><i className="fa-solid fa-magnifying-glass text-[10px]"></i></span>
                                            <input type="text" placeholder="이름, 직책, 이메일로 검색" value={userSearchQuery || ''} onChange={(e) => setUserSearchQuery(e.target.value)} className="fld fld-sm pl-9" />
                                        </div>

                                        <div className="max-h-[50vh] overflow-y-auto rounded-2xl divide-y" style={{ border: '1px solid var(--line)', borderColor: 'var(--line)' }}>
                                            {filteredDisplayUsers.map(u => (
                                                <div key={u.id} className="row p-3.5 flex justify-between text-xs items-center gap-3" style={{ borderColor: 'var(--line)' }}>
                                                    <div className="flex items-center gap-2.5 min-w-0">
                                                        {adminUserSubTab === "pets" && (
                                                            <span className="shrink-0" style={{ lineHeight: 0 }}>
                                                                <Pet uid={u.id} petId={u.petId} mins={u.totalStudyMins || 0} size={40} ground={false} animate={false} />
                                                            </span>
                                                        )}
                                                        <div className="min-w-0">
                                                            <div className="flex items-center gap-2 flex-wrap">
                                                                <span className="font-bold">{u.name}</span>
                                                                <span className="tag tag-neutral">{u.grade}</span>
                                                                {adminUserSubTab === "pets"
                                                                    ? (u.petName
                                                                        ? <span className="tag tag-brand">«{u.petName}»</span>
                                                                        : <span className="tag tag-neutral">이름 없음</span>)
                                                                    : (u.rank >= 2 && <span className={`tag ${u.rank === 4 ? 'tag-violet' : u.rank === 3 ? 'tag-blue' : 'tag-brand'}`}>{u.position}</span>)}
