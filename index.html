                                            <div className="eyebrow text-[8px] mb-1">Contribute</div>
                                            <h2 className="text-sm font-extrabold">자료 제공하기</h2>
                                        </div>
                                    </div>
                                    <button onClick={()=>setIsUploadOpen(false)} className="icon-btn"><i className="fa-solid fa-xmark"></i></button>
                                </div>
                                <form onSubmit={handleUpload} className="p-6 space-y-3.5 max-h-[70vh] overflow-y-auto">
                                    <input type="text" placeholder="자료 제목" value={newTitle} onChange={(e)=>setNewTitle(e.target.value)} className="fld" disabled={uploadProgress>0} required />

                                    {/* 업로드용 계층형 드롭다운 */}
                                    <div className="flex gap-2.5">
                                        <select value={newGrade} onChange={(e) => {
                                            const g = e.target.value; setNewGrade(g);
                                            const firstSubj = Object.keys(CURRICULUM[g])[0] || ""; setNewSubject(firstSubj);
                                            setNewSubSubject(CURRICULUM[g][firstSubj]?.[0] || "");
                                        }} className="fld fld-sm flex-1">
                                            {Object.keys(CURRICULUM).map(g => <option key={g} value={g}>{g}</option>)}
                                        </select>
                                        <select value={newSubject} onChange={(e) => {
                                            const s = e.target.value; setNewSubject(s);
                                            setNewSubSubject(CURRICULUM[newGrade][s]?.[0] || "");
                                        }} className="fld fld-sm flex-1">
                                            {Object.keys(CURRICULUM[newGrade]).map(s => <option key={s} value={s}>{s}</option>)}
                                        </select>
                                    </div>
                                    {CURRICULUM[newGrade][newSubject]?.length > 0 && (
                                        <select value={newSubSubject} onChange={(e) => setNewSubSubject(e.target.value)} className="fld fld-sm reveal">
                                            {CURRICULUM[newGrade][newSubject].map(ss => <option key={ss} value={ss}>{ss}</option>)}
                                        </select>
                                    )}

                                    <div>
                                        <input type="file" multiple onChange={(e)=>setNewFiles(Array.from(e.target.files))} className="fld text-xs" required disabled={uploadProgress>0} />
                                        {newFiles.length > 0 && (
                                            <div className="mt-2.5 text-[10px] flex flex-col gap-1.5 max-h-24 overflow-y-auto glass rounded-xl p-3 reveal" style={{ color: 'var(--txt-dim)' }}>
                                                {newFiles.map((f, i) => (
                                                    <span key={i} className="truncate">
                                                        <i className={`fa-solid ${fileGlyph(f.name)} mr-1.5`} style={{ color: 'var(--brand-lt)' }}></i>{f.name}
                                                    </span>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                    <textarea placeholder="자료에 대한 설명" value={newDescription} onChange={(e)=>setNewDescription(e.target.value)} rows="3" className="fld" required></textarea>

                                    {uploadProgress > 0 && (
                                        <div className="w-full rounded-full h-1.5 overflow-hidden" style={{ background: 'rgba(255,255,255,.07)' }}>
                                            <div className="h-full rounded-full transition-all duration-300" style={{ width: `${uploadProgress}%`, background: 'linear-gradient(90deg,#6EE7B7,#0B5D3B)' }}></div>
                                        </div>
                                    )}

                                    <button type="submit" disabled={uploadProgress>0} className="btn btn-primary w-full font-bold py-3.5 rounded-2xl text-sm">
                                        {uploadProgress>0 ? `업로드 중... ${uploadProgress}%` : '등록'}
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* ── 토스트 / 알럿 / 확인 ───────────── */}
                    {toast && (
                        <div className="toast fixed bottom-6 right-6 z-[99] glass-solid rounded-2xl py-3.5 px-5 text-xs font-bold flex items-center gap-3 max-w-[calc(100vw-3rem)]">
                            <span className="w-1.5 h-8 rounded-full shrink-0" style={{ background: 'linear-gradient(180deg,var(--brand-lt),var(--brand-dp))' }}></span>
                            {toast.message}
                        </div>
                    )}
                    {customAlert && (
                        <div className="modal-bd fixed inset-0 bg-black/75 backdrop-blur-md flex items-center justify-center z-[100] p-4">
                            <div className="modal-card glass-solid p-7 rounded-3xl max-w-sm w-full text-center">
                                <div className="w-11 h-11 mx-auto mb-4 rounded-2xl grid place-items-center" style={{ background: 'rgba(16,185,129,.13)' }}>
                                    <i className="fa-solid fa-circle-info" style={{ color: 'var(--brand-lt)' }}></i>
                                </div>
                                <h3 className="font-extrabold mb-2 text-sm">{customAlert.title}</h3>
                                <p className="text-xs mb-6 whitespace-pre-wrap leading-relaxed" style={{ color: 'var(--txt-dim)' }}>{customAlert.message}</p>
                                <button onClick={()=>setCustomAlert(null)} className="btn btn-dark w-full text-xs font-bold py-3 rounded-xl">확인</button>
                            </div>
                        </div>
                    )}
                    {customConfirm && (
                        <div className="modal-bd fixed inset-0 bg-black/75 backdrop-blur-md flex items-center justify-center z-[100] p-4">
                            <div className="modal-card glass-solid p-7 rounded-3xl max-w-sm w-full text-center">
                                <div className="w-11 h-11 mx-auto mb-4 rounded-2xl grid place-items-center" style={{ background: 'rgba(251,113,133,.13)' }}>
                                    <i className="fa-solid fa-triangle-exclamation" style={{ color: 'var(--rose)' }}></i>
                                </div>
                                <h3 className="font-extrabold mb-2 text-sm">{customConfirm.title}</h3>
                                <p className="text-xs mb-6 leading-relaxed" style={{ color: 'var(--txt-dim)' }}>{customConfirm.message}</p>
                                <div className="flex gap-2.5">
                                    <button onClick={()=>setCustomConfirm(null)} className="btn btn-ghost flex-1 text-xs font-bold py-3 rounded-xl">취소</button>
                                    <button onClick={()=>{customConfirm.onConfirm(); setCustomConfirm(null);}} className="btn flex-1 text-xs font-bold py-3 rounded-xl text-white" style={{ background: 'linear-gradient(135deg,#F43F5E,#9F1239)' }}>실행</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
