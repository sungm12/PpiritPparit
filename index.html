                            const parts = String(w.text || '').toLowerCase().match(/[a-z]+/g) || [];
                            parts.forEach(t => { if (t.length >= 3) entries.push({ t: t, conf: conf }); });
                        });
                    } else {
                        entries = (String((data && data.text) || '').toLowerCase().match(/[a-z]{3,}/g) || [])
                                    .map(t => ({ t: t, conf: 100 }));
                    }

                    const res = vocabBuildFound(entries, true);
                    const withIdioms = vocabWithIdioms(res.list, String((data && data.text) || ''));
                    setFound(withIdioms); setDropped(res.dropped);

                    // 사전에 뜻이 있고 아직 안 담은 단어는 미리 골라 둔다
                    const pre = {};
                    withIdioms.forEach(it => { if (!it.easy && it.meaning && !savedSet.has(it.word)) pre[it.word] = true; });
                    setPicked(pre);

                    if (!withIdioms.length) showToast("사진에서 영어 단어를 찾지 못했습니다. 글자가 크고 또렷하게 나오도록 다시 찍거나, '직접 입력'으로 쳐 넣어보세요.", "error");
                    else showToast(`영어 단어 ${withIdioms.length}개를 찾았습니다.`);
                } catch (err) {
                    showToast("사진에서 글자를 읽지 못했습니다. 다른 사진으로 시도해 주세요.", "error");
                } finally {
                    vocabLogger = null;
                    setOcrBusy(false); setOcrProgress(0); setOcrStage('');
                }
            };

            /* ── 직접 쳐 넣은 글에서 단어 뽑기 ─────────────────
               사람이 친 글자는 틀릴 일이 없으니 거르지 않는다.
               단어 하나만 쳐도, 지문을 통째로 붙여넣어도 같은 길로 흐른다.
               ─────────────────────────────────────────────── */
            const handleScanText = () => {
                const tokens = (rawText.toLowerCase().match(/[a-z]+/g) || []).filter(t => t.length >= 2);
                if (!tokens.length) return showToast("영어 단어를 찾지 못했습니다. 영어로 적어주세요.", "error");

                setDrafts({}); setDropped(0);
                const res = vocabBuildFound(tokens.map(t => ({ t: t, conf: 100 })), false);
                const list = vocabWithIdioms(res.list, rawText);
                setFound(list);

                // 몇 개 안 되거나 전부 쉬운 단어면, 숨김을 꺼서 눈에 보이게 한다
                if (list.length <= 5 || list.every(f => f.easy)) setHideEasy(false);

                // 짧게 친 것은 통째로 골라 두고, 지문은 어려운 것만 골라 둔다
                const pickAll = list.length <= 5;
                const pre = {};
                list.forEach(it => {
                    if (savedSet.has(it.word)) return;
                    if (pickAll || (!it.easy && it.meaning)) pre[it.word] = true;
                });
                setPicked(pre);

                const nIdiom = list.filter(f => f.idiom).length;
                showToast(nIdiom
                    ? `영어 단어 ${list.length}개를 찾았습니다. (숙어 ${nIdiom}개 포함)`
                    : `영어 단어 ${list.length}개를 찾았습니다.`);
            };

            const togglePick = (w) => setPicked(prev => {
                const next = { ...prev };
                if (next[w]) delete next[w]; else next[w] = true;
                return next;
            });

            const visibleFound = hideEasy ? found.filter(f => !f.easy) : found;
            const pickedCount = Object.keys(picked).length;
            const needMeaning = found.filter(f => picked[f.word] && !f.meaning && !savedSet.has(f.word));

            /* ── 고른 단어를 단어장에 담기 ─────────────────────── */
            const savePicked = async () => {
                if (requireVerified && !requireVerified()) return;
                const m = fm();
                if (!m || !window.db || !user?.uid) return showToast("서버에 연결할 수 없습니다.", "error");

                const items = found.filter(f => picked[f.word] && !savedSet.has(f.word));
                if (!items.length) return showToast("담을 단어를 먼저 선택해 주세요.", "error");

                setSaving(true);
                try {
                    const batch = m.writeBatch(window.db);
                    const now = Date.now();
                    items.forEach((it) => {
                        const ref = m.doc(window.db, ...vocabPath(user.uid), it.word);
                        batch.set(ref, {
                            word: it.word,
                            meaning: (it.meaning || drafts[it.word] || '').trim().slice(0, 200),
                            known: false,
                            createdAt: now
                        });
                    });
                    await batch.commit();

                    // 손으로 적어 넣은 뜻은 공유 사전 후보로도 올려 둔다
                    items.forEach((it) => {
                        if (!it.meaning && drafts[it.word]) voteMeaning(it.word, drafts[it.word]);
                    });

                    setPicked({}); setDrafts({});
                    showToast(`${items.length}개를 단어장에 담았습니다.`);
                    setMode('list');
                } catch (err) {
                    showToast("단어를 저장하지 못했습니다. 잠시 후 다시 시도해 주세요.", "error");
                } finally {
                    setSaving(false);
                }
            };

            /* ── 뜻 고치기 · 지우기 ────────────────────────────── */
            const openEdit = (w) => { setEditWord(w); setEditMeaning(w.meaning || ''); };

            const saveMeaning = async () => {
                if (requireVerified && !requireVerified()) return;
                const m = fm();
                if (!m || !editWord || !user?.uid) return;
                try {
                    await m.updateDoc(m.doc(window.db, ...vocabPath(user.uid), editWord.id), { meaning: editMeaning.trim() });
                    voteMeaning(editWord.word, editMeaning);
                    setEditWord(null);
                    showToast("뜻을 저장했습니다.");
                } catch (err) {
                    showToast("뜻을 저장하지 못했습니다.", "error");
                }
            };

            const removeWord = async (w) => {
                if (requireVerified && !requireVerified()) return;
                const m = fm();
                if (!m || !user?.uid) return;
                try {
                    await m.deleteDoc(m.doc(window.db, ...vocabPath(user.uid), w.id));
                    showToast("단어를 지웠습니다.");
                } catch (err) {
                    showToast("단어를 지우지 못했습니다.", "error");
                }
            };

            const setKnown = async (w, val) => {
                const m = fm();
                if (!m || !user?.uid) return;
                try {
                    await m.updateDoc(m.doc(window.db, ...vocabPath(user.uid), w.id), { known: val });
                } catch (err) {
                    showToast("암기 상태를 저장하지 못했습니다.", "error");
                }
            };

            const filtered = words.filter(w => {
                if (filter === 'known' && !w.known) return false;
                if (filter === 'unknown' && w.known) return false;
                const q = query.trim().toLowerCase();
                if (!q) return true;
                return w.word.includes(q) || (w.meaning || '').includes(q);
            });

            const unknownCount = words.filter(w => !w.known).length;

            /* ── 암기하기 ──────────────────────────────────────── */
            const startQuiz = (scope) => {
                const pool = scope === 'unknown' ? words.filter(w => !w.known) : words;
                if (!pool.length) return showToast("암기할 단어가 없습니다. 먼저 '단어 담기'에서 단어를 담아보세요.", "error");
                const shuffled = pool.slice();
                for (let i = shuffled.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                }
                setQuizList(shuffled); setQuizIdx(0); setFlipped(false); setMode('quiz');
            };

            const answerCard = async (knew) => {
                const cur = quizList[quizIdx];
                if (cur) await setKnown(cur, knew);
                if (quizIdx + 1 >= quizList.length) {
                    showToast("한 바퀴 다 돌았습니다. 수고했어요!");
                    setQuizList([]); setQuizIdx(0); setFlipped(false);
                } else {
                    setQuizIdx(quizIdx + 1); setFlipped(false);
                }
            };

            const card = quizList[quizIdx];

            /* ── 철자 쓰기 ──────────────────────────────────
               뜻을 보고 철자를 직접 친다. 눈으로 훑는 것보다 훨씬 남는다.
               숙어는 뺀다 — 여러 낱말을 통째로 치게 할 수는 없다. */
            const startSpell = (scope) => {
                const pool = (scope === 'unknown' ? words.filter(w => !w.known) : words)
                    .filter(w => w && w.word && w.meaning && /^[a-z]+$/.test(w.word));
                if (!pool.length) {
                    return showToast("철자를 쓸 단어가 없습니다. 뜻이 적힌 한 낱말짜리가 필요해요.", "error");
                }
                const shuffled = pool.slice();
                for (let i = shuffled.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                }
                setSpellList(shuffled.slice(0, 30));
                setSpellIdx(0); setSpellInput(""); setSpellState('typing');
                setSpellScore({ right: 0, total: 0 }); setSpellHint(false);
                setMode('spell');
            };

            const spellCard = spellList[spellIdx];

            const checkSpell = () => {
                if (!spellCard || spellState !== 'typing') return;
                const got = spellInput.trim().toLowerCase();
                if (!got) return;
                const ok = got === spellCard.word;
                setSpellState(ok ? 'right' : 'wrong');
                setSpellScore(s => ({ right: s.right + (ok ? 1 : 0), total: s.total + 1 }));
                // 맞힌 것은 외운 것으로 표시한다. 틀린 것은 건드리지 않는다 —
                // 이미 외웠다고 표시해 둔 것을 한 번 틀렸다고 되돌리면 억울하다.
                if (ok && !spellCard.known) setKnown(spellCard, true);
            };

            const nextSpell = () => {
                if (spellIdx + 1 >= spellList.length) {
                    showToast(`${spellList.length}개 중 ${spellScore.right}개를 맞혔어요.`);
                    setSpellList([]); setSpellIdx(0);
                } else {
                    setSpellIdx(spellIdx + 1);
                }
                setSpellInput(""); setSpellState('typing'); setSpellHint(false);
            };

            return (
                <div className="space-y-5">

                    {/* ── 요약 ────────────────────────────── */}
                    <div className="glass rounded-3xl p-5 flex flex-col sm:flex-row gap-4 sm:items-center justify-between reveal d1">
                        <div className="flex items-center gap-4">
                            <div className="w-12 h-12 rounded-2xl grid place-items-center shrink-0"
                                 style={{ background: 'color-mix(in srgb, var(--lime) 12%, transparent)' }}>
                                <i className="fa-solid fa-book-open text-lg" style={{ color: 'var(--brand-lt)' }}></i>
                            </div>
                            <div>
                                <div className="eyebrow text-[9px] mb-1">Vocabulary</div>
                                <p className="text-[15px] font-extrabold tracking-tight">
                                    담은 단어 {words.length}개
                                    <span className="ml-2 text-xs font-bold" style={{ color: 'var(--txt-faint)' }}>
                                        아직 못 외운 단어 {unknownCount}개
                                    </span>
                                </p>
                                {sharedCount > 0 && (
                                    <p className="text-[11px] mt-0.5" style={{ color: 'var(--txt-faint)' }}>
                                        친구들이 채운 낱말 {sharedCount}개도 함께 쓰고 있어요
                                    </p>
                                )}
                            </div>
                        </div>
                        <div className="seg" style={{ gridTemplateColumns: `repeat(${VOCAB_TABS.length}, minmax(0,1fr))`, maxWidth: '360px' }}>
                            <div className="seg-ind"
                                 style={{ width: `calc((100% - 10px) / ${VOCAB_TABS.length})`,
                                          transform: `translateX(${Math.max(0, VOCAB_TABS.findIndex(t => t.key === mode)) * 100}%)` }}></div>
                            {VOCAB_TABS.map(t => (
                                <button key={t.key} onClick={() => setMode(t.key)} className={`seg-btn ${mode === t.key ? 'on' : ''}`}>
                                    <i className={`fa-solid ${t.icon} mr-1.5 text-[11px]`}></i>{t.label}
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* ── 사진에서 담기 ───────────────────── */}
                    {mode === 'scan' && (
                        <div className="space-y-5">
                            <div className="glass rounded-3xl p-6 reveal d1">
                                <input ref={fileRef} type="file" accept="image/*"
                                       onChange={handlePickPhoto} className="hidden" />

                                {/* 찍어서 담을지, 쳐서 담을지 */}
                                <div className="flex gap-2 mb-5">
                                    {[['photo', '사진에서', 'fa-camera'], ['text', '직접 입력', 'fa-keyboard']].map(([k, label, icon]) => (
                                        <button key={k} onClick={() => setSource(k)} className="chip" disabled={ocrBusy}
                                                style={source === k ? { background: 'color-mix(in srgb, var(--lime) 16%, transparent)', borderColor: 'var(--lime)', color: 'var(--lime-ink)' } : {}}>
                                            <i className={`fa-solid ${icon} mr-1.5 text-[10px]`}></i>{label}
                                        </button>
                                    ))}
                                </div>

                                {source === 'text' && (
                                    <div className="space-y-3">
                                        <textarea rows="6" value={rawText} onChange={(e) => setRawText(e.target.value)}
                                                  placeholder="단어 하나만 쳐도 되고, 지문을 통째로 붙여넣어도 됩니다."
                                                  className="fld" style={{ minHeight: '9rem', lineHeight: 1.7, resize: 'vertical' }}></textarea>
                                        <div className="flex flex-wrap items-center justify-between gap-3">
                                            <p className="text-[11px]" style={{ color: 'var(--txt-faint)' }}>
                                                영어만 골라냅니다. 한글이 섞여 있어도 괜찮아요.
                                            </p>
                                            <button onClick={handleScanText} disabled={!rawText.trim()}
                                                    className="btn btn-primary font-bold px-6 py-2.5 rounded-2xl text-sm flex items-center gap-2"
                                                    style={!rawText.trim() ? { opacity: .5 } : {}}>
                                                <i className="fa-solid fa-wand-magic-sparkles"></i>단어 찾기
                                            </button>
                                        </div>
                                    </div>
                                )}

                                {source === 'photo' && !imgUrl && (
                                    <div className="text-center py-8">
                                        <div className="w-16 h-16 mx-auto mb-5 rounded-2xl grid place-items-center glass">
                                            <i className="fa-solid fa-camera text-2xl" style={{ color: 'var(--txt-faint)' }}></i>
                                        </div>
                                        <p className="text-sm font-extrabold mb-1.5">교과서·문제집을 찍어서 올려보세요</p>
                                        <p className="text-xs leading-relaxed mb-6" style={{ color: 'var(--txt-faint)' }}>
                                            사진 속 영어 단어를 찾아 뜻을 붙여드립니다.<br />
                                            글자가 크고 반듯하게 나오도록, 그늘 없이 찍으면 훨씬 잘 읽습니다.<br />
                                            사진은 서버에 저장되지 않고 이 기기 안에서만 처리됩니다.
                                        </p>
                                        <button onClick={() => fileRef.current && fileRef.current.click()} disabled={ocrBusy}
                                                className="btn btn-primary font-bold px-7 py-3 rounded-2xl text-sm inline-flex items-center gap-2">
                                            <i className="fa-solid fa-image"></i>사진 선택하기
                                        </button>
                                    </div>
                                )}

                                {source === 'photo' && imgUrl && (
                                    <div className="space-y-4">
                                        <div className="rounded-2xl overflow-hidden border" style={{ borderColor: 'var(--line)' }}>
                                            <img src={imgUrl} alt="올린 사진" className="w-full max-h-72 object-contain"
                                                 style={{ background: 'var(--surface)' }} />
                                        </div>
                                        <div className="flex gap-2.5">
                                            <button onClick={() => fileRef.current && fileRef.current.click()} disabled={ocrBusy}
                                                    className="btn btn-ghost font-bold px-5 py-2.5 rounded-xl text-xs flex items-center gap-2">
                                                <i className="fa-solid fa-rotate"></i>다른 사진
                                            </button>
                                        </div>
                                    </div>
                                )}

                                {ocrBusy && (
                                    <div className="mt-5">
                                        <div className="flex justify-between text-[11px] font-bold mb-2">
                                            <span style={{ color: 'var(--txt-dim)' }}>{ocrStage}</span>
                                            <span className="font-mono" style={{ color: 'var(--brand-lt)' }}>{ocrProgress}%</span>
                                        </div>
                                        <div className="h-1.5 rounded-full overflow-hidden" style={{ background: 'var(--surface)' }}>
                                            <div className="h-full rounded-full transition-all"
                                                 style={{ width: `${ocrProgress}%`, background: 'var(--lime)' }}></div>
                                        </div>
                                        <p className="text-[11px] mt-2.5" style={{ color: 'var(--txt-faint)' }}>
                                            처음 한 번은 인식 데이터를 내려받느라 조금 느릴 수 있습니다.
                                        </p>
                                    </div>
                                )}
                            </div>

                            {found.length > 0 && !ocrBusy && (
                                <div className="glass rounded-3xl p-6 reveal">
                                    <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
                                        <div>
                                            <div className="eyebrow text-[9px] mb-1">Found · {visibleFound.length} words</div>
                                            <p className="text-[13px] font-extrabold">담고 싶은 단어를 눌러 고르세요</p>
                                            {dropped > 0 && (
                                                <p className="text-[11px] mt-1" style={{ color: 'var(--txt-faint)' }}>
                                                    잘못 읽힌 것 같은 {dropped}개는 뺐습니다. 찾던 단어가 없으면 '직접 입력'으로 쳐 넣어보세요.
                                                </p>
                                            )}
                                        </div>
                                        <button onClick={() => setHideEasy(!hideEasy)}
                                                className={`chip ${hideEasy ? '' : 'opacity-60'}`}
                                                style={hideEasy ? { color: 'var(--brand-lt)', borderColor: 'var(--lime)' } : {}}>
                                            <i className={`fa-solid ${hideEasy ? 'fa-eye-slash' : 'fa-eye'} mr-1.5 text-[10px]`}></i>
                                            쉬운 단어 숨기기
                                        </button>
                                    </div>

                                    <div className="flex flex-wrap gap-2">
                                        {visibleFound.map((f) => {
                                            const already = savedSet.has(f.word);
                                            const on = !!picked[f.word];
                                            return (
                                                <button key={f.word} type="button" disabled={already}
                                                        onClick={() => togglePick(f.word)}
                                                        title={f.meaning || '사전에 없는 단어 — 뜻은 직접 적어야 합니다'}
                                                        className="chip text-left"
                                                        style={already
                                                            ? { opacity: .45, cursor: 'default' }
                                                            : on
                                                                ? { background: 'color-mix(in srgb, var(--lime) 16%, transparent)', borderColor: 'var(--lime)', color: 'var(--lime-ink)' }
                                                                : {}}>
                                                    {already && <i className="fa-solid fa-check mr-1.5 text-[9px]"></i>}
                                                    {on && !already && <i className="fa-solid fa-plus mr-1.5 text-[9px]"></i>}
                                                    {f.idiom && <i className="fa-solid fa-link mr-1.5 text-[9px]" style={{ color: 'var(--cyan-ink)' }}></i>}
                                                    <span className="font-mono">{f.word}</span>
                                                    {f.meaning && <span className="ml-1.5 font-semibold opacity-70">{f.meaning.split(',')[0]}</span>}
                                                    {!f.meaning && <span className="ml-1.5 font-semibold opacity-50">뜻 직접 입력</span>}
                                                </button>
                                            );
                                        })}
                                        {visibleFound.length === 0 && (
                                            <p className="text-xs py-6 w-full text-center" style={{ color: 'var(--txt-faint)' }}>
                                                어려운 단어가 없네요. '쉬운 단어 숨기기'를 꺼보세요.
                                            </p>
                                        )}
                                    </div>

                                    {needMeaning.length > 0 && (
                                        <div className="mt-6 pt-5 border-t" style={{ borderColor: 'var(--line)' }}>
                                            <p className="text-[13px] font-extrabold">사전에 없는 단어예요</p>
                                            <p className="text-[11px] mt-1 mb-3.5" style={{ color: 'var(--txt-faint)' }}>
                                                뜻을 적어주세요. 비워두고 담아도 되고, 나중에 '내 단어장'에서 채워도 됩니다.<br />
                                                같은 뜻을 적은 친구가 한 명 더 생기면 이 낱말은 모두의 사전에 들어갑니다.
                                                누가 적었는지는 남지 않아요.
                                            </p>
                                            <div className="space-y-2.5">
                                                {needMeaning.map((f) => (
                                                    <div key={f.word} className="flex items-center gap-2.5">
                                                        <span className="font-mono text-xs font-bold shrink-0" style={{ minWidth: '6.5rem' }}>{f.word}</span>
                                                        <input type="text" placeholder="뜻" value={drafts[f.word] || ''} maxLength={200}
                                                               onChange={(e) => setDrafts(prev => ({ ...prev, [f.word]: e.target.value }))}
                                                               className="fld fld-sm flex-1" />
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                    <div className="mt-6 pt-5 border-t flex flex-wrap items-center justify-between gap-3"
                                         style={{ borderColor: 'var(--line)' }}>
                                        {/* 개수는 오른쪽 단추에도 적혀 있다.
                                            좁은 화면에서는 왼쪽 아래 캐릭터에 가려지기만 해서 접는다. */}
                                        <span className="text-xs font-bold hidden sm:inline" style={{ color: 'var(--txt-faint)' }}>
                                            {pickedCount}개 선택됨
                                        </span>
                                        <button onClick={savePicked} disabled={saving || pickedCount === 0}
                                                className="btn btn-primary font-bold px-6 py-3 rounded-2xl text-sm flex items-center gap-2 ml-auto"
                                                style={pickedCount === 0 ? { opacity: .5 } : {}}>
                                            <i className={`fa-solid ${saving ? 'fa-spinner fa-spin' : 'fa-download'}`}></i>
                                            {saving ? '담는 중' : `${pickedCount}개 단어장에 담기`}
                                        </button>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}

                    {/* ── 철자 쓰기 ───────────────────────
                        뜻을 보고 철자를 직접 친다. 카드를 뒤집어 보기만 하는 것보다 남는다. */}
                    {mode === 'spell' && (
                        <div className="space-y-5">
                            {!spellCard ? (
                                <div className="glass rounded-3xl p-8 text-center reveal d1">
                                    <div className="w-16 h-16 mx-auto mb-5 rounded-2xl grid place-items-center glass">
                                        <i className="fa-solid fa-keyboard text-2xl" style={{ color: 'var(--txt-faint)' }}></i>
                                    </div>
                                    <p className="text-sm font-extrabold mb-1.5">뜻을 보고 철자를 써보세요</p>
                                    <p className="text-xs leading-relaxed mb-6" style={{ color: 'var(--txt-faint)' }}>
                                        한 번에 30개씩 나옵니다. 맞히면 '외운 단어'로 넘어가요.<br />
                                        숙어는 나오지 않습니다.
                                    </p>
                                    <div className="flex flex-wrap gap-2.5 justify-center">
                                        <button onClick={() => startSpell('unknown')}
                                                className="btn btn-primary font-bold px-6 py-3 rounded-2xl text-sm flex items-center gap-2">
                                            <i className="fa-solid fa-play"></i>못 외운 단어만
                                        </button>
                                        <button onClick={() => startSpell('all')}
                                                className="btn btn-ghost font-bold px-6 py-3 rounded-2xl text-sm flex items-center gap-2">
                                            <i className="fa-solid fa-shuffle"></i>전체에서
                                        </button>
                                    </div>
                                </div>
                            ) : (
                                <div className="space-y-4">
                                    <div className="flex items-center justify-between px-1">
                                        <span className="eyebrow text-[9px]">{spellIdx + 1} / {spellList.length}</span>
                                        <div className="flex items-center gap-2">
                                            <span className="text-[11px] font-bold" style={{ color: 'var(--txt-faint)' }}>
                                                <span className="font-mono" style={{ color: 'var(--lime-ink)' }}>{spellScore.right}</span>
                                                {' / '}
                                                <span className="font-mono">{spellScore.total}</span>
                                            </span>
                                            <button onClick={() => { setSpellList([]); setSpellIdx(0); }} className="chip text-[10px]">
                                                <i className="fa-solid fa-xmark mr-1.5 text-[9px]"></i>그만하기
                                            </button>
                                        </div>
                                    </div>

                                    <div className="h-1 rounded-full overflow-hidden" style={{ background: 'var(--surface)' }}>
                                        <div className="h-full rounded-full transition-all"
                                             style={{ width: `${(spellIdx / spellList.length) * 100}%`, background: 'var(--lime)' }}></div>
                                    </div>

                                    <div className="glass rounded-[28px] p-8 sm:p-10 text-center">
                                        <div className="eyebrow text-[9px] mb-4">이 뜻을 가진 단어는?</div>
                                        <p className="text-xl sm:text-2xl font-extrabold leading-relaxed mb-2">
                                            {spellCard.meaning}
                                        </p>
                                        <p className="font-mono text-sm mb-7" style={{ color: 'var(--txt-faint)' }}>
                                            {spellHint
                                                ? spellCard.word[0] + '·'.repeat(Math.max(0, spellCard.word.length - 1))
                                                : `${spellCard.word.length}글자`}
                                        </p>

                                        <input type="text" value={spellInput} autoFocus autoComplete="off"
                                               autoCapitalize="off" spellCheck="false"
                                               disabled={spellState !== 'typing'}
                                               onChange={(e) => setSpellInput(e.target.value)}
                                               onKeyDown={(e) => {
                                                   if (e.key !== 'Enter') return;
                                                   if (spellState === 'typing') checkSpell(); else nextSpell();
                                               }}
                                               placeholder="영어로 써보세요"
                                               className="fld text-center font-mono text-lg"
                                               style={spellState === 'right'
                                                   ? { borderColor: 'var(--lime)', color: 'var(--lime-ink)' }
                                                   : spellState === 'wrong'
                                                       ? { borderColor: 'var(--rose)', color: 'var(--rose)' } : {}} />

                                        {spellState === 'wrong' && (
                                            <p className="text-sm mt-4 font-bold">
                                                <span style={{ color: 'var(--txt-faint)' }}>정답은 </span>
                                                <span className="font-mono" style={{ color: 'var(--lime-ink)' }}>{spellCard.word}</span>
                                            </p>
                                        )}
                                        {spellState === 'right' && (
                                            <p className="text-sm mt-4 font-extrabold" style={{ color: 'var(--lime-ink)' }}>
                                                <i className="fa-solid fa-check mr-1.5"></i>맞았어요
                                            </p>
                                        )}

                                        <div className="flex gap-2.5 justify-center mt-7 flex-wrap">
                                            {spellState === 'typing' ? (
                                                <>
                                                    <button onClick={() => setSpellHint(true)} disabled={spellHint}
                                                            className="btn btn-ghost font-bold px-5 py-2.5 rounded-xl text-xs"
                                                            style={spellHint ? { opacity: .45 } : {}}>
                                                        <i className="fa-solid fa-lightbulb mr-1.5"></i>첫 글자
                                                    </button>
                                                    <button onClick={checkSpell} disabled={!spellInput.trim()}
                                                            className="btn btn-primary font-bold px-6 py-2.5 rounded-xl text-xs"
                                                            style={!spellInput.trim() ? { opacity: .5 } : {}}>
                                                        확인
                                                    </button>
                                                </>
                                            ) : (
                                                <button onClick={nextSpell}
                                                        className="btn btn-primary font-bold px-7 py-2.5 rounded-xl text-xs">
                                                    다음 <i className="fa-solid fa-arrow-right ml-1.5"></i>
                                                </button>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}

                    {/* ── 내 단어장 ───────────────────────── */}
                    {mode === 'list' && (
                        <div className="space-y-5">
                            <div className="glass rounded-3xl p-4 flex flex-col sm:flex-row gap-3 items-center reveal d1">
                                <div className="w-full relative">
                                    <span className="absolute inset-y-0 left-0 flex items-center pl-4" style={{ color: 'var(--txt-faint)' }}>
                                        <i className="fa-solid fa-magnifying-glass text-xs"></i>
                                    </span>
                                    <input type="text" placeholder="단어나 뜻으로 검색" value={query}
                                           onChange={(e) => setQuery(e.target.value)} className="fld pl-11" />
                                </div>
                                <div className="flex gap-2 shrink-0">
                                    {[['all', '전체'], ['unknown', '모르는'], ['known', '외운']].map(([k, label]) => (
                                        <button key={k} onClick={() => setFilter(k)} className="chip"
                                                style={filter === k ? { background: 'color-mix(in srgb, var(--lime) 16%, transparent)', borderColor: 'var(--lime)', color: 'var(--lime-ink)' } : {}}>
                                            {label}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            {loading ? (
                                <div className="glass rounded-3xl">
                                    <EmptyState icon="fa-spinner" title="단어장을 불러오는 중" />
                                </div>
                            ) : filtered.length === 0 ? (
                                <div className="glass rounded-3xl">
                                    <EmptyState icon="fa-book-open"
                                                title={words.length === 0 ? "아직 담은 단어가 없습니다" : "조건에 맞는 단어가 없습니다"}
                                                desc={words.length === 0 ? "'단어 담기'에서 사진을 찍거나 직접 쳐 넣어보세요." : "검색어나 필터를 바꿔보세요."} />
                                </div>
                            ) : (
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                    {filtered.map((w, i) => (
                                        <div key={w.id} className="glass topline lift rounded-[22px] p-5 reveal"
                                             style={{ animationDelay: `${Math.min(i, 9) * .05}s` }}>
                                            <div className="flex items-start justify-between gap-3 mb-3">
                                                <p className="text-[17px] font-extrabold font-mono tracking-tight break-all">{w.word}</p>
                                                <span className={`tag ${w.known ? 'tag-brand' : 'tag-neutral'} shrink-0`}>
                                                    {w.known ? '외움' : '모름'}
                                                </span>
                                            </div>
                                            <p className="text-[13px] leading-relaxed mb-4 min-h-[20px]"
                                               style={{ color: w.meaning ? 'var(--txt-dim)' : 'var(--txt-faint)' }}>
                                                {w.meaning || '뜻이 아직 없습니다'}
                                            </p>
                                            <div className="flex gap-2 pt-3 border-t" style={{ borderColor: 'var(--line)' }}>
                                                <button onClick={() => setKnown(w, !w.known)}
                                                        className="btn btn-ghost flex-1 py-2 rounded-xl text-[11px] font-bold">
                                                    <i className={`fa-solid ${w.known ? 'fa-rotate-left' : 'fa-check'} mr-1.5 text-[10px]`}></i>
                                                    {w.known ? '다시 외우기' : '외웠어요'}
                                                </button>
                                                <button onClick={() => openEdit(w)} title="뜻 고치기"
                                                        className="btn btn-ghost px-3 py-2 rounded-xl text-[11px] font-bold">
                                                    <i className="fa-solid fa-pen text-[10px]"></i>
                                                </button>
                                                <button onClick={() => removeWord(w)} title="단어 지우기"
                                                        className="btn btn-ghost px-3 py-2 rounded-xl text-[11px] font-bold"
                                                        style={{ color: 'var(--rose)' }}>
                                                    <i className="fa-solid fa-trash text-[10px]"></i>
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    )}

                    {/* ── 암기하기 ────────────────────────── */}
                    {mode === 'quiz' && (
                        <div className="space-y-5">
                            {!card ? (
                                <div className="glass rounded-3xl p-8 text-center reveal d1">
                                    <div className="w-16 h-16 mx-auto mb-5 rounded-2xl grid place-items-center glass">
                                        <i className="fa-solid fa-layer-group text-2xl" style={{ color: 'var(--txt-faint)' }}></i>
                                    </div>
                                    <p className="text-sm font-extrabold mb-1.5">플래시카드로 외워봅시다</p>
                                    <p className="text-xs leading-relaxed mb-6" style={{ color: 'var(--txt-faint)' }}>
                                        영어 단어를 보고 뜻을 떠올린 뒤 카드를 뒤집어 확인하세요.
                                    </p>
                                    <div className="flex flex-wrap gap-2.5 justify-center">
                                        <button onClick={() => startQuiz('unknown')}
                                                className="btn btn-primary font-bold px-6 py-3 rounded-2xl text-sm flex items-center gap-2">
                                            <i className="fa-solid fa-play"></i>못 외운 단어만 ({unknownCount})
                                        </button>
                                        <button onClick={() => startQuiz('all')}
                                                className="btn btn-ghost font-bold px-6 py-3 rounded-2xl text-sm flex items-center gap-2">
                                            <i className="fa-solid fa-shuffle"></i>전체 ({words.length})
                                        </button>
                                    </div>
                                </div>
                            ) : (
                                <div className="space-y-4">
                                    <div className="flex items-center justify-between px-1">
                                        <span className="eyebrow text-[9px]">{quizIdx + 1} / {quizList.length}</span>
                                        <button onClick={() => { setQuizList([]); setQuizIdx(0); setFlipped(false); }}
                                                className="chip text-[10px]">
                                            <i className="fa-solid fa-xmark mr-1.5 text-[9px]"></i>그만하기
                                        </button>
                                    </div>
                                    <div className="h-1 rounded-full overflow-hidden" style={{ background: 'var(--surface)' }}>
                                        <div className="h-full rounded-full transition-all"
                                             style={{ width: `${((quizIdx) / quizList.length) * 100}%`, background: 'var(--lime)' }}></div>
                                    </div>

                                    <button type="button" onClick={() => setFlipped(!flipped)}
                                            className="glass topline shine w-full rounded-[28px] p-10 min-h-[220px] flex flex-col items-center justify-center text-center reveal">
                                        {!flipped ? (
                                            <>
                                                <p className="text-[32px] sm:text-[38px] font-extrabold font-mono tracking-tight break-all">{card.word}</p>
                                                <p className="text-[11px] mt-4 font-bold" style={{ color: 'var(--txt-faint)' }}>
                                                    <i className="fa-solid fa-hand-pointer mr-1.5"></i>눌러서 뜻 보기
                                                </p>
                                            </>
                                        ) : (
                                            <>
                                                <p className="text-lg sm:text-xl font-extrabold leading-relaxed" style={{ color: 'var(--brand-lt)' }}>
                                                    {card.meaning || '뜻이 아직 없습니다'}
                                                </p>
                                                <p className="text-xs mt-3 font-mono font-bold" style={{ color: 'var(--txt-faint)' }}>{card.word}</p>
                                            </>
                                        )}
                                    </button>

                                    {flipped && (
                                        <div className="flex gap-3">
                                            <button onClick={() => answerCard(false)}
                                                    className="btn btn-ghost flex-1 font-bold py-3.5 rounded-2xl text-sm flex items-center justify-center gap-2">
                                                <i className="fa-solid fa-rotate-left"></i>아직 몰라요
                                            </button>
                                            <button onClick={() => answerCard(true)}
                                                    className="btn btn-primary flex-1 font-bold py-3.5 rounded-2xl text-sm flex items-center justify-center gap-2">
                                                <i className="fa-solid fa-check"></i>외웠어요
                                            </button>
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>
                    )}

                    {/* ── 뜻 고치기 ───────────────────────── */}
                    {editWord && (
                        <div className="modal-bd fixed inset-0 bg-black/70 backdrop-blur-md flex items-center justify-center z-[100] p-4"
                             onClick={() => setEditWord(null)}>
                            <div className="modal-card glass-solid p-7 rounded-3xl max-w-sm w-full" onClick={(e) => e.stopPropagation()}>
                                <div className="eyebrow text-[9px] mb-2">Edit meaning</div>
                                <p className="text-2xl font-extrabold font-mono tracking-tight mb-5 break-all">{editWord.word}</p>
                                <textarea value={editMeaning} onChange={(e) => setEditMeaning(e.target.value)} rows={3}
                                          placeholder="이 단어의 뜻을 적어주세요" className="fld resize-none" autoFocus />
                                <div className="flex gap-2.5 mt-5">
                                    <button onClick={() => setEditWord(null)}
                                            className="btn btn-ghost flex-1 font-bold py-3 rounded-xl text-sm">취소</button>
                                    <button onClick={saveMeaning}
                                            className="btn btn-primary flex-1 font-bold py-3 rounded-xl text-sm">저장</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        function App() {
            const [user, setUser] = useState(null);
            const [isLoginView, setIsLoginView] = useState(true);
            const [isLocalMode, setIsLocalMode] = useState(true);
            const [isFirebaseLoading, setIsFirebaseLoading] = useState(true);

            const [activeMainTab, setActiveMainTab] = useState("materials");

            const [signUpEmail, setSignUpEmail] = useState("");
            const [signUpPassword, setSignUpPassword] = useState("");
            const [signUpPasswordConfirm, setSignUpPasswordConfirm] = useState("");
            const [signUpName, setSignUpName] = useState("");
            const [signUpGrade, setSignUpGrade] = useState("1학년");

            const [loginEmail, setLoginEmail] = useState("");
            const [loginPassword, setLoginPassword] = useState("");

            const [materials, setMaterials] = useState([]);
            const [qnaList, setQnaList] = useState([]);

            const [selectedMaterial, setSelectedMaterial] = useState(null);
            const [selectedQna, setSelectedQna] = useState(null);
            const [replies, setReplies] = useState([]);
            const [replyText, setReplyText] = useState("");
            const [replyBusy, setReplyBusy] = useState(false);
            const [newQnaPrivate, setNewQnaPrivate] = useState(false);
            const [searchQuery, setSearchQuery] = useState("");

            // 필터링 상태 확장
            const [activeGradeFilter, setActiveGradeFilter] = useState("전체");
            const [activeSubjectFilter, setActiveSubjectFilter] = useState("전체");
            const [activeSubSubjectFilter, setActiveSubSubjectFilter] = useState("전체");

            const [isUploadOpen, setIsUploadOpen] = useState(false);
            const [isQnaWriteOpen, setIsQnaWriteOpen] = useState(false);
            const [isPreviewMode, setIsPreviewMode] = useState(false);

            // 업로드 상태 확장
            const [newTitle, setNewTitle] = useState("");
            const [newGrade, setNewGrade] = useState("1학년");
            const [newSubject, setNewSubject] = useState("수학");
            const [newSubSubject, setNewSubSubject] = useState("");
            const [newFiles, setNewFiles] = useState([]);
            const [newDescription, setNewDescription] = useState("");
            const [uploadProgress, setUploadProgress] = useState(0);

            const [previewFileUrl, setPreviewFileUrl] = useState(null);

            // QnA 작성 상태 확장
            const [newQnaTitle, setNewQnaTitle] = useState("");
            const [newQnaContent, setNewQnaContent] = useState("");

            // 초기화 (최고 관리자 전용)
            const [resetHoursDate, setResetHoursDate] = useState('');
            const [resetHoursTotals, setResetHoursTotals] = useState(false);
            const [resetMatsDate, setResetMatsDate] = useState('');
            const [resetBusy, setResetBusy] = useState(false);
            const [resetProgress, setResetProgress] = useState(0);

            // 핀볼 추첨
            const [pinballSettings, setPinballSettings] = useState({ enabled: false, startDate: '', endDate: '', prize: '', baseHours: 30, stepHours: 10 });
            const [editPinball, setEditPinball] = useState(null);
            // 학습부가 미리 계산해 둔 응모 명단. 학생은 이것만 읽는다.
            const [pinballRoster, setPinballRoster] = useState(null);
            const [rosterBusy, setRosterBusy] = useState(false);
            const [myRecords, setMyRecords] = useState([]);
            const [recTab, setRecTab] = useState('chart');   // 'chart' | 'list'
            const [sharedVocabCount, setSharedVocabCount] = useState(0);
            const [vocabSyncBusy, setVocabSyncBusy] = useState(false);
            const [sharedVocabMap, setSharedVocabMap] = useState({});
            const [vocabAdminQuery, setVocabAdminQuery] = useState("");
            const [pinballBusy, setPinballBusy] = useState(false);

            // 성장 캐릭터 — 이름은 학생이 직접 짓는다
            const [isPetOpen, setIsPetOpen] = useState(false);
            const [editPetName, setEditPetName] = useState("");
            const [petBusy, setPetBusy] = useState(false);
            const [levelUp, setLevelUp] = useState(null);   // 단계 상승 축하
            const [confetti, setConfetti] = useState([]);

            // 프로필 수정 (이름 · 학년)
            const [isProfileOpen, setIsProfileOpen] = useState(false);
            const [editName, setEditName] = useState("");
            const [editGrade, setEditGrade] = useState("1학년");
            const [profileBusy, setProfileBusy] = useState(false);

            const [isAdminConsoleOpen, setIsAdminConsoleOpen] = useState(false);
            const [adminTab, setAdminTab] = useState("config");
            const [adminUserSubTab, setAdminUserSubTab] = useState("active");
            const [usersList, setUsersList] = useState([]);
            const [userSearchQuery, setUserSearchQuery] = useState("");

            const [noticeText, setNoticeText] = useState("삐릿빠릿 실시간 자습실이 오픈되었습니다! 공부 기록을 남기고 명예의 전당에 도전하세요.");
            const [editNotice, setEditNotice] = useState(noticeText);
            const [ddaySettings, setDdaySettings] = useState({ csat: '2026-11-12', examName: '학교 행사', examDate: '2026-12-10' });
            const [editDday, setEditDday] = useState({ ...ddaySettings });
            const [schedule, setSchedule] = useState([]);          // 1년 학사일정
            const [editSchedule, setEditSchedule] = useState([]);
            const [isScheduleOpen, setIsScheduleOpen] = useState(false);
            const [scheduleYear, setScheduleYear] = useState(new Date().getFullYear());

            const [toast, setToast] = useState(null);
            const [customConfirm, setCustomConfirm] = useState(null);
            const [customAlert, setCustomAlert] = useState(null);

            const [liveStudyUsers, setLiveStudyUsers] = useState([]);
            const [studyRecords, setStudyRecords] = useState([]);

            const [isStudying, setIsStudying] = useState(false);
            const [studyStartTime, setStudyStartTime] = useState(null);
            const [elapsedMins, setElapsedMins] = useState(0);
            const [elapsedSecs, setElapsedSecs] = useState(0);

            const [isStudyProofModalOpen, setIsStudyProofModalOpen] = useState(false);
            const [recordedMins, setRecordedMins] = useState(0);
            const [studyProofFile, setStudyProofFile] = useState(null);
            const [studyProofProgress, setStudyProofProgress] = useState(0);

            const [scrolled, setScrolled] = useState(false);
            const heroRef = useRef(null);

            // 라이트 / 다크. <head> 부트 스크립트가 이미 첫 값을 심어둔다.
            const [theme, setTheme] = useState(() => document.documentElement.getAttribute('data-theme') || 'light');
            const toggleTheme = () => {
                const next = theme === 'light' ? 'dark' : 'light';
                setTheme(next);
                document.documentElement.setAttribute('data-theme', next);
                try { localStorage.setItem('ppirit_theme', next); } catch (e) {}
            };
            const themeToggle = (extra = "") => (
                <button onClick={toggleTheme} className={`theme-btn ${extra}`}
                        title={theme === 'light' ? '다크 모드로 전환' : '라이트 모드로 전환'} aria-label="테마 전환">
                    <i className={`fa-solid ${theme === 'light' ? 'fa-moon' : 'fa-sun'} text-sm`}></i>
                </button>
            );

            // Firebase Auth 원본 사용자 객체(이메일 인증 여부 확인용)
            const [authUser, setAuthUser] = useState(null);
            const [authBusy, setAuthBusy] = useState(false);
            const listenersStarted = useRef(false);
            const studyRecordsBound = useRef(false);
            const unsubscribers = useRef([]);

            // 로그아웃 시 실시간 구독을 모두 끊어, 이전 세션 데이터가 남지 않게 한다.
            const stopAllListeners = () => {
                unsubscribers.current.forEach(u => { try { u(); } catch (e) {} });
                unsubscribers.current = [];
                listenersStarted.current = false;
                studyRecordsBound.current = false;
                setMaterials([]); setQnaList([]); setUsersList([]);
                setLiveStudyUsers([]); setStudyRecords([]);
            };

            // onSnapshot 을 감싸 해제 함수를 자동으로 모아둔다.
            const trackedOnSnapshot = (...args) => {
                const unsub = window.firebaseMethods.onSnapshot(...args);
                unsubscribers.current.push(unsub);
                return unsub;
            };

            const showToast = (message, type = "success") => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 3000);
            };

            const triggerAlert = (message, title = "삐릿빠릿 시스템 안내") => setCustomAlert({ message, title });
            const triggerConfirm = (message, onConfirm, title = "권한 실행 요청") => setCustomConfirm({ message, title, onConfirm });

            const isValidEmail = (email) => !!email && /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email);

            // 이메일 인증을 마친 계정만 쓰기 동작을 할 수 있다.
            // 화면에서 막는 동시에 보안 규칙에서도 동일하게 강제된다.
            const emailVerified = !!authUser?.emailVerified;
            const requireVerified = () => {
                if (emailVerified) return true;
                triggerAlert(
                    "이메일 인증을 완료해야 쓸 수 있는 기능입니다.\n화면 상단의 안내에서 인증 메일을 다시 받을 수 있습니다.",
                    "이메일 인증 필요"
                );
                return false;
            };

            // 헤더 스크롤 반응
            useEffect(() => {
                const onScroll = () => setScrolled(window.scrollY > 8);
                window.addEventListener('scroll', onScroll, { passive: true });
                return () => window.removeEventListener('scroll', onScroll);
            }, []);

            // 로그인 화면 커서 스포트라이트
            const handleHeroMove = (e) => {
                const el = heroRef.current;
                if (!el) return;
                const r = el.getBoundingClientRect();
                el.style.setProperty('--mx', `${e.clientX - r.left}px`);
                el.style.setProperty('--my', `${e.clientY - r.top}px`);
            };

            // ── 인증 부트스트랩 ────────────────────────────────────────────
            // Firebase Authentication 세션이 유일한 신원 증명이다.
            // 예전처럼 localStorage 에 세션을 넣어두지 않으므로, 브라우저에서
            // 값을 조작해 관리자 행세를 하는 것이 불가능하다.
            useEffect(() => {
                const bindAuth = () => {
                    if (!window.firebaseMethods) {
                        setIsLocalMode(true);
                        setIsFirebaseLoading(false);
                        return;
                    }
                    const { onAuthStateChanged, doc, getDoc, setDoc, signOut } = window.firebaseMethods;
                    setIsLocalMode(false);

                    onAuthStateChanged(window.auth, async (fUser) => {
                        if (!fUser) {
                            stopAllListeners();
                            setAuthUser(null);
                            setUser(null);
                            setIsFirebaseLoading(false);
                            return;
                        }

                        setAuthUser(fUser);

                        try {
                            const uref = doc(window.db, 'artifacts', window.appId, 'public', 'data', 'users', fUser.uid);
                            let snap = await getDoc(uref);

                            // 문서가 없으면(가입 직후 등) 최소 프로필을 만들어 둔다.
                            if (!snap.exists()) {
                                await setDoc(uref, {
                                    uid: fUser.uid,
                                    name: (fUser.email || "").split('@')[0],
                                    email: fUser.email,
                                    grade: "1학년",
                                    rank: 1,
                                    position: "일반 학생",
                                    status: "pending",
                                    totalStudyMins: 0,
                                    createdAt: Date.now()
                                });
                                snap = await getDoc(uref);
                            }

                            const profile = { ...snap.data(), id: fUser.uid, uid: fUser.uid };

                            // 정지된 계정은 즉시 세션을 끊는다.
                            if (profile.status === 'suspended') {
                                await signOut(window.auth);
                                triggerAlert("관리자에 의해 사이트 이용이 정지된 계정입니다. 부서에 문의하세요.");
                                setIsFirebaseLoading(false);
                                return;
                            }

                            setUser(profile);

                            // 승인된 계정만 실시간 데이터를 구독한다.
                            // 리스너는 세션당 한 번만 연결한다.
                            if (profile.status === 'active' && !listenersStarted.current) {
                                listenersStarted.current = true;
                                listenToCloudMaterials(profile.rank || 1);
                                if ((profile.rank || 1) >= 2) listenToCloudQna(profile.rank || 1);
                                else listenToQnaAsStudent(fUser.email);
                                listenToCloudSettings();
                                listenToLiveStudyUsers();
                                listenToCloudUsers();
                                listenToPinballRoster();
                                listenToSharedVocab();
                                // 승인 기록 원본은 임원(rank 2)부터만 내려받는다.
                                // «공부 시간 데이터» 창이 기간을 직접 재집계해야 해서 원본이 필요하다.
                                // 일반 학생은 미리 계산된 명단만 읽으므로 남의 기록이 브라우저로 가지 않는다.
                                if ((profile.rank || 1) >= 2) {
                                    studyRecordsBound.current = true;
                                    listenToStudyRecords();
                                } else {
                                    // 일반 학생은 자기 기록만 받는다.
                                    // user 상태는 아직 갱신 전이라 uid 를 직접 넘긴다.
                                    listenToMyRecords(fUser.uid);
                                }
                            }
                        } catch (e) {
                            console.warn("프로필을 불러오지 못했습니다.", e);
                            triggerAlert("프로필을 불러오지 못했습니다. 네트워크 상태를 확인한 뒤 새로고침해 주세요.");
                        }
                        setIsFirebaseLoading(false);
                    });
                };

                const handleFirebaseInitEvent = () => bindAuth();
                window.addEventListener('firebase-initialized', handleFirebaseInitEvent);
                if (window.firebaseMethods) bindAuth();

                return () => window.removeEventListener('firebase-initialized', handleFirebaseInitEvent);
            }, []);

            // 초 단위로 살아 움직이는 타이머
            useEffect(() => {
                let interval;
                if (isStudying && studyStartTime) {
                    const tick = () => {
                        const s = Math.max(0, Math.floor((Date.now() - studyStartTime) / 1000));
                        setElapsedSecs(s);
                        setElapsedMins(Math.floor(s / 60));
                    };
                    tick();
                    interval = setInterval(tick, 1000);
                } else {
                    setElapsedSecs(0);
                }
                return () => clearInterval(interval);
            }, [isStudying, studyStartTime]);

            useEffect(() => {
                if (user && user.uid && liveStudyUsers.length > 0) {
                    const myLiveStatus = liveStudyUsers.find(u => u && u.id === user.uid);
                    if (myLiveStatus && !isStudying) {
                        setIsStudying(true);
                        setStudyStartTime(myLiveStatus.startTime);
                        setElapsedMins(Math.floor((Date.now() - myLiveStatus.startTime) / 60000));

                        // 창을 닫았다 돌아온 경우다. 그냥 두면 마무리를 안 눌러 기록을 잃는다.
                        const mins = Math.floor((Date.now() - myLiveStatus.startTime) / 60000);
                        if (mins >= 1) {
                            showToast(`아직 자습 중이에요. ${Math.floor(mins/60)}시간 ${mins%60}분째 — 끝내려면 '공부 종료'를 눌러주세요.`);
                        }
                    }
                }
            }, [user, liveStudyUsers]);

            // 내 프로필(등급·직책·누적시간)이 서버에서 바뀌면 화면에 반영한다.
            // 값의 출처는 항상 Firestore 이며 로컬에 사본을 두지 않는다.
            useEffect(() => {
                if (!user || !user.uid || usersList.length === 0) return;
                const myLatest = usersList.find(u => u && u.id === user.uid);
                if (!myLatest) return;

                if (myLatest.status === 'suspended') {
                    if (window.firebaseMethods) window.firebaseMethods.signOut(window.auth).catch(()=>{});
                    return;
                }

                if (myLatest.totalStudyMins !== user.totalStudyMins || myLatest.rank !== user.rank || myLatest.position !== user.position) {
                    setUser(prev => ({
                        ...prev,
                        totalStudyMins: myLatest.totalStudyMins,
                        rank: myLatest.rank,
                        position: myLatest.position
                    }));
                }
            }, [usersList, user?.uid]);

            // 로그인한 뒤에 임원으로 승급되면 그때 승인 기록을 붙인다.
            // (새로고침을 요구하지 않기 위한 처리)
            useEffect(() => {
                if (!user || (user.rank || 1) < 2) return;
                if (!listenersStarted.current || studyRecordsBound.current) return;
                studyRecordsBound.current = true;
                listenToStudyRecords();
            }, [user?.rank]);

            /* 최근 것부터 정해진 수만큼만 받아 오는 질의를 만든다.
               도구가 없는 옛 환경이나 시연용 껍데기에서는 컬렉션을 그대로 돌려준다. */
            const recentQuery = (colRef, howMany, full) => {
                const { query, orderBy, limit, documentId } = window.firebaseMethods || {};
                if (full || !query || !orderBy || !limit || !documentId) return colRef;
                try {
                    return query(colRef, orderBy(documentId(), 'desc'), limit(howMany));
                } catch (e) { return colRef; }
            };

            const MATERIALS_LIMIT = 300;
            const QNA_LIMIT = 200;

            const listenToCloudMaterials = (rank) => {
                const { collection } = window.firebaseMethods; const onSnapshot = trackedOnSnapshot;
                const colRef = collection(window.db, 'artifacts', window.appId, 'public', 'data', 'materials');
                onSnapshot(recentQuery(colRef, MATERIALS_LIMIT, (rank || 1) >= 3), (snapshot) => {
                    const cloudList = [];
                    snapshot.forEach((d) => { if(d.data()) cloudList.push({ ...d.data(), id: d.id }); });
                    cloudList.sort((a, b) => (b.date || "").localeCompare(a.date || ""));
                    setMaterials(cloudList);
                }, () => setIsLocalMode(true));
            };

            /* 요구사항 목록.

               임원은 전부 받는다.
               학생은 두 번 물어본다 — 공개 글, 그리고 내가 쓴 글.
               파이어스토어는 '이거 또는 저거' 를 한 번에 못 물어보고,
               서버도 그 두 조건으로만 열어 두었다.
               둘을 받아 합치고 겹치는 것은 지운다. */
            const qnaPublic = useRef([]);
            const qnaMine = useRef([]);
            const mergeQna = () => {
                const box = new Map();
                [...qnaPublic.current, ...qnaMine.current].forEach(q => { if (q && q.id) box.set(q.id, q); });
                const list = Array.from(box.values());
                list.sort((a, b) => (b.date || "").localeCompare(a.date || "") || String(b.id).localeCompare(String(a.id)));
                setQnaList(list);
            };

            const listenToQnaAsStudent = (email) => {
                const { collection, query, where, limit } = window.firebaseMethods;
                const onSnapshot = trackedOnSnapshot;
                if (!query || !where || !limit) return;
                const colRef = collection(window.db, 'artifacts', window.appId, 'public', 'data', 'qna');

                onSnapshot(query(colRef, where('private', '==', false), limit(QNA_LIMIT)), (snap) => {
                    const rows = []; snap.forEach(d => { const v = d.data(); if (v) rows.push({ ...v, id: d.id }); });
                    qnaPublic.current = rows; mergeQna();
                }, () => {});

                onSnapshot(query(colRef, where('authorEmail', '==', email), limit(QNA_LIMIT)), (snap) => {
                    const rows = []; snap.forEach(d => { const v = d.data(); if (v) rows.push({ ...v, id: d.id }); });
                    qnaMine.current = rows; mergeQna();
                }, () => {});
            };

            const listenToCloudQna = (rank) => {
                const { collection } = window.firebaseMethods; const onSnapshot = trackedOnSnapshot;
                const colRef = collection(window.db, 'artifacts', window.appId, 'public', 'data', 'qna');
                onSnapshot(recentQuery(colRef, QNA_LIMIT, (rank || 1) >= 3), (snapshot) => {
                    const qList = [];
                    snapshot.forEach((d) => { if(d.data()) qList.push({ ...d.data(), id: d.id }); });
                    qList.sort((a, b) => (b.date || "").localeCompare(a.date || ""));
                    setQnaList(qList);
                });
            };

            const listenToCloudSettings = () => {
                const { doc } = window.firebaseMethods; const onSnapshot = trackedOnSnapshot;
                onSnapshot(doc(window.db, 'artifacts', window.appId, 'public', 'data', 'settings', 'config'), (docSnap) => {
                    if (docSnap.exists() && docSnap.data()) {
                        const data = docSnap.data();
                        if (data.dday) { setDdaySettings(data.dday); setEditDday(data.dday); }
                        if (data.notice !== undefined) { setNoticeText(data.notice); setEditNotice(data.notice); }
                        if (data.pinball) { setPinballSettings(data.pinball); setEditPinball(data.pinball); }
                        if (Array.isArray(data.schedule)) { setSchedule(data.schedule); setEditSchedule(data.schedule); }
                    }
                });
            };

            /* 학생들이 채운 낱말을 받아 사전에 얹는다.
               낱말 하나에 문서 하나씩 두면 접속할 때마다 낱말 수만큼 읽게 된다.
               그래서 전부 문서 하나에 담아 두고 여기서 한 번만 읽는다. */
            const listenToSharedVocab = () => {
                const { doc } = window.firebaseMethods;
                const onSnapshot = trackedOnSnapshot;
                onSnapshot(doc(window.db, 'artifacts', window.appId, 'public', 'data', 'settings', 'vocabShared'), (docSnap) => {
                    const words = (docSnap.exists() && docSnap.data() && docSnap.data().words) || {};
                    setSharedVocabMap(words);
                    setSharedVocabCount(window.vocabAddShared ? window.vocabAddShared(words) : 0);
                });
            };

            /* 공개·비공개를 붙이기 전에 올라온 글에는 private 필드가 없다.
               학생 쪽 질의가 private == false 로 거르기 때문에, 그대로 두면
               옛 글이 학생 목록에서 통째로 사라진다.
               전부 받는 임원이 지나갈 때 조용히 채워 둔다. */
            useEffect(() => {
                if ((user?.rank || 1) < 2 || isLocalMode || !window.firebaseMethods) return;
                const older = (qnaList || []).filter(q => q && typeof q.private !== 'boolean').slice(0, 50);
                if (!older.length) return;
                const t = setTimeout(() => {
                    const { doc, updateDoc } = window.firebaseMethods;
                    older.forEach(q => {
                        updateDoc(doc(window.db, 'artifacts', window.appId, 'public', 'data', 'qna', q.id),
                                  { private: false }).catch(() => {});
                    });
                }, 3000);
                return () => clearTimeout(t);
            }, [user?.rank, qnaList]);

            const listenToPinballRoster = () => {
                const { doc } = window.firebaseMethods;
                const onSnapshot = trackedOnSnapshot;
                onSnapshot(doc(window.db, 'artifacts', window.appId, 'public', 'data', 'settings', 'pinballRoster'), (docSnap) => {
                    setPinballRoster(docSnap.exists() ? docSnap.data() : null);
                });
            };

            const listenToCloudUsers = () => {
                const { collection } = window.firebaseMethods; const onSnapshot = trackedOnSnapshot;
                onSnapshot(collection(window.db, 'artifacts', window.appId, 'public', 'data', 'users'), (snapshot) => {
                    const uList = [];
                    snapshot.forEach((d) => {
                        const userData = d.data();
                        if (userData) {
                            if (!userData.rank) userData.rank = 1;
                            if (!userData.position) userData.position = '일반 학생';
                            if (!userData.status) userData.status = 'active';
                            if (userData.totalStudyMins === undefined) userData.totalStudyMins = 0;
                            // 비밀번호는 더 이상 저장하지 않지만, 구버전 문서가 남아 있을 수 있으므로
                            // 클라이언트 상태로는 절대 들이지 않는다.
                            delete userData.password;
                            uList.push({ ...userData, id: d.id });
                        }
                    });
                    setUsersList(uList);
                }, (error) => console.warn("유저 목록 로드 실패"));
            };

            /* 타이머 상한이 8시간이다. 그보다 오래 켜져 있는 것은
               학생이 마무리를 누르지 않고 창을 닫고 간 자리다. */
            const LIVE_STALE_MS = 8 * 60 * 60 * 1000;
            const isStaleLive = (r) => !r || !r.startTime || (Date.now() - r.startTime) > LIVE_STALE_MS;

            const listenToLiveStudyUsers = () => {
                const { collection } = window.firebaseMethods; const onSnapshot = trackedOnSnapshot;
                onSnapshot(collection(window.db, 'artifacts', window.appId, 'public', 'data', 'live_study'), (snapshot) => {
                    const liveList = [];
                    // 닫고 간 자리는 목록에서 뺀다. 며칠째 공부 중인 사람이 보이면 안 된다.
                    snapshot.forEach((d) => { const v = d.data(); if (v && !isStaleLive(v)) liveList.push({ ...v, id: d.id }); });
                    setLiveStudyUsers(liveList);
                });
            };

            /* 승인 기록은 해가 갈수록 쌓인다. 통째로 받으면 접속할 때마다 그만큼 읽는다.
               최근 것만 받는다. 문서 ID 가 String(Date.now()) 이라 이름순이 곧 시간순이다.
               더 옛 기록이 필요하면 '공부 시간 데이터' 창에서 기간을 넓혀 다시 부른다. */
            const STUDY_RECORDS_LIMIT = 4000;

            /* 내가 낸 인증 기록.
               임원은 이미 전체를 받으므로 그걸 걸러 쓰고,
               일반 학생만 따로 '내 것만' 질의를 건다.
               규칙이 그 조건을 요구한다 — 조건 없이 부르면 서버가 거부한다. */
            const listenToMyRecords = (uid) => {
                const { collection, query, where, limit } = window.firebaseMethods;
                const onSnapshot = trackedOnSnapshot;
                if (!uid || !query || !where || !limit) return;
                const colRef = collection(window.db, 'artifacts', window.appId, 'public', 'data', 'study_records');
                const un = onSnapshot(
                    query(colRef, where('userUid', '==', uid), limit(200)),
                    (snap) => {
                        const rows = [];
                        snap.forEach(d => { const v = d.data(); if (v) rows.push({ ...v, id: d.id }); });
                        rows.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                        setMyRecords(rows);
                    },
                    () => setMyRecords([])
                );
                return un;
            };

            const listenToStudyRecords = () => {
                const { collection } = window.firebaseMethods; const onSnapshot = trackedOnSnapshot;
                const colRef = collection(window.db, 'artifacts', window.appId, 'public', 'data', 'study_records');
                onSnapshot(recentQuery(colRef, STUDY_RECORDS_LIMIT, false), (snapshot) => {
                    const rList = [];
                    snapshot.forEach((d) => { if(d.data()) rList.push({ ...d.data(), id: d.id }); });
                    rList.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                    setStudyRecords(rList);
                });
            };

            // 예전 버전은 이 브라우저의 localStorage 에 평문 비밀번호를 보관했다.
            // 이관이 끝난 계정은 흔적을 지워 평문이 남지 않게 한다.
            const purgeLegacyLocalAccount = (email) => {
                try {
                    const legacy = JSON.parse(localStorage.getItem("dogye_archive_users") || "[]");
                    const rest = legacy.filter(u => u && u.email !== email);
                    if (rest.length > 0) localStorage.setItem("dogye_archive_users", JSON.stringify(rest));
                    else localStorage.removeItem("dogye_archive_users");
                } catch (e) { localStorage.removeItem("dogye_archive_users"); }
                localStorage.removeItem("dogye_current_user");
            };

            const findLegacyLocalAccount = (email, password) => {
                try {
                    const legacy = JSON.parse(localStorage.getItem("dogye_archive_users") || "[]");
                    return legacy.find(u => u && u.email === email && u.password === password) || null;
                } catch (e) { return null; }
            };

            const handleLogin = async (e) => {
                e.preventDefault();
                if (authBusy) return;
                if (!window.firebaseMethods) return triggerAlert("인증 서버에 연결할 수 없습니다. 네트워크 상태를 확인해 주세요.");
                if (!loginEmail || !loginPassword) return triggerAlert("이메일 주소와 비밀번호를 입력해 주세요.");
                if (!isValidEmail(loginEmail)) return triggerAlert("이메일 주소 형식을 확인해 주세요.");

                const { signInWithEmailAndPassword, createUserWithEmailAndPassword, sendEmailVerification, doc, setDoc } = window.firebaseMethods;
                setAuthBusy(true);

                try {
                    await signInWithEmailAndPassword(window.auth, loginEmail, loginPassword);
                    purgeLegacyLocalAccount(loginEmail);
                    showToast("로그인되었습니다.");
                } catch (err) {
                    // 구버전 계정 자동 이관: 이 브라우저에 같은 이메일·비밀번호 기록이 남아 있으면
                    // 동일한 자격으로 정식 Firebase 계정을 만들어 준다.
                    const legacy = findLegacyLocalAccount(loginEmail, loginPassword);
                    const migratable = ['auth/user-not-found', 'auth/invalid-credential', 'auth/wrong-password'].includes(err.code);

                    if (legacy && migratable) {
                        try {
                            const cred = await createUserWithEmailAndPassword(window.auth, loginEmail, loginPassword);
