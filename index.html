                                                <h2 className="text-sm font-extrabold">관리자 권한 시스템</h2>
                                            </div>
                                        </div>
                                        <button onClick={() => setIsAdminConsoleOpen(false)} className="icon-btn"><i className="fa-solid fa-xmark"></i></button>
                                    </div>

                                    <div className="flex gap-1.5 text-[11px] font-bold overflow-x-auto pb-0.5">
                                        <button onClick={() => setAdminTab("config")} className={`chip ${adminTab === 'config' ? 'on' : ''} whitespace-nowrap`}>📢 공지 & 일정</button>
                                        <button onClick={() => setAdminTab("hours")}  className={`chip ${adminTab === 'hours'  ? 'on' : ''} whitespace-nowrap`}>⏱ 공부 시간 데이터</button>
                                        {currentUserRank >= 3 && (
                                            <button onClick={() => { setAdminTab("users"); setAdminUserSubTab(currentUserRank === 4 ? "active" : "pending"); }}
                                                    className={`chip ${adminTab === 'users' ? 'on' : ''} whitespace-nowrap`}>👥 계정 관리</button>
                                        )}
                                        {currentUserRank === 4 && <>
                                            <button onClick={() => setAdminTab("resetHours")} className={`chip ${adminTab === 'resetHours' ? 'on-alt' : ''} whitespace-nowrap`}>
                                                🧹 시간 초기화
                                            </button>
                                            <button onClick={() => setAdminTab("resetMats")} className={`chip ${adminTab === 'resetMats' ? 'on-alt' : ''} whitespace-nowrap`}>
                                                🗂 자료 초기화
                                            </button>
                                        </>}
                                        {currentUserRank >= 3 && (
                                            <button onClick={() => setAdminTab("pinball")} className={`chip ${adminTab === 'pinball' ? 'on-alt' : ''} whitespace-nowrap`}>
                                                🎱 핀볼
                                            </button>
                                        )}
                                        {currentUserRank >= 3 && (
                                            <button onClick={() => setAdminTab("vocab")} className={`chip ${adminTab === 'vocab' ? 'on' : ''} whitespace-nowrap`}>
                                                📖 공유 사전
                                            </button>
                                        )}
                                        {currentUserRank >= 3 && (
                                            <button onClick={() => setAdminTab("study")} className={`chip ${adminTab === 'study' ? 'on' : ''} whitespace-nowrap`}>
                                                <i className="fa-solid fa-check-double mr-1"></i>학습 인증 승인 ({(studyRecords || []).filter(r => r && r.status === 'pending').length})
                                            </button>
                                        )}
                                    </div>
                                </div>

                                {adminTab === "config" && (
                                    <form onSubmit={handleAdminSettingsSave} className="p-6 space-y-5 max-h-[70vh] overflow-y-auto reveal">
                                        <div>
                                            <label className="eyebrow text-[9px] block mb-2.5">상단 공지 수정</label>
                                            <textarea value={editNotice || ''} onChange={(e) => setEditNotice(e.target.value)} rows="2"
                                                      placeholder="비워 두면 위쪽 공지줄에 아무것도 안 뜹니다."
                                                      className="fld text-xs"></textarea>
                                        </div>
                                        <div className="divider"></div>
                                        <div>
                                            <label className="eyebrow text-[9px] block mb-2.5">수능 날짜</label>
                                            <input type="date" value={editDday?.csat || ''} onChange={(e)=>setEditDday({...editDday, csat: e.target.value})} className="fld text-xs" />
                                        </div>
                                        <div className="divider"></div>
                                        <div className="grid sm:grid-cols-2 gap-3">
                                            <div>
                                                <label className="eyebrow text-[9px] block mb-2.5">행사 이름</label>
                                                <input type="text" value={editDday?.examName || ''} onChange={(e)=>setEditDday({...editDday, examName: e.target.value})} className="fld text-xs" />
                                            </div>
                                            <div>
                                                <label className="eyebrow text-[9px] block mb-2.5">행사 날짜</label>
                                                <input type="date" value={editDday?.examDate || ''} onChange={(e)=>setEditDday({...editDday, examDate: e.target.value})} className="fld text-xs" />
                                            </div>
                                        </div>
                                        <div className="divider"></div>

                                        {/* 1년 학사일정.
                                            settings/config 안에 배열로 들어가므로 읽기가 늘지 않는다. */}
                                        <div>
                                            <div className="flex items-center justify-between gap-3 mb-2.5">
                                                <label className="eyebrow text-[9px]">학사일정 · {(editSchedule || []).length}건</label>
                                                <button type="button" onClick={scheduleAddRow}
                                                        className="btn btn-ghost px-3 py-1.5 rounded-lg text-[10px] font-bold">
                                                    <i className="fa-solid fa-plus mr-1.5"></i>일정 추가
                                                </button>
                                            </div>

                                            <p className="text-[11px] mb-3" style={{ color: 'var(--txt-faint)' }}>
                                                날짜와 이름만 적으면 됩니다. 저장할 때 날짜순으로 정리되고, 빈 줄은 버려집니다.
                                            </p>

                                            <div className="space-y-2">
                                                {(editSchedule || []).map((it) => (
                                                    <div key={it.id} className="glass rounded-xl p-2.5 flex flex-wrap items-center gap-2">
                                                        <input type="date" value={it.date || ''}
                                                               onChange={(e) => scheduleSetRow(it.id, { date: e.target.value })}
                                                               className="fld fld-sm text-[11px] w-auto shrink-0" />
                                                        <select value={it.kind || '행사'}
                                                                onChange={(e) => scheduleSetRow(it.id, { kind: e.target.value })}
                                                                className="fld fld-sm text-[11px] w-auto shrink-0">
                                                            {SCHEDULE_KINDS.map(k => <option key={k} value={k}>{k}</option>)}
                                                        </select>
                                                        <input type="text" value={it.title || ''} maxLength={60}
                                                               placeholder="일정 이름 (예: 1학기 기말고사)"
                                                               onChange={(e) => scheduleSetRow(it.id, { title: e.target.value })}
                                                               className="fld fld-sm text-[11px] flex-1" style={{ minWidth: '10rem' }} />
                                                        <button type="button" onClick={() => scheduleDropRow(it.id)}
                                                                className="btn btn-ghost px-2.5 py-1.5 rounded-lg text-[10px] font-bold shrink-0"
                                                                style={{ color: 'var(--rose)' }}>빼기</button>
                                                    </div>
                                                ))}
                                                {(editSchedule || []).length === 0 && (
                                                    <p className="text-[11px] py-5 text-center" style={{ color: 'var(--txt-faint)' }}>
                                                        아직 넣은 일정이 없습니다. '일정 추가'를 눌러보세요.
                                                    </p>
                                                )}
                                            </div>
                                        </div>

                                        <button type="submit" className="btn btn-primary w-full font-bold py-3.5 rounded-2xl text-sm">설정 즉시 저장</button>
                                    </form>
                                )}

                                {/* ── 공부 시간 데이터 (rank 2 이상) ── */}
                                {adminTab === "hours" && (() => {
                                    const pb = pinballSettings || {};
                                    const sMs = pb.startDate ? new Date(pb.startDate + 'T00:00:00').getTime() : null;
                                    const eMs = pb.endDate   ? new Date(pb.endDate   + 'T23:59:59').getTime() : null;
                                    const q = (userSearchQuery || '').trim();
                                    const rows = (usersList || [])
                                        .filter(u => u && (!q || (u.name||'').includes(q) || (u.grade||'').includes(q)))
                                        .map(u => ({ u, total: u.totalStudyMins || 0, span: approvedMinsIn(u.id, sMs, eMs) }))
                                        .sort((a, b) => b.span - a.span || b.total - a.total);
                                    const sumTotal = rows.reduce((a, r) => a + r.total, 0);
                                    const sumSpan  = rows.reduce((a, r) => a + r.span, 0);
                                    const active   = rows.filter(r => r.span > 0).length;
                                    return (
                                        <div className="p-5 space-y-4 reveal">
                                            <div className="grid grid-cols-3 gap-2.5">
                                                {[['참여 학생', `${active}명`, 'var(--lime-ink)'],
                                                  ['기간 내 합계', fmtHM(sumSpan), 'var(--cyan-ink)'],
                                                  ['전체 누적', fmtHM(sumTotal), 'var(--txt)']].map(([k, v, c]) => (
                                                    <div key={k} className="glass rounded-2xl p-3.5 text-center">
                                                        <div className="eyebrow text-[8px] mb-1.5">{k}</div>
                                                        <div className="font-mono text-sm font-extrabold" style={{ color: c }}>{v}</div>
                                                    </div>
                                                ))}
                                            </div>

                                            <p className="text-[11px] leading-relaxed" style={{ color: 'var(--txt-faint)' }}>
                                                {pb.startDate && pb.endDate
                                                    ? <>기간 <span className="font-mono">{pb.startDate} ~ {pb.endDate}</span> 안에 학습부가 승인한 시간만 «기간 내»로 셉니다.</>
                                                    : '이벤트 기간이 설정되지 않아 «기간 내»는 전체 승인 기록으로 계산됩니다.'}
                                            </p>

                                            <div className="relative">
                                                <span className="absolute inset-y-0 left-0 flex items-center pl-3" style={{ color: 'var(--txt-faint)' }}><i className="fa-solid fa-magnifying-glass text-[10px]"></i></span>
                                                <input type="text" placeholder="이름 또는 학년으로 검색" value={userSearchQuery || ''} onChange={(e) => setUserSearchQuery(e.target.value)} className="fld fld-sm pl-9" />
                                            </div>

                                            <div className="max-h-[46vh] overflow-y-auto rounded-2xl divide-y" style={{ border: '1px solid var(--line)', borderColor: 'var(--line)' }}>
                                                {rows.map(({ u, total, span }, i) => (
                                                    <div key={u.id} className="row p-3 flex items-center justify-between gap-3 text-xs" style={{ borderColor: 'var(--line)' }}>
                                                        <div className="flex items-center gap-2.5 min-w-0">
                                                            <span className="font-mono text-[10px] w-5 shrink-0" style={{ color: 'var(--txt-faint)' }}>{i + 1}</span>
                                                            <span className="font-bold truncate">{u.name}</span>
                                                            <span className="tag tag-neutral shrink-0">{u.grade}</span>
                                                        </div>
                                                        <div className="flex items-center gap-3 shrink-0 font-mono text-[11px]">
                                                            <span style={{ color: 'var(--lime-ink)' }} title="기간 내 승인 시간">{fmtHM(span)}</span>
                                                            <span style={{ color: 'var(--txt-faint)' }} title="전체 누적">{fmtHM(total)}</span>
                                                        </div>
                                                    </div>
                                                ))}
                                                {rows.length === 0 && <EmptyState icon="fa-chart-simple" title="표시할 학생이 없습니다" />}
                                            </div>
                                            <p className="text-[10px]" style={{ color: 'var(--txt-faint)' }}>
                                                왼쪽 초록 숫자가 기간 내 시간, 오른쪽 회색이 전체 누적입니다.
                                            </p>
                                        </div>
                                    );
                                })()}

                                {adminTab === "users" && currentUserRank >= 3 && (
                                    <div className="p-5 space-y-4 reveal">
                                        <div className="flex gap-1.5 overflow-x-auto pb-1">
                                            <button onClick={() => setAdminUserSubTab("pending")} className={`chip ${adminUserSubTab === 'pending' ? 'on-alt' : ''} whitespace-nowrap`}>
                                                승인 대기 ({pendingUsersList.length})
                                            </button>
                                            <button onClick={() => setAdminUserSubTab("suspended")} className={`chip ${adminUserSubTab === 'suspended' ? 'on' : ''} whitespace-nowrap`}>정지 보관함 ({suspendedUsersList.length})</button>
                                            {currentUserRank === 4 && <>
                                                <button onClick={() => setAdminUserSubTab("active")} className={`chip ${adminUserSubTab === 'active' ? 'on' : ''} whitespace-nowrap`}>정상 계정 ({activeUsersList.length})</button>
                                                <button onClick={() => setAdminUserSubTab("pets")} className={`chip ${adminUserSubTab === 'pets' ? 'on-alt' : ''} whitespace-nowrap`}>
                                                    <i className="fa-solid fa-paw mr-1"></i>캐릭터
                                                </button>
                                            </>}
                                        </div>

                                        <div className="relative">
                                            <span className="absolute inset-y-0 left-0 flex items-center pl-3" style={{ color: 'var(--txt-faint)' }}><i className="fa-solid fa-magnifying-glass text-[10px]"></i></span>
                                            <input type="text" placeholder="이름, 직책, 이메일로 검색" value={userSearchQuery || ''} onChange={(e) => setUserSearchQuery(e.target.value)} className="fld fld-sm pl-9" />
                                        </div>

                                        <div className="max-h-[50vh] overflow-y-auto rounded-2xl divide-y" style={{ border: '1px solid var(--line)', borderColor: 'var(--line)' }}>
                                            {filteredDisplayUsers.map(u => (
                                                <div key={u.id} className="row p-3.5 flex justify-between text-xs items-center gap-3" style={{ borderColor: 'var(--line)' }}>
                                                    <div className="flex items-center gap-2.5 min-w-0">
                                                        {adminUserSubTab === "pets" && (
                                                            <span className="shrink-0" style={{ lineHeight: 0 }}>
                                                                <Pet uid={u.id} petId={u.petId} mins={u.totalStudyMins || 0} size={40} ground={false} animate={false} />
                                                            </span>
                                                        )}
                                                        <div className="min-w-0">
                                                            <div className="flex items-center gap-2 flex-wrap">
                                                                <span className="font-bold">{u.name}</span>
                                                                <span className="tag tag-neutral">{u.grade}</span>
                                                                {adminUserSubTab === "pets"
                                                                    ? (u.petName
                                                                        ? <span className="tag tag-brand">«{u.petName}»</span>
                                                                        : <span className="tag tag-neutral">이름 없음</span>)
                                                                    : (u.rank >= 2 && <span className={`tag ${u.rank === 4 ? 'tag-violet' : u.rank === 3 ? 'tag-blue' : 'tag-brand'}`}>{u.position}</span>)}
                                                            </div>
                                                            <div className="text-[10px] mt-1 font-mono truncate" style={{ color: 'var(--txt-faint)' }}>
                                                                {adminUserSubTab === "pets"
                                                                    ? `${PET_NAMES[petIndexOf(u.id, u.petId)]} · ${PET_STAGES[petStageOf(u.totalStudyMins || 0)].name}${Number.isInteger(u.petId) ? ' · 관리자 지정' : ''}`
                                                                    : u.email}
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <div className="flex gap-2 items-center shrink-0">
                                                        {adminUserSubTab === "pets" && <>
                                                            <select value={Number.isInteger(u.petId) ? String(u.petId) : ''}
                                                                    onChange={(e) => handleSetPetId(u.id, e.target.value)}
                                                                    className="fld fld-sm text-[10px] w-auto" title="캐릭터 바꾸기">
                                                                <option value="">기본 (자동 배정)</option>
                                                                {PET_NAMES.map((n, i) => <option key={n} value={String(i)}>{n}</option>)}
                                                            </select>
                                                            {u.petName && (
                                                                <button onClick={() => handleClearPetName(u.id, u.name)}
                                                                        className="btn btn-ghost px-3 py-1.5 rounded-lg text-[10px] font-bold" style={{ color: 'var(--rose)' }}>
                                                                    이름 지우기
                                                                </button>
                                                            )}
                                                        </>}
                                                        {adminUserSubTab === "active" && currentUserRank === 4 && u.id !== user.uid && (
                                                            <select value={u.position || '일반 학생'} onChange={(e) => handleUpdateUserPosition(u.id, e.target.value)} className="fld fld-sm text-[10px] w-auto">
                                                                <option value="일반 학생">일반 학생</option><option value="학습부">학습부</option><option value="회장">회장</option><option value="부회장">부회장</option><option value="총무부">총무부</option><option value="행정부">행정부</option><option value="방송부">방송부</option><option value="홍보부">홍보부</option><option value="체육부">체육부</option>
                                                            </select>
                                                        )}
                                                        {adminUserSubTab === "pets"
                                                            ? null
                                                            : u.id === user.uid
                                                            ? <span className="tag tag-neutral">본인</span>
                                                            : adminUserSubTab === "pending"
                                                                ? <>
                                                                    <button onClick={() => approveUser(u.id, u.email)} className="btn btn-primary px-3.5 py-1.5 rounded-lg text-[10px] font-bold">승인</button>
                                                                    <button onClick={() => rejectUser(u.id, u.email)} className="btn btn-ghost px-3 py-1.5 rounded-lg text-[10px] font-bold" style={{ color: 'var(--rose)' }}>거절</button>
                                                                  </>
                                                                : adminUserSubTab === "active"
                                                                    ? <button onClick={() => suspendUser(u.id, u.email, u.rank)} className="btn btn-ghost px-3 py-1.5 rounded-lg text-[10px] font-bold" style={{ color: 'var(--rose)' }}>정지</button>
                                                                    : <button onClick={() => restoreUser(u.id, u.email)} className="btn btn-ghost px-3 py-1.5 rounded-lg text-[10px] font-bold" style={{ color: 'var(--cyan-ink)' }}>복구</button>}
                                                    </div>
                                                </div>
                                            ))}
                                            {filteredDisplayUsers.length === 0 && <EmptyState icon="fa-user-slash" title="검색 결과가 없습니다" />}
                                        </div>
                                    </div>
                                )}

                                {adminTab === "vocab" && currentUserRank >= 3 && (
                                    <div className="p-6 space-y-5 max-h-[70vh] overflow-y-auto reveal">

                                        {/* 학생이 적은 뜻은 곧바로 퍼지지 않는다.
                                            같은 뜻을 적은 사람이 둘이 되어야 여기 올라온다.
                                            올라온 뒤에는 누가 적었는지 알 수 없다 — 표를 지우기 때문이다. */}
                                        <div className="glass rounded-2xl p-4 flex items-center justify-between gap-3">
                                            <div className="min-w-0">
                                                <div className="eyebrow text-[9px] mb-1">공유 사전</div>
                                                <p className="text-[11px]" style={{ color: 'var(--txt-faint)' }}>
                                                    학생들이 채운 낱말 {sharedVocabList.length}개.
                                                    두 명이 같은 뜻을 적으면 올라옵니다.
                                                </p>
                                            </div>
                                            <button type="button" onClick={handleSharedVocabSync} disabled={vocabSyncBusy}
                                                    className="btn btn-ghost px-3.5 py-2 rounded-xl text-[10px] font-bold shrink-0">
                                                <i className="fa-solid fa-rotate mr-1.5"></i>{vocabSyncBusy ? '확인 중...' : '지금 반영'}
                                            </button>
                                        </div>

                                        <div className="w-full relative">
                                            <span className="absolute inset-y-0 left-0 flex items-center pl-4" style={{ color: 'var(--txt-faint)' }}>
                                                <i className="fa-solid fa-magnifying-glass text-xs"></i>
                                            </span>
                                            <input type="text" placeholder="낱말이나 뜻으로 검색" value={vocabAdminQuery}
                                                   onChange={(e) => setVocabAdminQuery(e.target.value)} className="fld fld-sm pl-11" />
                                        </div>

                                        <div className="space-y-2">
                                            {sharedVocabFiltered.map(([w, meaning]) => (
                                                <div key={w} className="glass rounded-xl p-3 flex items-center gap-2.5">
                                                    <span className="font-mono text-xs font-extrabold shrink-0" style={{ minWidth: '7rem' }}>{w}</span>
                                                    <input type="text" defaultValue={meaning} maxLength={200}
                                                           onBlur={(e) => handleSharedVocabEdit(w, e.target.value)}
                                                           className="fld fld-sm flex-1" />
                                                    <button type="button" onClick={() => handleSharedVocabDelete(w)}
                                                            className="btn btn-ghost px-3 py-1.5 rounded-lg text-[10px] font-bold shrink-0"
                                                            style={{ color: 'var(--rose)' }}>지우기</button>
                                                </div>
                                            ))}
                                            {sharedVocabFiltered.length === 0 && (
                                                <EmptyState icon="fa-book-open"
                                                    title={sharedVocabList.length === 0 ? "아직 올라온 낱말이 없습니다" : "검색 결과가 없습니다"}
                                                    desc={sharedVocabList.length === 0 ? "학생 두 명이 같은 뜻을 적으면 여기에 쌓입니다." : null} />
                                            )}
                                        </div>
                                    </div>
                                )}

                                {adminTab === "pinball" && currentUserRank >= 3 && (
                                    <form onSubmit={handlePinballSave} className="p-6 space-y-5 max-h-[70vh] overflow-y-auto reveal">
                                        <div className="grid grid-cols-3 gap-2.5">
                                            {[['응모 학생', `${pinballEntrants.length}명`], ['응모권', `${pinballTotalTickets}장`],
                                              ['기준', `${(editPinball || {}).baseHours ?? 30}h+`]].map(([k, v]) => (
                                                <div key={k} className="glass rounded-2xl p-3.5 text-center">
                                                    <div className="eyebrow text-[8px] mb-1.5">{k}</div>
                                                    <div className="font-mono text-sm font-extrabold">{v}</div>
                                                </div>
                                            ))}
                                        </div>

                                        {/* 학생은 이 명단만 읽는다. 승인할 때마다 자동으로 올라가지만,
                                            어찌해 어긋나면 여기서 다시 계산할 수 있다. */}
                                        <div className="glass rounded-2xl p-4 flex items-center justify-between gap-3"
                                             style={rosterStale ? { borderColor: 'color-mix(in srgb, var(--pink) 34%, transparent)' } : undefined}>
                                            <div className="min-w-0">
                                                <div className="eyebrow text-[9px] mb-1">응모 명단</div>
                                                <p className="text-[11px] truncate" style={{ color: rosterStale ? 'var(--rose)' : 'var(--txt-faint)' }}>
                                                    {rosterStale
                                                        ? '설정이 바뀌었습니다. 다시 계산해 주세요.'
                                                        : pinballRoster && pinballRoster.updatedAt
                                                            ? `${new Date(pinballRoster.updatedAt).toLocaleString('ko-KR')} 기준`
                                                            : '아직 올라간 명단이 없습니다'}
                                                </p>
                                            </div>
                                            <button type="button" onClick={handleRosterRefresh} disabled={rosterBusy}
                                                    className="btn btn-ghost px-3.5 py-2 rounded-xl text-[10px] font-bold shrink-0">
                                                <i className="fa-solid fa-rotate mr-1.5"></i>{rosterBusy ? '계산 중...' : '명단 새로고침'}
                                            </button>
                                        </div>

                                        <div className="grid sm:grid-cols-2 gap-3">
                                            <div>
                                                <label className="eyebrow text-[9px] block mb-2">시작일</label>
                                                <input type="date" value={(editPinball || {}).startDate || ''}
                                                       onChange={(e) => setEditPinball({ ...(editPinball || {}), startDate: e.target.value })}
                                                       className="fld text-xs" />
                                            </div>
                                            <div>
                                                <label className="eyebrow text-[9px] block mb-2">종료일</label>
                                                <input type="date" value={(editPinball || {}).endDate || ''}
                                                       onChange={(e) => setEditPinball({ ...(editPinball || {}), endDate: e.target.value })}
                                                       className="fld text-xs" />
                                            </div>
                                        </div>

                                        <div>
                                            <label className="eyebrow text-[9px] block mb-2">상품</label>
                                            <input type="text" placeholder="예: 문화상품권 3만원" value={(editPinball || {}).prize || ''}
                                                   onChange={(e) => setEditPinball({ ...(editPinball || {}), prize: e.target.value })}
                                                   className="fld text-xs" />
                                        </div>

                                        <div className="grid sm:grid-cols-2 gap-3">
                                            <div>
                                                <label className="eyebrow text-[9px] block mb-2">첫 응모권 (시간)</label>
                                                <input type="number" min="1" max="200" value={(editPinball || {}).baseHours ?? 30}
                                                       onChange={(e) => setEditPinball({ ...(editPinball || {}), baseHours: parseInt(e.target.value, 10) || 30 })}
                                                       className="fld text-xs" />
                                            </div>
                                            <div>
                                                <label className="eyebrow text-[9px] block mb-2">추가 단위 (시간)</label>
                                                <input type="number" min="1" max="100" value={(editPinball || {}).stepHours ?? 10}
                                                       onChange={(e) => setEditPinball({ ...(editPinball || {}), stepHours: parseInt(e.target.value, 10) || 10 })}
                                                       className="fld text-xs" />
                                            </div>
                                        </div>
                                        <p className="text-[10px] leading-relaxed" style={{ color: 'var(--txt-faint)' }}>
                                            {(editPinball || {}).baseHours ?? 30}시간을 채우면 1장, 그 뒤 {(editPinball || {}).stepHours ?? 10}시간마다 1장씩 늘어납니다.
                                            학습부가 승인한 시간만 셉니다.
                                        </p>

                                        <button type="submit" disabled={pinballBusy} className="btn btn-primary w-full font-bold py-3.5 rounded-2xl text-sm">
                                            {pinballBusy ? '저장 중...' : '설정 저장'}
                                        </button>

                                        <div className="divider"></div>

                                        {/* 추첨은 외부 룰렛 사이트에서 돌린다.
                                            그 사이트가 «이름*개수, 이름*개수» 형식을 받으므로 그대로 만들어 둔다. */}
                                        <div>
                                            <div className="flex items-center justify-between gap-2 mb-2">
                                                <label className="eyebrow text-[9px]">추첨 명단 · {pinballEntrants.length}명 {pinballTotalTickets}장</label>
                                                <button type="button" onClick={handleCopyEntryList}
                                                        disabled={pinballTotalTickets === 0}
                                                        className="btn btn-ghost px-3 py-1.5 rounded-lg text-[10px] font-bold">
                                                    <i className="fa-regular fa-copy mr-1.5"></i>복사
                                                </button>
                                            </div>
                                            <textarea readOnly value={pinballEntryList}
                                                      onFocus={(e) => e.target.select()}
                                                      placeholder="30시간을 채운 학생이 아직 없습니다"
                                                      className="fld text-[11px] font-mono leading-relaxed"
                                                      style={{ minHeight: 150, resize: 'vertical' }} />
                                            <p className="text-[10px] leading-relaxed mt-2" style={{ color: 'var(--txt-faint)' }}>
                                                이대로 복사해서 룰렛 사이트 이름 칸에 붙여넣으면 됩니다.
                                                응모권 수만큼 이름이 들어갑니다.
                                            </p>
                                        </div>
                                    </form>
                                )}

                                {/* ── 공부시간 초기화 (최고 관리자 전용) ── */}
                                {adminTab === "resetHours" && currentUserRank === 4 && (
                                    <div className="p-6 space-y-5 max-h-[70vh] overflow-y-auto reveal">
                                        <div className="glass rounded-2xl p-4" style={{ borderColor: 'color-mix(in srgb, var(--pink) 34%, transparent)' }}>
                                            <div className="flex items-center gap-2.5 mb-2">
                                                <i className="fa-solid fa-triangle-exclamation text-sm" style={{ color: 'var(--rose)' }}></i>
                                                <b className="text-xs">되돌릴 수 없습니다</b>
                                            </div>
                                            <p className="text-[11px] leading-relaxed" style={{ color: 'var(--txt-dim)' }}>
                                                지운 승인 기록은 복구할 수 없습니다. 핀볼 응모권과 «공부 시간 데이터»의 기간 내 시간도 함께 0이 됩니다.
                                                <b style={{ color: 'var(--txt)' }}> 핀볼 상품을 준 뒤에</b> 실행하세요.
                                            </p>
                                        </div>

                                        <div>
                                            <label className="eyebrow text-[9px] block mb-2">이 날짜까지의 기록을 지웁니다</label>
                                            <input type="date" value={resetHoursDate} onChange={(e) => setResetHoursDate(e.target.value)}
                                                   className="fld text-xs" disabled={resetBusy} />
                                        </div>

                                        <div className="glass rounded-2xl p-4 text-center">
                                            <div className="eyebrow text-[9px] mb-2">지워질 기록</div>
                                            <div className="font-mono text-3xl font-extrabold"
                                                 style={{ color: hoursResetTargets.length ? 'var(--rose)' : 'var(--txt-faint)' }}>
                                                {hoursResetTargets.length}
                                            </div>
                                            <p className="text-[11px] mt-2" style={{ color: 'var(--txt-faint)' }}>
                                                {resetHoursDate ? `전체 ${(studyRecords || []).length}건 중` : '날짜를 고르면 건수가 나옵니다'}
                                            </p>
                                        </div>

                                        <label className="glass rounded-2xl p-4 flex items-start gap-3 cursor-pointer">
                                            <input type="checkbox" checked={resetHoursTotals} disabled={resetBusy}
                                                   onChange={(e) => setResetHoursTotals(e.target.checked)}
                                                   className="mt-0.5 shrink-0" style={{ accentColor: 'var(--pink)', width: 16, height: 16 }} />
                                            <span>
                                                <b className="text-xs block mb-1">학생 누적 시간도 0으로</b>
                                                <span className="text-[11px] leading-relaxed" style={{ color: 'var(--txt-faint)' }}>
                                                    명예의 전당이 새로 시작합니다. 대신 <b style={{ color: 'var(--rose)' }}>모든 캐릭터가 «알» 단계로 돌아갑니다.</b>
                                                    <br />체크하지 않으면 캐릭터와 누적 시간은 그대로 두고 기록만 정리합니다.
                                                </span>
                                            </span>
                                        </label>

                                        {resetBusy && (
                                            <div>
                                                <div className="pet-track" style={{ height: 10 }}>
                                                    <div className="pet-fill" style={{ width: `${resetProgress}%`, background: 'var(--pink)' }}></div>
                                                </div>
                                                <p className="text-[11px] mt-2 text-center font-mono" style={{ color: 'var(--txt-faint)' }}>정리 중 {resetProgress}%</p>
                                            </div>
                                        )}

                                        <button type="button" onClick={handleResetHours}
                                                disabled={resetBusy || hoursResetTargets.length === 0}
                                                className="btn btn-pink w-full font-extrabold py-4 rounded-2xl text-sm">
                                            {resetBusy ? '정리 중...' : `기록 ${hoursResetTargets.length}건 지우기`}
                                        </button>
                                    </div>
                                )}

                                {/* ── 자료 초기화 (최고 관리자 전용) ── */}
                                {adminTab === "resetMats" && currentUserRank === 4 && (
                                    <div className="p-6 space-y-5 max-h-[70vh] overflow-y-auto reveal">
                                        <div className="glass rounded-2xl p-4" style={{ borderColor: 'color-mix(in srgb, var(--pink) 34%, transparent)' }}>
                                            <div className="flex items-center gap-2.5 mb-2">
                                                <i className="fa-solid fa-triangle-exclamation text-sm" style={{ color: 'var(--rose)' }}></i>
                                                <b className="text-xs">학생들이 올린 자료가 사라집니다</b>
                                            </div>
                                            <p className="text-[11px] leading-relaxed" style={{ color: 'var(--txt-dim)' }}>
                                                문서와 첨부파일을 함께 지웁니다. 파일까지 지워야 저장 요금이 멈춥니다.
                                                꼭 필요한 자료는 <b style={{ color: 'var(--txt)' }}>먼저 내려받아 두세요.</b>
                                            </p>
                                        </div>

                                        <div>
                                            <label className="eyebrow text-[9px] block mb-2">이 날짜까지 올라온 자료를 지웁니다</label>
                                            <input type="date" value={resetMatsDate} onChange={(e) => setResetMatsDate(e.target.value)}
                                                   className="fld text-xs" disabled={resetBusy} />
                                        </div>

                                        <div className="glass rounded-2xl p-4 text-center">
                                            <div className="eyebrow text-[9px] mb-2">지워질 자료</div>
                                            <div className="font-mono text-3xl font-extrabold"
                                                 style={{ color: matsResetTargets.length ? 'var(--rose)' : 'var(--txt-faint)' }}>
                                                {matsResetTargets.length}
                                            </div>
                                            <p className="text-[11px] mt-2" style={{ color: 'var(--txt-faint)' }}>
                                                {resetMatsDate
                                                    ? `전체 ${(materials || []).length}건 중 · 첨부파일 ${matsResetTargets.reduce((a, m) => a + ((m.attachments || [1]).length), 0)}개`
                                                    : '날짜를 고르면 건수가 나옵니다'}
                                            </p>
                                        </div>

                                        {matsResetTargets.length > 0 && (
                                            <div className="glass rounded-2xl p-3 max-h-40 overflow-y-auto space-y-1.5">
                                                <div className="eyebrow text-[9px] mb-1.5">지워질 목록</div>
                                                {matsResetTargets.slice(0, 40).map(m => (
                                                    <div key={m.id} className="flex justify-between gap-2 text-[11px]">
                                                        <span className="truncate" style={{ color: 'var(--txt-dim)' }}>{m.title}</span>
                                                        <span className="font-mono shrink-0" style={{ color: 'var(--txt-faint)' }}>{m.date}</span>
                                                    </div>
                                                ))}
                                                {matsResetTargets.length > 40 && (
                                                    <p className="text-[10px] pt-1" style={{ color: 'var(--txt-faint)' }}>… 외 {matsResetTargets.length - 40}건</p>
                                                )}
                                            </div>
                                        )}

                                        {resetBusy && (
                                            <div>
                                                <div className="pet-track" style={{ height: 10 }}>
                                                    <div className="pet-fill" style={{ width: `${resetProgress}%`, background: 'var(--pink)' }}></div>
                                                </div>
                                                <p className="text-[11px] mt-2 text-center font-mono" style={{ color: 'var(--txt-faint)' }}>정리 중 {resetProgress}%</p>
                                            </div>
                                        )}

                                        <button type="button" onClick={handleResetMaterials}
                                                disabled={resetBusy || matsResetTargets.length === 0}
                                                className="btn btn-pink w-full font-extrabold py-4 rounded-2xl text-sm">
                                            {resetBusy ? '정리 중...' : `자료 ${matsResetTargets.length}건 지우기`}
                                        </button>
                                    </div>
                                )}

                                {adminTab === "study" && (
                                    <div className="p-5 reveal">
                                        <div className="eyebrow text-[9px] mb-4">Pending Approvals</div>
                                        <div className="max-h-[60vh] overflow-y-auto space-y-3.5 pr-1">
                                            {(studyRecords || []).filter(r => r && r.status === 'pending').map(record => (
                                                <div key={record.id} className="glass rounded-2xl p-4">
                                                    <div className="flex justify-between items-center mb-3.5 pb-3 border-b" style={{ borderColor: 'var(--line)' }}>
                                                        <div className="flex items-center gap-2">
                                                            <span className="font-bold text-sm">{record.userName}</span>
                                                            <span className="tag tag-neutral">{record.grade}</span>
                                                        </div>
                                                        <div className="tag tag-brand font-mono">{record.durationMins}분 요청</div>
                                                    </div>
                                                    <div className="flex gap-4">
                                                        <div className="w-1/2 h-32 rounded-xl overflow-hidden grid place-items-center" style={{ background: 'var(--surface)', border: '1px solid var(--line)' }}>
                                                            {record.proofUrl
                                                                ? <a href={record.proofUrl} target="_blank" rel="noreferrer" className="w-full h-full"><img src={record.proofUrl} alt="공부 인증" className="object-cover w-full h-full hover:scale-105 transition-transform duration-700" /></a>
                                                                : <span className="text-[10px]" style={{ color: 'var(--txt-faint)' }}>사진 없음</span>}
                                                        </div>
                                                        <div className="w-1/2 flex flex-col gap-2 justify-center">
                                                            <button onClick={() => handleStudyProofAction(record.id, record.userUid, record.durationMins, 'approved')} className="btn btn-primary font-bold py-3 rounded-xl text-xs"><i className="fa-solid fa-check mr-1.5"></i>승인</button>
                                                            <button onClick={() => handleStudyProofAction(record.id, record.userUid, 0, 'rejected')} className="btn btn-ghost font-bold py-2.5 rounded-xl text-xs" style={{ color: 'var(--rose)' }}><i className="fa-solid fa-xmark mr-1.5"></i>반려</button>
                                                        </div>
                                                    </div>
                                                </div>
                                            ))}
                                            {(studyRecords || []).filter(r => r && r.status === 'pending').length === 0 && (
                                                <EmptyState icon="fa-face-smile" title="결재 대기 중인 사진이 없습니다" desc="모든 인증을 처리했어요." />
                                            )}
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* ── 요구사항 작성 모달 ────────────── */}
                    {isQnaWriteOpen && (
                        <div className="modal-bd fixed inset-0 bg-black/75 backdrop-blur-md flex items-center justify-center z-50 p-4">
                            <div className="modal-card glass-solid rounded-[28px] max-w-md w-full overflow-hidden">
                                <div className="p-5 border-b flex justify-between items-center" style={{ borderColor: 'var(--line)' }}>
                                    <div className="flex items-center gap-3">
                                        <div className="w-9 h-9 rounded-xl grid place-items-center" style={{ background: 'color-mix(in srgb, var(--lime) 13%, transparent)' }}>
                                            <i className="fa-solid fa-feather text-sm" style={{ color: 'var(--brand-lt)' }}></i>
                                        </div>
                                        <div>
                                            <div className="eyebrow text-[8px] mb-1">New Request</div>
                                            <h2 className="text-sm font-extrabold">요구사항 올리기</h2>
                                        </div>
                                    </div>
                                    <button onClick={()=>setIsQnaWriteOpen(false)} className="icon-btn"><i className="fa-solid fa-xmark"></i></button>
                                </div>
                                <form onSubmit={handleQnaSubmit} className="p-6 space-y-3.5 max-h-[70vh] overflow-y-auto">
                                    <input type="text" placeholder="어떤 게 필요한가요?" value={newQnaTitle} onChange={(e)=>setNewQnaTitle(e.target.value)} className="fld" required />

                                    <textarea placeholder="왜 필요한지, 어떻게 됐으면 좋겠는지 적어주세요." value={newQnaContent} onChange={(e)=>setNewQnaContent(e.target.value)} rows="5" className="fld" required></textarea>
                                    {/* 비공개로 올리면 나와 임원만 본다. 답변도 이걸 따라간다. */}

                                    <button type="button" onClick={() => setNewQnaPrivate(!newQnaPrivate)}

                                            className="w-full flex items-center gap-3 p-3.5 rounded-2xl text-left"

                                            style={{ background: newQnaPrivate ? 'color-mix(in srgb, var(--gold) 12%, transparent)' : 'var(--surface-2)',

                                                     border: `1px solid ${newQnaPrivate ? 'color-mix(in srgb, var(--gold) 45%, transparent)' : 'transparent'}` }}>

                                        <i className={`fa-solid ${newQnaPrivate ? 'fa-lock' : 'fa-globe'} text-sm`}

                                           style={{ color: newQnaPrivate ? 'var(--gold)' : 'var(--txt-faint)' }}></i>

                                        <div className="min-w-0 flex-1">

                                            <div className="text-xs font-extrabold">{newQnaPrivate ? '비공개' : '공개'}</div>

                                            <div className="text-[10px] mt-0.5" style={{ color: 'var(--txt-faint)' }}>

                                                {newQnaPrivate ? '나와 임원만 봅니다. 답변도 마찬가지예요.' : '모두가 볼 수 있습니다.'}

                                            </div>

                                        </div>

                                    </button>

                                    <button type="submit" className="btn btn-primary w-full font-bold py-3.5 rounded-2xl text-sm">등록</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* ── 자료 업로드 모달 ───────────────── */}
                    {isUploadOpen && (
                        <div className="modal-bd fixed inset-0 bg-black/75 backdrop-blur-md flex items-center justify-center z-50 p-4">
                            <div className="modal-card glass-solid rounded-[28px] max-w-md w-full overflow-hidden">
                                <div className="p-5 border-b flex justify-between items-center" style={{ borderColor: 'var(--line)' }}>
                                    <div className="flex items-center gap-3">
                                        <div className="w-9 h-9 rounded-xl grid place-items-center" style={{ background: 'color-mix(in srgb, var(--lime) 13%, transparent)' }}>
                                            <i className="fa-solid fa-cloud-arrow-up text-sm" style={{ color: 'var(--brand-lt)' }}></i>
                                        </div>
                                        <div>
                                            <div className="eyebrow text-[8px] mb-1">Contribute</div>
                                            <h2 className="text-sm font-extrabold">자료 제공하기</h2>
                                        </div>
                                    </div>
                                    <button onClick={()=>setIsUploadOpen(false)} className="icon-btn"><i className="fa-solid fa-xmark"></i></button>
                                </div>
                                <form onSubmit={handleUpload} className="p-6 space-y-3.5 max-h-[70vh] overflow-y-auto">
                                    <input type="text" placeholder="자료 제목" value={newTitle} onChange={(e)=>setNewTitle(e.target.value)} className="fld" disabled={uploadProgress>0} required />

                                    {/* 업로드용 계층형 드롭다운 */}
                                    <div className="flex gap-2.5">
                                        <select value={newGrade} onChange={(e) => {
                                            const g = e.target.value; setNewGrade(g);
                                            const firstSubj = Object.keys(CURRICULUM[g])[0] || ""; setNewSubject(firstSubj);
                                            setNewSubSubject(CURRICULUM[g][firstSubj]?.[0] || "");
                                        }} className="fld fld-sm flex-1">
                                            {Object.keys(CURRICULUM).map(g => <option key={g} value={g}>{g}</option>)}
                                        </select>
                                        <select value={newSubject} onChange={(e) => {
                                            const s = e.target.value; setNewSubject(s);
                                            setNewSubSubject(CURRICULUM[newGrade][s]?.[0] || "");
                                        }} className="fld fld-sm flex-1">
                                            {Object.keys(CURRICULUM[newGrade]).map(s => <option key={s} value={s}>{s}</option>)}
                                        </select>
                                    </div>
                                    {CURRICULUM[newGrade][newSubject]?.length > 0 && (
                                        <select value={newSubSubject} onChange={(e) => setNewSubSubject(e.target.value)} className="fld fld-sm reveal">
                                            {CURRICULUM[newGrade][newSubject].map(ss => <option key={ss} value={ss}>{ss}</option>)}
                                        </select>
                                    )}

                                    <div>
                                        <input type="file" multiple onChange={(e)=>setNewFiles(Array.from(e.target.files))} className="fld text-xs" required disabled={uploadProgress>0} />
                                        {newFiles.length > 0 && (
                                            <div className="mt-2.5 text-[10px] flex flex-col gap-1.5 max-h-24 overflow-y-auto glass rounded-xl p-3 reveal" style={{ color: 'var(--txt-dim)' }}>
                                                {newFiles.map((f, i) => (
                                                    <span key={i} className="truncate">
                                                        <i className={`fa-solid ${fileGlyph(f.name)} mr-1.5`} style={{ color: 'var(--brand-lt)' }}></i>{f.name}
                                                    </span>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                    <textarea placeholder="자료에 대한 설명" value={newDescription} onChange={(e)=>setNewDescription(e.target.value)} rows="3" className="fld" required></textarea>

                                    {uploadProgress > 0 && (
                                        <div className="w-full rounded-full h-1.5 overflow-hidden" style={{ background: 'var(--surface-2)' }}>
                                            <div className="h-full rounded-full transition-all duration-300" style={{ width: `${uploadProgress}%`, background: 'var(--lime)' }}></div>
                                        </div>
                                    )}

                                    <button type="submit" disabled={uploadProgress>0} className="btn btn-primary w-full font-bold py-3.5 rounded-2xl text-sm">
                                        {uploadProgress>0 ? `업로드 중... ${uploadProgress}%` : '등록'}
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* ── 토스트 / 알럿 / 확인 ───────────── */}
                    {toast && (
                        <div className="toast fixed bottom-6 right-6 z-[99] glass-solid rounded-2xl py-3.5 px-5 text-xs font-bold flex items-center gap-3 max-w-[calc(100vw-3rem)]">
                            <span className="w-1.5 h-8 rounded-full shrink-0" style={{ background: 'var(--lime)' }}></span>
                            {toast.message}
                        </div>
                    )}
                    {customAlert && (
                        <div className="modal-bd fixed inset-0 bg-black/75 backdrop-blur-md flex items-center justify-center z-[100] p-4">
                            <div className="modal-card glass-solid p-7 rounded-3xl max-w-sm w-full text-center">
                                <div className="w-11 h-11 mx-auto mb-4 rounded-2xl grid place-items-center" style={{ background: 'color-mix(in srgb, var(--lime) 13%, transparent)' }}>
                                    <i className="fa-solid fa-circle-info" style={{ color: 'var(--brand-lt)' }}></i>
                                </div>
                                <h3 className="font-extrabold mb-2 text-sm">{customAlert.title}</h3>
                                <p className="text-xs mb-6 whitespace-pre-wrap leading-relaxed" style={{ color: 'var(--txt-dim)' }}>{customAlert.message}</p>
                                <button onClick={()=>setCustomAlert(null)} className="btn btn-dark w-full text-xs font-bold py-3 rounded-xl">확인</button>
                            </div>
                        </div>
                    )}
                    {customConfirm && (
                        <div className="modal-bd fixed inset-0 bg-black/75 backdrop-blur-md flex items-center justify-center z-[100] p-4">
                            <div className="modal-card glass-solid p-7 rounded-3xl max-w-sm w-full text-center">
                                <div className="w-11 h-11 mx-auto mb-4 rounded-2xl grid place-items-center" style={{ background: 'color-mix(in srgb, var(--pink) 13%, transparent)' }}>
                                    <i className="fa-solid fa-triangle-exclamation" style={{ color: 'var(--rose)' }}></i>
                                </div>
                                <h3 className="font-extrabold mb-2 text-sm">{customConfirm.title}</h3>
                                <p className="text-xs mb-6 leading-relaxed whitespace-pre-line" style={{ color: 'var(--txt-dim)' }}>{customConfirm.message}</p>
                                <div className="flex gap-2.5">
                                    <button onClick={()=>setCustomConfirm(null)} className="btn btn-ghost flex-1 text-xs font-bold py-3 rounded-xl">취소</button>
                                    <button onClick={()=>{customConfirm.onConfirm(); setCustomConfirm(null);}} className="btn flex-1 text-xs font-bold py-3 rounded-xl text-white" style={{ background: 'var(--pink)' }}>실행</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
