                            await setDoc(doc(window.db, 'artifacts', window.appId, 'public', 'data', 'users', cred.user.uid), {
                                uid: cred.user.uid,
                                name: legacy.name || loginEmail.split('@')[0],

            // 사용자가 다른 탭에서 인증을 마친 뒤 눌러 상태를 갱신한다.

            // 승인 여부를 다시 확인한다.

            /* 단계가 오르면 축하한다.

            useEffect(() => {

                if (seen === null) {                       // 처음이면 기록만 해둔다
                    try { localStorage.setItem(key, String(now)); } catch (e) {}
                    return;
                }
                if (now > seen) {
                    setLevelUp(now);
                    try { localStorage.setItem(key, String(now)); } catch (e) {}
                }
            }, [user?.uid, user?.totalStudyMins, user?.status]);

            // 폭죽. 움직임을 줄이도록 설정한 사용자에게는 띄우지 않는다.
            useEffect(() => {
                if (levelUp === null) return;
                if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { setConfetti([]); return; }
                const colors = ['#C7F03E', '#FF4D8D', '#38E8FF', '#FFD166', '#A78BFA', '#FFFFFF'];
                const bits = Array.from({ length: 70 }, (_, i) => ({
                    id: i,
                    left: Math.random() * 100,
                    dx: `${(Math.random() * 2 - 1) * 22}vw`,
                    rot: `${Math.random() * 1080 - 540}deg`,
                    w: 6 + Math.random() * 7,
                    h: 9 + Math.random() * 12,
                    color: colors[i % colors.length],
                    delay: Math.random() * .55
                }));
                setConfetti(bits);
                const t = setTimeout(() => setConfetti([]), 3400);
                return () => clearTimeout(t);
            }, [levelUp]);

            const handlePetNameSave = async (e) => {

            // 이름·학년만 수정한다. 등급·상태·누적시간은 보안 규칙이

            const handleProfileSave = async (e) => {

                        async () => {

            const handleStudyProofAction = async (recordId, targetUid, mins, action) => {
                if (isLocalMode) return;
                if ((user?.rank || 1) < 3) return triggerAlert("학습부 이상만 승인/반려할 수 있습니다.");
                if (action === "approved" && !targetUid) {
                    return triggerAlert("이 기록은 예전 형식이라 대상 계정을 특정할 수 없습니다.\n반려 후 재제출을 안내해 주세요.");

                const { doc, updateDoc, getDoc, ref, deleteObject } = window.firebaseMethods;

                try {
                    /* 확인이 끝난 사진은 지운다.

                    const rec = (studyRecords || []).find(r => r && r.id === recordId);

                } catch(e) { console.error(e); }

            const handleUpload = async (e) => {
                e.preventDefault();
                if (!user) return;
                if (!requireVerified()) return;
                if (!newTitle || newFiles.length === 0 || !newDescription) return triggerAlert("자료 정보를 모두 채워주세요.");
                if (isLocalMode) return triggerAlert("클라우드 동기화가 꺼져 있습니다.");

                const newId = String(Date.now());
                setUploadProgress(5);

                try {
                    const { ref, uploadBytesResumable, getDownloadURL, doc, setDoc } = window.firebaseMethods;

                    let uploadedAttachments = [];
                    let totalBytes = newFiles.reduce((acc, f) => acc + f.size, 0);
                    let transferredBytes = 0;

                    // 여러 개의 파일을 순차적으로 업로드 처리
                    for (let i = 0; i < newFiles.length; i++) {
                        const file = newFiles[i];
                        const fileRef = ref(window.storage, `materials/${newId}_${file.name}`);

                        await new Promise((resolve, reject) => {
                            const uploadTask = uploadBytesResumable(fileRef, file);
                            uploadTask.on('state_changed',
                                (snapshot) => {
                                    const currentProgress = Math.round(((transferredBytes + snapshot.bytesTransferred) / totalBytes) * 100);
                                    setUploadProgress(Math.max(5, currentProgress));
                                },
                                (error) => reject(error),
                                async () => {
                                    const url = await getDownloadURL(uploadTask.snapshot.ref);
                                    uploadedAttachments.push({
                                        fileName: file.name,
                                        fileUrl: url,
                                        fileType: file.name.split('.').pop().toLowerCase()
                                    });
                                    transferredBytes += file.size;
                                    resolve();
                                }
                            );
                        });
                    }

                    setUploadProgress(100);

                    // 다중 파일 정보를 포함하여 DB에 문서 저장
                    const formatDoc = {
                        id: newId, title: newTitle, grade: newGrade, subject: newSubject, subSubject: newSubSubject, type: "요약 노트",
                        uploader: user.name, uploaderEmail: user.email,
                        fileType: uploadedAttachments[0].fileType,
                        fileName: uploadedAttachments[0].fileName,
                        fileUrl: uploadedAttachments[0].fileUrl,
                        attachments: uploadedAttachments, // 여러 파일 배열 저장
                        downloads: 0, likes: 0, likedBy: [], isVerified: (user.rank || 1) >= 2,
                        description: newDescription, date: new Date().toISOString().split('T')[0]
                    };
                    await setDoc(doc(window.db, 'artifacts', window.appId, 'public', 'data', 'materials', newId), formatDoc);
                    showToast("자료가 성공적으로 업로드되었습니다.");
                    setIsUploadOpen(false); setNewTitle(""); setNewFiles([]); setNewDescription(""); setUploadProgress(0);
                } catch (err) { triggerAlert("서버 통신 오류"); setUploadProgress(0); }
            };

            const handleDownload = async (mat, attachment = null) => {
                if (!user) return;
                if (!isLocalMode && window.firebaseMethods) {
                    const { doc, updateDoc } = window.firebaseMethods;
                    updateDoc(doc(window.db, 'artifacts', window.appId, 'public', 'data', 'materials', mat.id), { downloads: (mat.downloads || 0) + 1 }).catch(()=>{});
                }
                const urlToDownload = attachment ? attachment.fileUrl : mat.fileUrl;
                if (urlToDownload) { window.open(urlToDownload, '_blank'); showToast("원본 파일을 다운로드합니다."); }
                else triggerAlert("파일을 찾을 수 없습니다.");
            };

            /* 좋아요. 누른 사람을 목록으로 들고 있어야
               같은 사람이 여러 번 눌러도 한 번만 세고, 다시 누르면 취소된다. */
            const likedByMe = (mat) => !!(user && (mat.likedBy || []).includes(user.uid));

            const handleToggleLike = async (mat) => {
                if (!user) return;
                if (!requireVerified()) return;
                if (isLocalMode) return triggerAlert('클라우드 동기화가 꺼져 있습니다.');

                const before = mat.likedBy || [];
                const next = before.includes(user.uid)
                    ? before.filter(u => u !== user.uid)
                    : [...before, user.uid];

                // 화면을 먼저 바꿔 준다. 서버 응답을 기다리면 눌러도 반응이 없는 것처럼 느껴진다.
                setMaterials(prev => prev.map(m =>
                    m.id === mat.id ? { ...m, likedBy: next, likes: next.length } : m));
                setSelectedMaterial(prev =>
                    prev && prev.id === mat.id ? { ...prev, likedBy: next, likes: next.length } : prev);

                try {
                    const { doc, updateDoc } = window.firebaseMethods;
                    await updateDoc(doc(window.db, 'artifacts', window.appId, 'public', 'data', 'materials', mat.id),
                                    { likedBy: next, likes: next.length });
                } catch (err) {
                    // 실패하면 되돌린다. 안 그러면 눌린 것처럼 보이는데 서버엔 없다.
                    setMaterials(prev => prev.map(m =>
                        m.id === mat.id ? { ...m, likedBy: before, likes: before.length } : m));
                    setSelectedMaterial(prev =>
                        prev && prev.id === mat.id ? { ...prev, likedBy: before, likes: before.length } : prev);
                    triggerAlert('좋아요를 저장하지 못했습니다. 잠시 뒤 다시 눌러 주세요.');
                }
            };

            /* 대댓글을 읽는다.
               임원은 전부, 글쓴이는 공개된 것만 — 규칙이 그렇게 막고 있다.
               볼 자격이 없으면 질의가 거부되므로 조용히 빈 목록으로 둔다. */
            const replyPath = (qid) => ['artifacts', window.appId, 'public', 'data', 'qna', qid, 'replies'];

            /* 대댓글은 글을 따라간다. 글을 볼 수 있으면 대댓글도 보인다.
               서버가 같은 조건으로 막고 있어, 못 볼 사람은 질의 자체가 거부된다. */
            const loadReplies = async (qna) => {
                setReplies([]);
                if (!qna || isLocalMode || !window.firebaseMethods) return;
                const { collection, getDocs } = window.firebaseMethods;
                if (!getDocs) return;

                try {
                    const colRef = collection(window.db, ...replyPath(qna.id));
                    const snap = await getDocs(colRef);
                    const rows = [];
                    snap.forEach(d => { const v = d.data(); if (v) rows.push({ ...v, id: d.id }); });
                    rows.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
                    setReplies(rows);
                } catch (e) { setReplies([]); }
            };

            const openQna = (qna) => {
                setSelectedQna(qna);
                setReplyText("");
                loadReplies(qna);
            };

            /* 대댓글을 단다.
               임원은 공개·비공개 둘 다, 글쓴이는 공개만 — 규칙도 같게 막아 두었다. */
            const submitReply = async () => {
                if (!selectedQna || !user) return;
                if (!requireVerified()) return;
                const text = replyText.trim();
                if (!text) return triggerAlert("내용을 적어주세요.");
                if (text.length > 1000) return triggerAlert("1000자를 넘길 수 없습니다.");

                setReplyBusy(true);
                try {
                    const { doc, setDoc } = window.firebaseMethods;
                    const id = String(Date.now());
                    await setDoc(doc(window.db, ...replyPath(selectedQna.id), id), {
                        text, author: user.name || '', authorEmail: user.email,
                        createdAt: Date.now()
                    });
                    setReplyText("");
                    await loadReplies(selectedQna);
                    showToast("답변을 남겼습니다.");
                } catch (err) {
                    triggerAlert("답변을 남기지 못했습니다. 권한과 네트워크를 확인해 주세요.");
                } finally { setReplyBusy(false); }
            };

            const deleteReply = async (rid) => {
                if (!selectedQna) return;
                try {
                    const { doc, deleteDoc } = window.firebaseMethods;
                    await deleteDoc(doc(window.db, ...replyPath(selectedQna.id), rid));
                    await loadReplies(selectedQna);
                } catch (e) { triggerAlert("지우지 못했습니다."); }
            };

            const handleQnaSubmit = async (e) => {
                e.preventDefault();
                if (!user) return;
                if (!requireVerified()) return;
                if(!newQnaTitle || !newQnaContent) return triggerAlert("제목/내용을 적어주세요.");
                const newQna = {
                    id: String(Date.now()), title: newQnaTitle, content: newQnaContent,
                    author: user.name, authorEmail: user.email,
                    // 비공개로 올리면 나와 임원만 본다. 대댓글도 이걸 따라간다.
                    private: !!newQnaPrivate,
                    date: new Date().toISOString().split('T')[0]
                };
                if (!isLocalMode && window.firebaseMethods) {
                    const { doc, setDoc } = window.firebaseMethods;
                    setDoc(doc(window.db, 'artifacts', window.appId, 'public', 'data', 'qna', newQna.id), newQna).catch(()=>{});
                }
                showToast(newQnaPrivate ? "비공개로 등록되었습니다." : "게시글이 등록되었습니다!");
                setIsQnaWriteOpen(false); setNewQnaTitle(""); setNewQnaContent(""); setNewQnaPrivate(false);
            };

            const deleteMaterial = async (mId) => {
                if ((user?.rank || 1) < 2) return;
                triggerConfirm("이 자료를 영구 파기하시겠습니까?", async () => {
                    const target = materials.find(m => m.id === mId); setSelectedMaterial(null);
                    if (!isLocalMode && window.firebaseMethods) {
                        const { doc, deleteDoc, ref, deleteObject } = window.firebaseMethods;
                        deleteDoc(doc(window.db, 'artifacts', window.appId, 'public', 'data', 'materials', mId)).catch(()=>{});
                        if (target) {
                            const atts = target.attachments || [{ fileName: target.fileName }];
                            atts.forEach(att => {
                                if (att.fileName) deleteObject(ref(window.storage, `materials/${mId}_${att.fileName}`)).catch(()=>{});
                            });
                        }
                    }
                    showToast("삭제되었습니다.");
                });
            };

            const deleteQna = async (qId) => {
                if ((user?.rank || 1) < 2) return;
                triggerConfirm("이 게시글을 삭제하시겠습니까?", async () => {
                    setSelectedQna(null);
                    if (!isLocalMode && window.firebaseMethods) window.firebaseMethods.deleteDoc(window.firebaseMethods.doc(window.db, 'artifacts', window.appId, 'public', 'data', 'qna', qId)).catch(()=>{});
                    showToast("삭제되었습니다.");
                });
            }

            // 아래 관리자 동작들은 화면상의 가드일 뿐이며,
            // 실제 허용 여부는 firestore.rules 가 서버에서 다시 판정한다.
            const adminUpdateUser = async (targetUid, patch, okMessage) => {
                if (!targetUid || isLocalMode || !window.firebaseMethods) return;
                const { doc, updateDoc } = window.firebaseMethods;
                try {
                    await updateDoc(doc(window.db, 'artifacts', window.appId, 'public', 'data', 'users', targetUid), patch);
                    showToast(okMessage);
                } catch (err) {
                    triggerAlert("서버에서 이 작업을 거부했습니다. 권한을 확인해 주세요.");
                }
            };

            /* 캐릭터 관리 — 문제가 생겼을 때 관리자가 손으로 바로잡는다.
               학생은 캐릭터 번호를 못 바꾸고(보안 규칙이 막는다), 이름만 지을 수 있다. */
            const handleSetPetId = async (targetUid, raw) => {
                if ((user?.rank || 1) < 2) return;
                const petId = raw === '' ? null : parseInt(raw, 10);
                await adminUpdateUser(targetUid, { petId },
                    petId === null ? '기본 캐릭터로 되돌렸습니다' : `${PET_NAMES[petId]}(으)로 바꿨습니다`);
            };

            const handleClearPetName = async (targetUid, targetName) => {
                if ((user?.rank || 1) < 2) return;
                triggerConfirm(`[${targetName}] 학생이 지은 캐릭터 이름을 지우시겠습니까?`, () =>
                    adminUpdateUser(targetUid, { petName: '' }, '캐릭터 이름을 지웠습니다'));
            };

            const approveUser = async (targetUid, targetEmail) => {
                if ((user?.rank || 1) < 2) return;
                await adminUpdateUser(targetUid, { status: "active" }, `${targetEmail} 승인 완료`);
            };

            const rejectUser = async (targetUid, targetEmail) => {
                if ((user?.rank || 1) < 2) return;
                triggerConfirm(`[${targetEmail}] 가입 요청을 거절하시겠습니까?`, () =>
                    adminUpdateUser(targetUid, { status: "suspended" }, "거절 처리했습니다"));
            };

            const suspendUser = async (targetUid, targetEmail, targetRank) => {
                const currentUserRank = user?.rank || 1;
                if (currentUserRank < 2) return;
                if (targetUid === user?.uid) return triggerAlert("본인 계정은 정지할 수 없습니다.");
                if (currentUserRank <= (targetRank || 1) && currentUserRank !== 4) return triggerAlert("본인보다 높거나 같은 계급의 관리자는 정지시킬 수 없습니다.");

                triggerConfirm(`[${targetEmail}] 계정을 정지하시겠습니까?`, () =>
                    adminUpdateUser(targetUid, { status: "suspended" }, "정지 완료"));
            };

            const restoreUser = async (targetUid, targetEmail) => {
                if ((user?.rank || 1) < 2) return;
                triggerConfirm(`[${targetEmail}] 계정을 복구하시겠습니까?`, () =>
                    adminUpdateUser(targetUid, { status: "active" }, "복구 완료"));
            };

            const handleUpdateUserPosition = async (targetUid, newPosition) => {
                if ((user?.rank || 1) !== 4) return triggerAlert("최고 관리자만 직책을 변경할 수 있습니다.");
                if (targetUid === user?.uid) return triggerAlert("본인의 직책은 변경할 수 없습니다.");
                await adminUpdateUser(targetUid, { position: newPosition, rank: getRankFromPosition(newPosition) }, "변경 완료");
            };

            const handlePinballSave = async (e) => {
                e.preventDefault();
                if ((user?.rank || 1) < 3 || !window.firebaseMethods) return;
                setPinballBusy(true);
                try {
                    const { doc, setDoc } = window.firebaseMethods;
                    await setDoc(doc(window.db, 'artifacts', window.appId, 'public', 'data', 'settings', 'config'),
                                 { dday: ddaySettings, notice: noticeText, pinball: editPinball }, { merge: true });
                    setPinballSettings(editPinball);
                    // 기간이나 기준 시간이 바뀌면 응모권 수도 달라지므로 명단을 다시 계산한다.
                    await publishRoster(editPinball);
                    showToast('핀볼 설정을 저장했습니다.');
                } catch (err) { triggerAlert('저장에 실패했습니다. 권한을 확인해 주세요.'); }
                setPinballBusy(false);
            };

            const handleAdminSettingsSave = async (e) => {
                e.preventDefault();

                // 날짜순으로 정리하고, 날짜나 제목이 빈 줄은 버린다
                const cleaned = (editSchedule || [])
                    .filter(it => it && it.date && String(it.title || '').trim())
                    .map(it => ({ id: it.id || String(Date.now()) + Math.random().toString(36).slice(2, 6),
                                  date: it.date, title: String(it.title).trim().slice(0, 60),
                                  kind: it.kind || '행사' }))
                    .sort((a, b) => a.date.localeCompare(b.date));

                setDdaySettings(editDday);
                setNoticeText(editNotice);
                setSchedule(cleaned);
                setEditSchedule(cleaned);

                if (!isLocalMode && window.firebaseMethods) {
                    const { doc, setDoc } = window.firebaseMethods;
                    try {
                        // merge 를 빠뜨리면 핀볼 설정처럼 여기서 안 건드리는 값이 통째로 날아간다.
                        await setDoc(doc(window.db, 'artifacts', window.appId, 'public', 'data', 'settings', 'config'),
                                     { dday: editDday, notice: editNotice, schedule: cleaned }, { merge: true });
                    } catch (err) {
                        triggerAlert('저장에 실패했습니다. 권한과 네트워크를 확인해 주세요.');
                        return;
                    }
                }
                showToast("업데이트되었습니다!");
                setIsAdminConsoleOpen(false);
            };

            /* ── 학사일정 다루기 ────────────────────────────── */
            const SCHEDULE_KINDS = ['시험', '행사', '방학', '휴일', '기타'];

            const scheduleAddRow = () => setEditSchedule(prev => ([
                ...(prev || []),
                { id: String(Date.now()) + Math.random().toString(36).slice(2, 6),
                  date: '', title: '', kind: '행사' }
            ]));

            const scheduleSetRow = (id, patch) =>
                setEditSchedule(prev => (prev || []).map(it => it.id === id ? { ...it, ...patch } : it));

            const scheduleDropRow = (id) =>
                setEditSchedule(prev => (prev || []).filter(it => it.id !== id));

            /* 오늘을 기준으로 남은 날을 센다. 지난 일정은 음수가 된다. */
            const daysUntil = (ymd) => {
                if (!ymd) return null;
                const t = new Date(ymd + 'T00:00:00').getTime();
                if (isNaN(t)) return null;
                const now = new Date();
                const today = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
                return Math.round((t - today) / 86400000);
            };

            const isPdfOrImage = (filename) => {
                if (!filename) return false;
                const ext = filename.split('.').pop().toLowerCase();
                return ['pdf', 'png', 'jpg', 'jpeg', 'gif'].includes(ext);
            };

            // 🔥 계층형 필터링 로직
            const filteredMaterials = (materials || []).filter(m =>
                m &&
                (activeGradeFilter === "전체" || m.grade === activeGradeFilter) &&
                (activeSubjectFilter === "전체" || m.subject === activeSubjectFilter) &&
                (activeSubSubjectFilter === "전체" || m.subSubject === activeSubSubjectFilter || (!m.subSubject && false)) &&
                ((m.title || "").toLowerCase().includes(searchQuery.toLowerCase()) ||
                 (m.subject || "").toLowerCase().includes(searchQuery.toLowerCase()) ||
                 (m.subSubject || "").toLowerCase().includes(searchQuery.toLowerCase()) ||
                 (m.uploader || "").toLowerCase().includes(searchQuery.toLowerCase()))
            );

            const filteredQna = (qnaList || []).filter(q =>
                q &&
                (activeGradeFilter === "전체" || q.grade === activeGradeFilter || !q.grade) &&
                (activeSubjectFilter === "전체" || q.subject === activeSubjectFilter) &&
                (activeSubSubjectFilter === "전체" || q.subSubject === activeSubSubjectFilter) &&
                ((q.title || "").toLowerCase().includes(searchQuery.toLowerCase()) ||
                 (q.author || "").toLowerCase().includes(searchQuery.toLowerCase()) ||
                 (q.content || "").toLowerCase().includes(searchQuery.toLowerCase()))
            );

            /* «공부 시간 데이터» 창용. 관리자가 고른 기간만 잘라 합산한다.
               승인 기록이 있어야 하므로 임원(rank 2) 이상에서만 값이 나온다. */
            const approvedMinsIn = (uid, startMs, endMs) =>
                (studyRecords || [])
                    .filter(r => r && r.status === 'approved' && r.userUid === uid
                              && (!startMs || (r.timestamp || 0) >= startMs)
                              && (!endMs   || (r.timestamp || 0) <= endMs))
                    .reduce((sum, r) => sum + (r.durationMins || 0), 0);

            /* 명단을 계산한다. 승인 기록이 있어야 하므로 학습부(rank 3) 이상에서만 쓸 수 있다.
               settings 는 저장 직후처럼 아직 상태에 반영되지 않은 값을 넘길 때 쓰고,
               records 는 승인·삭제 직후 서버 응답을 기다리지 않고 계산할 때 쓴다. */
            const computeEntrants = (settings, records) => {
                const cfg = settings || pinballSettings;
                const recs = records || studyRecords || [];
                const from = cfg.startDate ? new Date(cfg.startDate + 'T00:00:00').getTime() : null;
                const to   = cfg.endDate   ? new Date(cfg.endDate   + 'T23:59:59').getTime() : null;
                const minsOf = (uid) => recs
                    .filter(r => r && r.status === 'approved' && r.userUid === uid
                              && (!from || (r.timestamp || 0) >= from)
                              && (!to   || (r.timestamp || 0) <= to))
                    .reduce((sum, r) => sum + (r.durationMins || 0), 0);
                return (usersList || [])
                    .filter(u => u && u.status === 'active')
                    .map(u => {
                        const mins = minsOf(u.id);
                        return { uid: u.id, name: u.name || '', grade: u.grade || '', petId: u.petId || null, mins,
                                 tickets: pinballTickets(mins, cfg.baseHours, cfg.stepHours) };
                    })
                    .filter(e => e.tickets > 0)
                    .sort((a, b) => b.tickets - a.tickets || b.mins - a.mins);
            };

            /* 계산한 명단을 서버에 올린다. 학생은 이 문서 하나만 읽으면 되므로
               승인 기록 수천 건을 매번 내려받지 않아도 되고, 남의 인증 시각도 노출되지 않는다. */
            const publishRoster = async (settings, records) => {
                if ((user?.rank || 1) < 3 || !window.firebaseMethods || isLocalMode) return;
                const cfg = settings || pinballSettings;
                try {
                    const { doc, setDoc } = window.firebaseMethods;
                    await setDoc(doc(window.db, 'artifacts', window.appId, 'public', 'data', 'settings', 'pinballRoster'), {
                        entrants: computeEntrants(cfg, records),
                        startDate: cfg.startDate || '', endDate: cfg.endDate || '',
                        baseHours: cfg.baseHours ?? 30, stepHours: cfg.stepHours ?? 10,
                        updatedAt: Date.now(), updatedBy: user?.name || ''
                    });
                    return true;
                } catch (err) { return false; }
            };

            /* 학생들이 던진 표를 훑어, 두 명 이상이 같은 뜻을 적은 낱말을 공유 사전에 올린다.

               표 문서 이름은 '{학생번호}_{낱말}' 이라 한 사람이 같은 낱말에 두 표를 못 던진다.
               그래서 같은 묶음에 표가 둘이면 그것만으로 서로 다른 두 사람이다 —
               누가 적었는지 들여다볼 필요가 없다.
               올린 표는 지운다. 공유 사전에는 뜻만 남고 누구인지는 남지 않는다. */
            const syncSharedVocab = async (quiet) => {
                if ((user?.rank || 1) < 3 || !window.firebaseMethods || isLocalMode) return null;
                const { collection, getDocs, doc, getDoc, setDoc, writeBatch } = window.firebaseMethods;
                if (!getDocs) return null;

                const votePath = ['artifacts', window.appId, 'public', 'data', 'vocab_votes'];
                try {
                    const snap = await getDocs(collection(window.db, ...votePath));

                    // 낱말 + 뜻꼴로 표를 모은다
                    const box = new Map();
                    snap.forEach((d) => {
                        const v = d.data() || {};
                        if (!v.word || !v.norm || !v.meaning) return;
                        const key = v.word + '|' + v.norm;
                        if (!box.has(key)) box.set(key, { word: v.word, text: v.meaning, ids: [] });
                        box.get(key).ids.push(d.id);
                    });

                    const sharedRef = doc(window.db, 'artifacts', window.appId, 'public', 'data', 'settings', 'vocabShared');
                    const cur = await getDoc(sharedRef);
                    const words = Object.assign({}, (cur.exists() && cur.data() && cur.data().words) || {});

                    const agreed = [];
                    box.forEach((e) => { if (e.ids.length >= 2) agreed.push(e); });

                    const added = [];
                    agreed.forEach((e) => { if (!words[e.word]) { words[e.word] = e.text; added.push(e.word); } });

                    // 이미 오른 낱말에 매달린 표는 더 볼 이유가 없다
                    const done = new Set(agreed.map(e => e.word));
                    const trash = [];
                    box.forEach((e) => { if (done.has(e.word)) e.ids.forEach(id => trash.push(id)); });

                    if (!added.length && !trash.length) {
                        if (!quiet) showToast('새로 합의된 낱말이 없습니다.');
                        return 0;
                    }

                    if (added.length) {
                        await setDoc(sharedRef, { words, count: Object.keys(words).length, updatedAt: Date.now() });
                    }

                    // 한 번에 500개까지만 지울 수 있어 끊어서 보낸다
                    for (let i = 0; i < trash.length; i += 400) {
                        const batch = writeBatch(window.db);
                        trash.slice(i, i + 400).forEach(id => batch.delete(doc(window.db, ...votePath, id)));
                        await batch.commit();
                    }

                    if (!quiet && added.length) showToast(`낱말 ${added.length}개를 공유 사전에 올렸습니다.`);
                    else if (!quiet) showToast('표를 정리했습니다.');
                    return added.length;
                } catch (err) {
                    if (!quiet) triggerAlert('공유 사전을 정리하지 못했습니다. 권한과 네트워크를 확인해 주세요.');
                    return null;
                }
            };

            const sharedVocabList = Object.keys(sharedVocabMap).sort();

            const sharedVocabFiltered = (() => {
                const q = vocabAdminQuery.trim().toLowerCase();
                const rows = sharedVocabList.map(w => [w, sharedVocabMap[w]]);
                if (!q) return rows.slice(0, 300);
                return rows.filter(([w, m]) => w.includes(q) || String(m || '').toLowerCase().includes(q)).slice(0, 300);
            })();

            /* 올라온 뜻을 고치거나 지운다.
               학생 화면은 이 문서 하나만 읽으므로, 여기서 고치면 모두에게 곧바로 반영된다. */
            const writeSharedVocab = async (words) => {
                const { doc, setDoc } = window.firebaseMethods;
                await setDoc(doc(window.db, 'artifacts', window.appId, 'public', 'data', 'settings', 'vocabShared'),
                             { words, count: Object.keys(words).length, updatedAt: Date.now() });
            };

            const handleSharedVocabEdit = async (word, text) => {
                if ((user?.rank || 1) < 3 || !window.firebaseMethods || isLocalMode) return;
                const t = String(text || '').trim().slice(0, 200);
                if (t === (sharedVocabMap[word] || '')) return;
                if (!t) return handleSharedVocabDelete(word);
                try {
                    await writeSharedVocab(Object.assign({}, sharedVocabMap, { [word]: t }));
                    showToast(`${word} 의 뜻을 고쳤습니다.`);
                } catch (err) { triggerAlert('뜻을 고치지 못했습니다.'); }
            };

            const handleSharedVocabDelete = async (word) => {
                if ((user?.rank || 1) < 3 || !window.firebaseMethods || isLocalMode) return;
                const next = Object.assign({}, sharedVocabMap);
                delete next[word];
                try {
                    await writeSharedVocab(next);
                    showToast(`${word} 을(를) 공유 사전에서 뺐습니다.`);
                } catch (err) { triggerAlert('낱말을 빼지 못했습니다.'); }
            };

            /* 닫고 간 자리를 실제로 치운다.
               학생은 남의 live_study 를 지울 수 없으므로(규칙) 임원이 지나갈 때 정리한다.
               목록에서 숨기는 것만으로는 문서가 계속 남아 읽기 비용이 든다. */
            useEffect(() => {
                if ((user?.rank || 1) < 2 || isLocalMode || !window.firebaseMethods) return;
                const t = setTimeout(async () => {
                    const { doc, deleteDoc, collection, getDocs } = window.firebaseMethods;
                    if (!getDocs) return;
                    try {
                        const path = ['artifacts', window.appId, 'public', 'data', 'live_study'];
                        const snap = await getDocs(collection(window.db, ...path));
                        const gone = [];
                        snap.forEach(d => { if (isStaleLive(d.data())) gone.push(d.id); });
                        for (const id of gone.slice(0, 50)) {
                            await deleteDoc(doc(window.db, ...path, id)).catch(() => {});
                        }
                    } catch (e) {}
                }, 6000);
                return () => clearTimeout(t);
            }, [user?.rank, user?.uid]);

            /* 학습부가 사이트를 열면 조용히 한 번 훑는다.
               따로 누르지 않아도 합의된 낱말이 하루 안에는 올라간다. */
            useEffect(() => {
                if ((user?.rank || 1) < 3) return;
                const t = setTimeout(() => { syncSharedVocab(true); }, 4000);
                return () => clearTimeout(t);
            }, [user?.rank, user?.uid]);

            const handleSharedVocabSync = async () => {
                if ((user?.rank || 1) < 3) return;
                setVocabSyncBusy(true);
                await syncSharedVocab(false);
                setVocabSyncBusy(false);
            };

            const handleRosterRefresh = async () => {
                if ((user?.rank || 1) < 3) return;
                setRosterBusy(true);
                const ok = await publishRoster();
                setRosterBusy(false);
                if (ok) showToast('응모 명단을 새로 계산했습니다.');
                else triggerAlert('명단을 올리지 못했습니다. 권한과 네트워크를 확인해 주세요.');
            };

            // 화면에 그리는 명단은 등급과 무관하게 항상 서버에 올라간 것을 쓴다.
            // 관리자와 학생이 서로 다른 숫자를 보는 일이 없어야 하기 때문이다.
            const pinballEntrants = (pinballRoster && Array.isArray(pinballRoster.entrants))
                ? pinballRoster.entrants : [];

            // 저장된 명단이 지금 설정과 다른 기간으로 계산된 것이면 관리자에게 알린다.
            const rosterStale = !!(pinballRoster && pinballSettings && (
                (pinballRoster.startDate || '') !== (pinballSettings.startDate || '') ||
                (pinballRoster.endDate   || '') !== (pinballSettings.endDate   || '') ||
                (pinballRoster.baseHours ?? 30) !== (pinballSettings.baseHours ?? 30) ||
                (pinballRoster.stepHours ?? 10) !== (pinballSettings.stepHours ?? 10)));

            const pinballTotalTickets = pinballEntrants.reduce((a, e) => a + e.tickets, 0);

            /* 추첨은 외부 룰렛 사이트에서 돌린다.
               그 사이트 입력 형식이 «이름*개수, 이름*개수» 라서 그대로 만들어 둔다. */
            const pinballEntryList = pinballEntrants
                .map(e => `${e.name}*${e.tickets}`)
                .join(', ');

            const handleCopyEntryList = async () => {
                if (!pinballEntryList) return;
                try {
                    await navigator.clipboard.writeText(pinballEntryList);
                    showToast('명단을 복사했습니다.');
                } catch (err) {
                    // 클립보드를 막아둔 브라우저도 있으므로 안내만 한다
                    triggerAlert('복사가 막혀 있습니다.\n아래 칸을 눌러 전체 선택한 뒤 직접 복사해 주세요.');
                }
            };

            const myRosterEntry    = user ? pinballEntrants.find(e => e.uid === user.uid) : null;
            const myPinballMins    = myRosterEntry ? myRosterEntry.mins : 0;
            const myPinballTickets = myRosterEntry ? myRosterEntry.tickets : 0;

            const leaderboardTop5 = [...(usersList || [])]
                .filter(u => u && (u.totalStudyMins || 0) > 0)
                .sort((a, b) => (b.totalStudyMins || 0) - (a.totalStudyMins || 0))
                .slice(0, 5);

            const topMins = leaderboardTop5.length ? (leaderboardTop5[0].totalStudyMins || 1) : 1;

            const pendingUsersList   = (usersList || []).filter(u => u && u.status === 'pending');
            const activeUsersList    = (usersList || []).filter(u => u && u.status === 'active');
            const suspendedUsersList = (usersList || []).filter(u => u && u.status === 'suspended');

            const getDisplayUserList = () => {
                const rank = user?.rank || 1;
                // 정상 계정·캐릭터 목록은 최고 관리자만 볼 수 있다
                if ((adminUserSubTab === 'active' || adminUserSubTab === 'pets') && rank !== 4) return [];
                const targetList = adminUserSubTab === "pending"   ? pendingUsersList
                                 : adminUserSubTab === "suspended" ? suspendedUsersList
                                 : adminUserSubTab === "pets"      ? (usersList || [])
                                 : activeUsersList;
                return targetList.filter(u => {
                    if(!u) return false;
                    const q = userSearchQuery || "";
                    return (u.name || "").includes(q) || (u.email || "").includes(q) || (u.position || "").includes(q) || (u.grade || "").includes(q);
                });
            };
            const filteredDisplayUsers = getDisplayUserList();

            // 🔥 필터 바 (과목이 '전체'일 때 선택과목 숨김)
            const renderFilterBar = () => {
                const availableMainSubjects = activeGradeFilter === "전체"
                    ? ["전체", ...new Set(Object.values(CURRICULUM).flatMap(g => Object.keys(g)))]
                    : ["전체", ...Object.keys(CURRICULUM[activeGradeFilter])];

                let subSubjectsList = [];

                if (activeSubjectFilter !== "전체") {
                    if (activeGradeFilter === "전체") {
                        subSubjectsList = [...new Set(Object.values(CURRICULUM).flatMap(g => g[activeSubjectFilter] || []))];
                    } else {
                        subSubjectsList = CURRICULUM[activeGradeFilter][activeSubjectFilter] || [];
                    }
                }

                const availableSubSubjects = subSubjectsList.length > 0 ? ["전체", ...subSubjectsList] : [];

                const Label = ({ children, alt }) => (
                    <span className="eyebrow text-[9px] shrink-0 w-[52px]" style={alt ? { color: 'var(--gold)' } : {}}>{children}</span>
                );

                return (
                    <div className="glass rounded-3xl p-5 flex flex-col gap-3.5 reveal d3">
                        <div className="flex flex-wrap gap-2 items-center">
                            <Label>Grade</Label>
                            {["전체", "1학년", "2학년", "3학년"].map(g => (
                                <button key={g} onClick={() => { setActiveGradeFilter(g); setActiveSubjectFilter("전체"); setActiveSubSubjectFilter("전체"); }} className={`chip ${activeGradeFilter === g ? 'on' : ''}`}>{g}</button>
                            ))}
                        </div>
                        <div className="divider"></div>
                        <div className="flex flex-wrap gap-2 items-center">
                            <Label>Subject</Label>
                            {availableMainSubjects.map(s => (
                                <button key={s} onClick={() => { setActiveSubjectFilter(s); setActiveSubSubjectFilter("전체"); }} className={`chip ${activeSubjectFilter === s ? 'on' : ''}`}>{s}</button>
                            ))}
                        </div>
                        {availableSubSubjects.length > 0 && (
                            <>
                                <div className="divider"></div>
                                <div className="flex flex-wrap gap-2 items-center reveal">
                                    <Label alt>Detail</Label>
                                    {availableSubSubjects.map(ss => (
                                        <button key={ss} onClick={() => setActiveSubSubjectFilter(ss)} className={`chip ${activeSubSubjectFilter === ss ? 'on-alt' : ''}`}>{ss}</button>
                                    ))}
                                </div>
                            </>
                        )}
                    </div>
                );
            };

            /* ── 로딩 스플래시 ─────────────────────── */
            if (isFirebaseLoading) {
                return (
                    <div className="flex flex-col items-center justify-center min-h-screen">
                        <div className="relative mb-8 reveal">
                            <Mark size={78} />
                        </div>
                        <div className="w-8 h-8 rounded-full border-2 border-transparent spin-ring mb-5"
                             style={{ borderTopColor: 'var(--brand)', borderRightColor: 'color-mix(in srgb, var(--lime) 25%, transparent)' }}></div>
                        <p className="eyebrow text-[10px] reveal d2">Secure Channel</p>
                        <p className="text-sm font-bold mt-2 reveal d3" style={{ color: 'var(--txt-dim)' }}>보안 통신 채널 연결 중...</p>
                    </div>
                );
            }

            /* ── 로그인 / 회원가입 ─────────────────── */
            if (!user) {
                return (
                    <div className="min-h-screen grid lg:grid-cols-[1.05fr_1fr]">
                        {/* 간판 패널 — 밤에 불 켜진 스터디카페 */}
                        <div className="relative hidden lg:flex flex-col justify-between p-12 xl:p-16 overflow-hidden">
                            <div className="flex items-center justify-between reveal">
                                <div className="flex items-center gap-3.5">
                                    <Mark size={40} accent />
                                    <div className="eyebrow text-[9px]">도계고등학교</div>
                                </div>
                                {themeToggle()}
                            </div>

                            <div className="max-w-xl">
                                <div className="flex items-center gap-2.5 mb-7 reveal d2">
                                    <span className="w-2 h-2 rounded-full live-dot" style={{ background: 'var(--lime)' }}></span>
                                    <span className="eyebrow text-[10px]">지금 불 켜져 있음</span>
                                </div>

                                <h1 className="wordmark sign-on text-[5.5rem] xl:text-[6.8rem] leading-[.92] neon-lime">
                                    {BRAND}
                                </h1>

                                {/* 열 마리 모두 알로 옹기종기.
                                    무슨 사이트인지 말로 설명하는 대신 얼굴을 보여 준다.
                                    로그인 전에는 서버에서 아무것도 못 읽으므로(규칙이 막는다) 그림이 제일 낫다. */}
                                <div className="egg-nest flex items-end mt-10 reveal d5" aria-hidden="true">
                                    {PETS.map((_, i) => (
                                        <div key={i} className="shrink-0"
                                             style={{
                                                 marginLeft: i === 0 ? 0 : '-14px',
                                                 zIndex: i % 2 ? 1 : 2,
                                                 transform: `translateY(${EGG_LIFT[i]}px)`,
                                                 animationDelay: `${(-i * 0.37).toFixed(2)}s`
                                             }}>
                                            <Pet petId={i} mins={0} size={54} ground={false} />
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div className="eyebrow text-[9px] reveal d8">© {new Date().getFullYear()} {BRAND}</div>
                        </div>

                        {/* 인증 카드 */}
                        <div className="flex items-center justify-center p-5 sm:p-10">
                            <div ref={heroRef} onMouseMove={handleHeroMove}
                                 className="glass spotlight rounded-[28px] p-8 sm:p-10 w-full max-w-md reveal d2 topline">
                                <div className="text-center mb-8 lg:hidden">
                                    <div className="flex justify-end mb-2">{themeToggle()}</div>
                                    <div className="inline-block mb-4"><Mark size={58} accent /></div>
                                    <div className="wordmark text-[3rem] leading-none sign-on neon-lime">{BRAND}</div>
                                    <p className="eyebrow text-[9px] mt-3">도계고등학교</p>
                                </div>

                                <div className="hidden lg:block mb-8">
                                    <p className="eyebrow text-[9px] mb-2">{isLoginView ? 'Welcome back' : 'Join'}</p>
                                    <h2 className="text-2xl font-extrabold tracking-tight">
                                        {isLoginView ? '다시 만나서 반가워요' : '삐릿빠릿에 합류하기'}
                                    </h2>
                                    <p className="text-xs mt-2" style={{ color: 'var(--txt-faint)' }}>
                                        가입 후 관리자 승인을 받으면 이용할 수 있어요.
                                    </p>
                                </div>

                                <div className="seg grid-cols-2 mb-7" style={{ gridTemplateColumns: 'repeat(2, minmax(0,1fr))' }}>
                                    <div className="seg-ind" style={{ width: 'calc((100% - 10px) / 2)', transform: `translateX(${isLoginView ? 0 : 100}%)` }}></div>
                                    <button onClick={() => setIsLoginView(true)}  className={`seg-btn ${isLoginView ? 'on' : ''}`}>인증 로그인</button>
                                    <button onClick={() => setIsLoginView(false)} className={`seg-btn ${!isLoginView ? 'on' : ''}`}>신규 학생 등록</button>
                                </div>

                                {isLoginView ? (
                                    <form onSubmit={handleLogin} className="space-y-3.5" key="login">
                                        <div className="reveal d1">
                                            <label className="eyebrow text-[9px] block mb-2">Email</label>
                                            <input type="email" placeholder="you@example.com" value={loginEmail} onChange={(e) => setLoginEmail(e.target.value)} className="fld" />
                                        </div>
                                        <div className="reveal d2">
                                            <label className="eyebrow text-[9px] block mb-2">Password</label>
                                            <input type="password" placeholder="••••••••" value={loginPassword} onChange={(e) => setLoginPassword(e.target.value)} className="fld" />
                                        </div>
                                        <button type="submit" disabled={authBusy} className="btn btn-primary w-full font-extrabold py-3.5 rounded-2xl text-sm mt-2 reveal d3">
                                            {authBusy ? '확인 중...' : <>아카이브 출입 <i className="fa-solid fa-arrow-right-long ml-1.5"></i></>}
                                        </button>
                                        <button type="button" onClick={handleResetPassword} className="w-full text-[11px] font-semibold pt-1 reveal d4 transition-colors" style={{ color: 'var(--txt-faint)' }}>
                                            비밀번호를 잊으셨나요?
                                        </button>
                                    </form>
                                ) : (
                                    <form onSubmit={handleSignUp} className="space-y-3.5" key="signup">
                                        <div className="grid grid-cols-2 gap-3 reveal d1">
                                            <input type="text" placeholder="이름 (실명)" value={signUpName} onChange={(e) => setSignUpName(e.target.value)} className="fld" />
                                            <select value={signUpGrade} onChange={(e) => setSignUpGrade(e.target.value)} className="fld">
                                                <option value="1학년">1학년</option><option value="2학년">2학년</option><option value="3학년">3학년</option>
                                            </select>
                                        </div>
                                        <input type="email" placeholder="이메일 주소" value={signUpEmail} onChange={(e) => setSignUpEmail(e.target.value)} className="fld reveal d2" />
                                        <input type="password" placeholder="비밀번호 지정 (8자리 이상)" value={signUpPassword} onChange={(e) => setSignUpPassword(e.target.value)} className="fld reveal d3" />
                                        <input type="password" placeholder="비밀번호 재확인" value={signUpPasswordConfirm} onChange={(e) => setSignUpPasswordConfirm(e.target.value)} className="fld reveal d4" />
                                        <button type="submit" disabled={authBusy} className="btn btn-dark w-full font-extrabold py-3.5 rounded-2xl text-sm mt-2 reveal d5">
                                            {authBusy ? '가입 처리 중...' : '신규 정보 가입'}
                                        </button>
                                        <p className="text-[10px] leading-relaxed pt-1" style={{ color: 'var(--txt-faint)' }}>
                                            가입 후 인증 메일이 발송됩니다. 메일 인증을 마치고 관리자 승인을 받으면 이용할 수 있습니다.
                                        </p>
                                    </form>
                                )}

                                <div className="divider my-7"></div>
                                <p className="text-[10px] text-center leading-relaxed" style={{ color: 'var(--txt-faint)' }}>
                                    가입 정보는 구성원 확인 용도로만 사용됩니다.
                                </p>
                            </div>
                        </div>

                        {toast && (
                            <div className="toast fixed bottom-6 right-6 z-[99] glass-solid rounded-2xl py-3.5 px-5 text-xs font-bold flex items-center gap-3">
                                <span className="w-1.5 h-8 rounded-full" style={{ background: 'var(--lime)' }}></span>
                                {toast.message}
                            </div>
                        )}
                        {customAlert && (
                            <div className="modal-bd fixed inset-0 bg-black/70 backdrop-blur-md flex items-center justify-center z-[100] p-4">
                                <div className="modal-card glass-solid p-7 rounded-3xl max-w-sm w-full text-center">
                                    <div className="w-11 h-11 mx-auto mb-4 rounded-2xl grid place-items-center" style={{ background: 'color-mix(in srgb, var(--lime) 13%, transparent)' }}>
                                        <i className="fa-solid fa-shield-halved" style={{ color: 'var(--brand-lt)' }}></i>
                                    </div>
                                    <h3 className="font-extrabold mb-2 text-sm">{customAlert.title}</h3>
                                    <p className="text-xs mb-6 whitespace-pre-wrap leading-relaxed" style={{ color: 'var(--txt-dim)' }}>{customAlert.message}</p>
                                    <button onClick={() => setCustomAlert(null)} className="btn btn-dark w-full text-xs font-bold py-3 rounded-xl">확인</button>
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            /* ── 승인 대기 화면 ────────────────────────────────────────
               가입은 누구나 할 수 있지만, 관리자가 승인하기 전에는
               자료를 볼 수 없다. 화면에서 막는 동시에 보안 규칙이
               서버에서 동일하게 차단한다. */
            if (user.status !== 'active') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-5">
                        <div className="glass topline rounded-[28px] p-9 sm:p-11 w-full max-w-lg text-center reveal">
                            <div className="inline-block mb-6"><Mark size={64} /></div>
                            <div className="eyebrow text-[9px] mb-3">Pending Approval</div>
                            <h1 className="text-2xl font-extrabold tracking-tight mb-3">승인을 기다리는 중이에요</h1>
                            <p className="text-sm leading-relaxed mb-8" style={{ color: 'var(--txt-dim)' }}>
                                <span className="font-mono text-xs">{user.email}</span> 계정으로 가입이 접수되었습니다.<br />
                                관리자가 확인하면 바로 이용할 수 있어요.
                            </p>

                            <div className="glass rounded-2xl p-5 mb-6 text-left space-y-3.5">
                                <div className="flex items-center gap-3">
                                    <span className="w-6 h-6 rounded-lg grid place-items-center shrink-0"
                                          style={{ background: emailVerified ? 'color-mix(in srgb, var(--lime) 16%, transparent)' : 'color-mix(in srgb, var(--gold) 16%, transparent)' }}>
                                        <i className={`fa-solid ${emailVerified ? 'fa-check' : 'fa-hourglass-half'} text-[10px]`}
                                           style={{ color: emailVerified ? 'var(--brand-lt)' : 'var(--gold)' }}></i>
                                    </span>
                                    <div className="flex-1 min-w-0">
                                        <div className="text-xs font-bold">이메일 인증</div>
                                        <div className="text-[11px]" style={{ color: 'var(--txt-faint)' }}>
                                            {emailVerified ? '완료되었습니다.' : '메일함의 링크를 눌러주세요.'}
                                        </div>
                                    </div>
                                    {!emailVerified && (
                                        <button onClick={handleResendVerification} className="btn btn-ghost px-3 py-1.5 rounded-lg text-[10px] font-bold shrink-0">재발송</button>
                                    )}
                                </div>
                                <div className="divider"></div>
                                <div className="flex items-center gap-3">
                                    <span className="w-6 h-6 rounded-lg grid place-items-center shrink-0" style={{ background: 'color-mix(in srgb, var(--gold) 16%, transparent)' }}>
                                        <i className="fa-solid fa-hourglass-half text-[10px]" style={{ color: 'var(--gold)' }}></i>
                                    </span>
                                    <div className="flex-1 min-w-0">
                                        <div className="text-xs font-bold">관리자 승인</div>
                                        <div className="text-[11px]" style={{ color: 'var(--txt-faint)' }}>
                                            {user.status === 'suspended' ? '이용이 제한된 계정입니다.' : '대기 중입니다.'}
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div className="flex gap-2.5">
                                <button onClick={handleRefreshProfile} className="btn btn-primary flex-1 font-bold py-3.5 rounded-2xl text-sm">
                                    <i className="fa-solid fa-rotate mr-2 text-xs"></i>승인 확인
                                </button>
                                <button onClick={handleLogout} className="btn btn-ghost px-6 py-3.5 rounded-2xl text-sm font-bold">로그아웃</button>
                            </div>

                            <div className="divider my-7"></div>
                            <button onClick={handleClaimAdmin} className="text-[11px] font-semibold transition-colors" style={{ color: 'var(--txt-faint)' }}>
                                관리자 계정이신가요? 권한 활성화
                            </button>
                        </div>

                        {toast && (
                            <div className="toast fixed bottom-6 right-6 z-[99] glass-solid rounded-2xl py-3.5 px-5 text-xs font-bold flex items-center gap-3">
                                <span className="w-1.5 h-8 rounded-full" style={{ background: 'var(--lime)' }}></span>
                                {toast.message}
                            </div>
                        )}
                        {customAlert && (
                            <div className="modal-bd fixed inset-0 bg-black/75 backdrop-blur-md flex items-center justify-center z-[100] p-4">
                                <div className="modal-card glass-solid p-7 rounded-3xl max-w-sm w-full text-center">
                                    <h3 className="font-extrabold mb-2 text-sm">{customAlert.title}</h3>
                                    <p className="text-xs mb-6 whitespace-pre-wrap leading-relaxed" style={{ color: 'var(--txt-dim)' }}>{customAlert.message}</p>
                                    <button onClick={()=>setCustomAlert(null)} className="btn btn-dark w-full text-xs font-bold py-3 rounded-xl">확인</button>
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            const currentUserRank = user.rank || 1;
            const myStudyMins = user.totalStudyMins || 0;

            const MAIN_TABS = [
                { key: 'pet',       label: '내 캐릭터',     short: '캐릭터', icon: 'fa-paw' },
                { key: 'studyRoom', label: '온라인 자습실', short: '자습실', icon: 'fa-stopwatch' },
                { key: 'materials', label: '학습 자료실',   short: '자료실', icon: 'fa-folder-open' },
                { key: 'vocab',     label: '영어 단어장',   short: '단어장', icon: 'fa-book-open' },
                { key: 'qna',       label: '요구사항',      short: '요구',   icon: 'fa-circle-question' },
                { key: 'pinball',   label: '내 응모권',     short: '응모권', icon: 'fa-ticket' }
            ];
            const tabIndex = Math.max(0, MAIN_TABS.findIndex(t => t.key === activeMainTab));

            /* 내가 낸 인증 기록.
               임원은 전체를 이미 받고 있으므로 거기서 골라 쓰고,
               일반 학생은 따로 구독한 목록을 쓴다. */
            const myStudyRecords = ((user?.rank || 1) >= 2
                ? (studyRecords || []).filter(r => r && r.userUid === user.uid)
                : (myRecords || [])
            ).slice().sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

            /* 최근 14일 막대그래프. 승인된 기록만 센다 — 화면의 누적 시간과 어긋나면 안 된다. */
            const studyChart = (() => {
                const DAYS = 14;
                const now = new Date();
                const today = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
                const bars = [];
                for (let i = DAYS - 1; i >= 0; i--) {
                    const from = today - i * 86400000;
                    bars.push({ from, to: from + 86400000, mins: 0, d: new Date(from) });
                }
                myStudyRecords.forEach((r) => {
                    if (!r || r.status !== 'approved' || !r.timestamp) return;
                    const b = bars.find(x => r.timestamp >= x.from && r.timestamp < x.to);
                    if (b) b.mins += (r.durationMins || 0);
                });
                const top = Math.max(60, ...bars.map(b => b.mins));
                const total = bars.reduce((a, b) => a + b.mins, 0);
                const studied = bars.filter(b => b.mins > 0).length;
                return { bars, top, total, studied };
            })();

            const ringR = 84;
            const ringC = 2 * Math.PI * ringR;
            const ringProgress = (elapsedSecs % 3600) / 3600;

            /* ── 초기화 (최고 관리자 전용) ──────────────────────────
               시험 주기마다 기록을 비우기 위한 도구.
               되돌릴 수 없으므로 지울 건수를 먼저 보여주고 확인을 받는다. */
            const RESET_CHUNK = 400;   // Firestore 일괄 쓰기 한 번에 담는 최대치

            const resetCutMs = (dateStr) => dateStr ? new Date(dateStr + 'T23:59:59').getTime() : null;

            const hoursResetTargets = (() => {
                const cut = resetCutMs(resetHoursDate);
                if (!cut) return [];
                return (studyRecords || []).filter(r => r && (r.timestamp || 0) <= cut);
            })();

            const matsResetTargets = (() => {
                if (!resetMatsDate) return [];
                return (materials || []).filter(m => m && (m.date || '9999') <= resetMatsDate);
            })();

            // 문서를 일괄 삭제한다. 한 건씩 지우면 수천 건에서 한참 걸린다.
            const bulkDelete = async (collectionName, ids, onProgress) => {
                const { doc, deleteDoc, writeBatch } = window.firebaseMethods;
                const path = (id) => doc(window.db, 'artifacts', window.appId, 'public', 'data', collectionName, id);
                let done = 0;
                for (let i = 0; i < ids.length; i += RESET_CHUNK) {
                    const slice = ids.slice(i, i + RESET_CHUNK);
                    if (writeBatch) {
                        const batch = writeBatch(window.db);
                        slice.forEach(id => batch.delete(path(id)));
                        await batch.commit();
                    } else {
                        await Promise.all(slice.map(id => deleteDoc(path(id)).catch(() => {})));
                    }
                    done += slice.length;
                    onProgress(Math.round((done / ids.length) * 100));
                }
            };

            const doResetHours = async (targets, alsoTotals) => {
                setResetBusy(true); setResetProgress(1);
                let photoFailed = 0;
                try {
                    /* 사진부터 지운다.
                       기록을 먼저 지우면 사진 주소를 잃어버려 영영 못 찾는 파일이 된다.
                       예전 기록에는 경로가 없으므로 내려받기 주소로 대신 가리킨다. */
                    const { ref, deleteObject } = window.firebaseMethods;
                    if (ref && deleteObject && window.storage) {
                        const spots = targets
                            .map(r => r && (r.proofPath || r.proofUrl))
                            .filter(Boolean);
                        for (let i = 0; i < spots.length; i += 20) {
                            await Promise.all(spots.slice(i, i + 20).map(p =>
                                deleteObject(ref(window.storage, p)).catch(() => { photoFailed++; })));
                            setResetProgress(Math.round((i / Math.max(1, spots.length)) * 40));
                        }
                    }

                    await bulkDelete('study_records', targets.map(r => r.id),
                                     (p) => setResetProgress(40 + Math.round(p * 0.6)));

                    let failed = 0;
                    if (alsoTotals) {
                        const { doc, updateDoc } = window.firebaseMethods;
                        const list = (usersList || []).filter(u => u && (u.totalStudyMins || 0) > 0);
                        for (let i = 0; i < list.length; i += 20) {
                            await Promise.all(list.slice(i, i + 20).map(u =>
                                updateDoc(doc(window.db, 'artifacts', window.appId, 'public', 'data', 'users', u.id),
                                          { totalStudyMins: 0 }).catch(() => { failed++; })));
                        }
                    }

                    // 지운 기록만큼 응모권도 줄어야 하므로 명단을 다시 올린다.
                    const goneIds = new Set(targets.map(r => r.id));
                    await publishRoster(null, (studyRecords || []).filter(r => r && !goneIds.has(r.id)));

                    setResetHoursDate(''); setResetHoursTotals(false);
                    // 누적 시간은 서버가 최고 관리자 계정에만 허용한다.
                    // 막혔는데 성공했다고 알리면 안 되므로 실패 건수를 그대로 알린다.
                    if (failed > 0) {
                        triggerAlert(
                            `기록 ${targets.length}건은 지웠지만, 학생 ${failed}명의 누적 시간은 서버가 막았습니다.\n\n` +
                            '누적 시간 초기화는 최고 관리자 계정으로만 됩니다.\n그 계정으로 다시 시도해 주세요.',
                            '일부만 처리되었습니다');
                    } else if (photoFailed > 0) {
                        triggerAlert(
                            `기록 ${targets.length}건을 지웠습니다.\n\n` +
                            `다만 인증 사진 ${photoFailed}장은 지우지 못했습니다.\n` +
                            '저장소에 남아 요금이 계속 나가니, 파이어베이스 콘솔의 Storage 에서 확인해 주세요.',
                            '사진 일부가 남았습니다');
                    } else {
                        showToast(`기록 ${targets.length}건과 인증 사진을 정리했습니다.`);
                    }
                } catch (err) {
                    triggerAlert('정리 중 오류가 났습니다. 일부만 지워졌을 수 있으니 건수를 다시 확인해 주세요.');
                }
                setResetBusy(false); setResetProgress(0);
            };

            const handleResetHours = () => {
                if (currentUserRank !== 4) return triggerAlert('최고 관리자만 할 수 있습니다.');
                if (!resetHoursDate) return triggerAlert('기준 날짜를 골라주세요.');
                if (hoursResetTargets.length === 0) return triggerAlert('그 날짜까지 지울 기록이 없습니다.');
                triggerConfirm(
                    `${resetHoursDate}까지의 승인 기록 ${hoursResetTargets.length}건을 영구 삭제합니다.\n\n` +
                    (resetHoursTotals
                        ? '학생 전원의 누적 시간도 0으로 되돌립니다.\n캐릭터가 모두 «알» 단계로 돌아갑니다.'
                        : '학생 누적 시간과 캐릭터는 그대로 둡니다.') +
                    '\n\n되돌릴 수 없습니다.',
                    () => doResetHours(hoursResetTargets, resetHoursTotals),
                    '공부시간 초기화');
            };

            const doResetMaterials = async (targets) => {
                setResetBusy(true); setResetProgress(1);
                try {
                    // 저장소 파일부터 지운다. 문서만 지우면 파일이 남아 요금이 계속 나간다.
                    const { ref, deleteObject } = window.firebaseMethods;
                    const files = targets.flatMap(m =>
                        (m.attachments || [{ fileName: m.fileName }])
                            .filter(a => a && a.fileName)
                            .map(a => `materials/${m.id}_${a.fileName}`));
                    for (let i = 0; i < files.length; i += 20) {
                        await Promise.all(files.slice(i, i + 20).map(p =>
                            deleteObject(ref(window.storage, p)).catch(() => {})));
                        setResetProgress(Math.round((i / Math.max(1, files.length)) * 50));
                    }

                    await bulkDelete('materials', targets.map(m => m.id), (p) => setResetProgress(50 + p / 2));
                    showToast(`자료 ${targets.length}건과 첨부파일을 정리했습니다.`);
                    setResetMatsDate('');
                } catch (err) {
                    triggerAlert('정리 중 오류가 났습니다. 일부만 지워졌을 수 있습니다.');
                }
                setResetBusy(false); setResetProgress(0);
            };

            const handleResetMaterials = () => {
                if (currentUserRank !== 4) return triggerAlert('최고 관리자만 할 수 있습니다.');
                if (!resetMatsDate) return triggerAlert('기준 날짜를 골라주세요.');
                if (matsResetTargets.length === 0) return triggerAlert('그 날짜까지 지울 자료가 없습니다.');
                const fileCount = matsResetTargets.reduce((a, m) => a + ((m.attachments || [1]).length), 0);
                triggerConfirm(
                    `${resetMatsDate}까지 올라온 자료 ${matsResetTargets.length}건과 첨부파일 ${fileCount}개를 영구 삭제합니다.\n\n` +
                    '학생들이 올린 자료가 사라지고 되돌릴 수 없습니다.\n정말 진행할까요?',
                    () => doResetMaterials(matsResetTargets),
                    '자료 초기화');
            };

            const hh = Math.floor(elapsedSecs / 3600);
            const mm = Math.floor((elapsedSecs % 3600) / 60);
            const ss = elapsedSecs % 60;

            return (
                <div className="flex flex-col min-h-screen">
                    {/* ── 헤더 ───────────────────────────── */}
                    <header className={`hdr ${scrolled ? 'on' : ''} sticky top-0 z-40 border-b border-transparent backdrop-blur-xl`}>
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-[68px] flex items-center justify-between gap-4">
                            <div className="flex items-center gap-2.5 sm:gap-3.5 min-w-0 shrink">
                                <Mark size={36} />
                                <div className="min-w-0">
                                    <div className="flex items-center gap-2">
                                        <span className="wordmark text-[17px] sm:text-[22px] neon-lime">{BRAND}</span>
                                        {!isLocalMode
                                            ? <span className="tag tag-brand hidden sm:inline-flex"><span className="w-1.5 h-1.5 rounded-full live-dot" style={{ background: 'var(--lime)' }}></span>SYNCED</span>
                                            : <span className="tag tag-neutral">OFFLINE</span>}
                                    </div>
                                    <div className="eyebrow text-[8px] mt-1 hidden sm:block">도계고등학교</div>
                                </div>
                            </div>

                            <div className="flex items-center gap-2 sm:gap-3">
                                <div className="hidden md:flex items-center gap-2.5 glass rounded-2xl pl-3.5 pr-1.5 py-1.5">
                                    <i className="fa-solid fa-fire text-[11px]" style={{ color: 'var(--brand-lt)' }}></i>
                                    <span className="text-[11px] font-bold font-mono" style={{ color: 'var(--txt-dim)' }}>{fmtHM(myStudyMins)}</span>
                                    <span className="w-px h-4" style={{ background: 'var(--line-str)' }}></span>
                                    <button onClick={openProfileEditor} title="프로필 수정"
                                            className="flex items-center gap-1.5 rounded-xl px-2 py-1 -my-0.5 transition-colors hover:bg-white/10 group">
                                        {currentUserRank >= 2 && (
                                            <span className={`tag ${currentUserRank === 4 ? 'tag-violet' : currentUserRank === 3 ? 'tag-blue' : 'tag-brand'}`}>{user.position}</span>
                                        )}
                                        <span className="text-xs font-extrabold">{user.name}</span>
                                        <i className="fa-solid fa-pen text-[9px] opacity-0 group-hover:opacity-100 transition-opacity" style={{ color: 'var(--txt-faint)' }}></i>
                                    </button>
                                </div>

                                <button onClick={openProfileEditor} className="md:hidden text-xs font-extrabold truncate max-w-[90px]" title="프로필 수정">{user.name}</button>

                                {themeToggle()}

                                {currentUserRank >= 2 && (
                                    <button onClick={() => { setIsAdminConsoleOpen(true); setAdminTab("config"); }} className="icon-btn relative" title="관리자 시스템 오픈">
                                        <i className="fa-solid fa-sliders text-sm"></i>
                                        {((currentUserRank >= 3 && (studyRecords || []).filter(r => r && r.status === 'pending').length > 0) || pendingUsersList.length > 0) && (
                                            <span className="absolute top-1.5 right-1.5 w-1.5 h-1.5 rounded-full live-dot" style={{ background: 'var(--rose)' }}></span>
                                        )}
                                    </button>
                                )}
                                <button onClick={handleLogout} className="icon-btn danger" title="로그아웃">
                                    <i className="fa-solid fa-right-from-bracket text-sm"></i>
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* ── 공지 & D-Day 티커 ──────────────── */}
                    {(noticeText || (schedule || []).length > 0 || (ddaySettings && (ddaySettings.csat || ddaySettings.examDate))) && (
                        <div className="border-b" style={{ borderColor: 'var(--line)', background: 'color-mix(in srgb, var(--lime) 6%, transparent)' }}>
                            <div className="max-w-7xl mx-auto py-2.5 px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row sm:items-center gap-3">
                                {noticeText && (
                                    <div className="flex items-center gap-3 min-w-0 flex-1">
                                        <span className="tag tag-brand shrink-0">
                                            <span className="w-1.5 h-1.5 rounded-full live-dot" style={{ background: 'var(--brand-lt)' }}></span>NOTICE
                                        </span>
                                        {noticeText.length > 34 ? (
                                            <div className="ticker">
                                                <div className="ticker-track">
                                                    <span className="text-xs font-semibold" style={{ color: 'var(--txt-dim)' }}>{noticeText}</span>
                                                    <span className="text-xs font-semibold" style={{ color: 'var(--txt-dim)' }} aria-hidden="true">{noticeText}</span>
                                                </div>
                                            </div>
                                        ) : (
                                            <span className="text-xs font-semibold truncate" style={{ color: 'var(--txt-dim)' }}>{noticeText}</span>
                                        )}
                                    </div>
                                )}
                                <div className="flex items-center gap-2 shrink-0 flex-wrap">
                                    {(schedule || []).length > 0 && (
                                        <button type="button" onClick={() => setIsScheduleOpen(true)}
                                                className="glass rounded-xl px-3 py-1.5 flex items-center gap-2 text-[11px] font-bold lift">
                                            <i className="fa-regular fa-calendar text-[10px]" style={{ color: 'var(--cyan-ink)' }}></i>
                                            <span style={{ color: 'var(--txt-dim)' }}>학사일정</span>
                                        </button>
                                    )}
                                    {ddaySettings?.csat && (
                                        <span className="glass rounded-xl px-3 py-1.5 flex items-center gap-2 text-[11px] font-bold lift">
                                            <span style={{ color: 'var(--txt-faint)' }}>수능</span>
                                            <span className="font-mono font-extrabold" style={{ color: 'var(--gold)' }}>{calculateDday(ddaySettings.csat)}</span>
                                        </span>
                                    )}
                                    {ddaySettings?.examDate && (
                                        <span className="glass rounded-xl px-3 py-1.5 flex items-center gap-2 text-[11px] font-bold lift">
                                            <span className="truncate max-w-[100px]" style={{ color: 'var(--txt-faint)' }}>{ddaySettings.examName}</span>
                                            <span className="font-mono font-extrabold" style={{ color: 'var(--brand-lt)' }}>{calculateDday(ddaySettings.examDate)}</span>
                                        </span>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ── 학사일정 창 ────────────────────── */}
                    {isScheduleOpen && (() => {
                        const all = (schedule || []).slice().sort((a, b) => (a.date || '').localeCompare(b.date || ''));
                        const years = Array.from(new Set(all.map(it => (it.date || '').slice(0, 4)).filter(Boolean))).sort();
                        const pick = years.includes(String(scheduleYear)) ? String(scheduleYear) : (years[years.length - 1] || String(scheduleYear));
                        const rows = all.filter(it => (it.date || '').startsWith(pick));

                        // 달별로 묶는다
                        const months = [];
                        rows.forEach((it) => {
                            const m = (it.date || '').slice(5, 7);
                            let g = months.find(x => x.m === m);
                            if (!g) { g = { m, items: [] }; months.push(g); }
                            g.items.push(it);
                        });

                        const nextUp = all.find(it => (daysUntil(it.date) ?? -1) >= 0);
                        const tone = { '시험': 'var(--rose)', '방학': 'var(--cyan-ink)', '휴일': 'var(--cyan-ink)',
                                       '행사': 'var(--brand-dp)', '기타': 'var(--txt-faint)' };

                        return (
                            <div className="modal-bd fixed inset-0 z-50 flex items-center justify-center p-4"
                                 onClick={() => setIsScheduleOpen(false)}>
                                <div className="modal-card glass-solid w-full max-w-2xl overflow-hidden"
                                     onClick={(e) => e.stopPropagation()}>

                                    <div className="p-5 sm:p-6 flex items-start justify-between gap-3 border-b" style={{ borderColor: 'var(--line)' }}>
                                        <div className="min-w-0">
                                            <div className="eyebrow text-[9px] mb-1">Calendar</div>
                                            <h3 className="text-lg font-extrabold tracking-tight">학사일정</h3>
                                            {nextUp && (
                                                <p className="text-[11px] mt-1.5" style={{ color: 'var(--txt-dim)' }}>
                                                    다음 일정은 <b>{nextUp.title}</b>,
                                                    <b className="ml-1" style={{ color: 'var(--brand-dp)' }}>
                                                        {daysUntil(nextUp.date) === 0
                                                            ? '오늘'
                                                            : <><span className="font-mono">{daysUntil(nextUp.date)}</span>일 뒤</>}
                                                    </b>
                                                </p>
                                            )}
                                        </div>
                                        <button onClick={() => setIsScheduleOpen(false)} className="icon-btn shrink-0" title="닫기">
                                            <i className="fa-solid fa-xmark"></i>
                                        </button>
                                    </div>

                                    {years.length > 1 && (
                                        <div className="px-5 sm:px-6 pt-4 flex gap-2 flex-wrap">
                                            {years.map(y => (
                                                <button key={y} onClick={() => setScheduleYear(Number(y))}
                                                        className="chip"
